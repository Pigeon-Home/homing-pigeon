[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-home-runner"
version = "1.4.4"
description = "Self-hosted, email-driven agent: tell your cloud SI to send signed jobs via email that execute on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ctf-gooo-003" }]
keywords = ["agent", "self-hosted", "email", "automation", "remote-execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
homing-pigeon = "runner.runner:main"
homing-pigeon-install = "runner.install:main"
homing-pigeon-send-job = "cloud.send_job:main"
homing-pigeon-auth = "runner.oauth:main"

[project.urls]
Homepage = "https://github.com/Pigeon-Home/homing-pigeon"

[tool.setuptools.packages.find]
include = ["runner*", "cloud*"]

[tool.setuptools.package-data]
runner = ["config.example.json"]
