[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-home-runner"
version = "3.7.16"
description = "Self-hosted, email-driven agent: tell your cloud SI to send signed jobs via email that execute on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pigeon-Home" }]
keywords = ["agent", "self-hosted", "email", "automation", "remote-execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
homing-pigeon = "runner.runner:main"
homing-pigeon-install = "runner.install:main"
homing-pigeon-send-job = "cloud.send_job:main"
homing-pigeon-auth = "runner.oauth:main"

[project.urls]
Homepage = "https://github.com/Pigeon-Home/homing-pigeon"
Repository = "https://github.com/Pigeon-Home/homing-pigeon"
Documentation = "https://github.com/Pigeon-Home/homing-pigeon#readme"
Changelog = "https://github.com/Pigeon-Home/homing-pigeon/releases"
"Bug Tracker" = "https://github.com/Pigeon-Home/homing-pigeon/issues"

[tool.setuptools.packages.find]
include = ["runner*", "cloud*"]

[tool.setuptools.package-data]
runner = ["config.example.json"]

[tool.mutmut]
source_paths = ["runner"]
# Core scope: security.py is the pure policy/audit logic (392 lines, ~7 min).
# Broader scopes were measured: 4 files (security/senses/dri/posture,
# 1567 mutants) extrapolates to ~45-50 min -- too slow for per-push CI.
# Full runner/ (~10k lines) would be hours. Expand deliberately.
only_mutate = ["runner/security.py"]
pytest_add_cli_args = [
    "-x",
    "-q",
    "-p", "no:cacheprovider",
    # Timing-sensitive: hostile-regex perf probe (73s); not mutation-relevant.
    "--deselect", "tests/test_policy_constraints.py::ArgsPatternTimingTest::test_hostile_pattern_rejected_at_parse",
]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
also_copy = ["cloud/", "docs/", "hardening/", ".github/", "PROTOCOL.md"]
