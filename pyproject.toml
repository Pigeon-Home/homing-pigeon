[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-home-runner"
version = "3.16.20.7"
description = "Self-hosted, email-driven agent: tell your cloud SI to send signed jobs via email that execute on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pigeon-Home" }]
keywords = ["agent", "self-hosted", "email", "automation", "remote-execution"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
homing-pigeon = "runner.runner:main"
homing-pigeon-install = "runner.ops.install:main"
homing-pigeon-send-job = "runner.cloud.send_job:main"
homing-pigeon-auth = "runner.wire.oauth:main"
homing-pigeon-host = "runner.hosting.cli:main"

[project.urls]
Homepage = "https://github.com/Pigeon-Home/homing-pigeon"
Repository = "https://github.com/Pigeon-Home/homing-pigeon"
Documentation = "https://github.com/Pigeon-Home/homing-pigeon#readme"
Changelog = "https://github.com/Pigeon-Home/homing-pigeon/releases"
"Bug Tracker" = "https://github.com/Pigeon-Home/homing-pigeon/issues"

[tool.setuptools.packages.find]
include = ["runner*"]
exclude = ["runner.tests", "runner.tests.*", "runner.tools", "runner.tools.*", "runner.extension*"]

[tool.setuptools.package-data]
runner = ["config.example.json"]
"runner.transport_extensions.dtls" = ["extension.json", "sources.json"]
"runner.transport_extensions.email" = ["extension.json", "sources.json"]
"runner.transport_extensions.file" = ["extension.json", "sources.json"]
"runner.transport_extensions.nats" = ["extension.json", "sources.json"]
"runner.transport_extensions.queues" = ["extension.json", "sources.json"]
