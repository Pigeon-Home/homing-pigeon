[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-home-runner"
version = "3.16.25.16"
description = "Self-hosted, email-driven agent: tell your cloud SI to send signed jobs via email that execute on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pigeon-Home" }]
keywords = ["agent", "self-hosted", "email", "automation", "remote-execution"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
homing-pigeon = "runner.runner:main"
homing-pigeon-install = "runner.ops.install:main"
homing-pigeon-send-job = "runner.cloud.send_job:main"
homing-pigeon-auth = "runner.wire.oauth:main"
homing-pigeon-host = "runner.hosting.cli:main"

[project.urls]
Homepage = "https://github.com/Pigeon-Home/homing-pigeon"
Repository = "https://github.com/Pigeon-Home/homing-pigeon"
Documentation = "https://github.com/Pigeon-Home/homing-pigeon#readme"
Changelog = "https://github.com/Pigeon-Home/homing-pigeon/releases"
"Bug Tracker" = "https://github.com/Pigeon-Home/homing-pigeon/issues"

[tool.setuptools.packages.find]
include = ["runner*"]
# The suite, the build tools and the shipped sense extensions never
# ship in the wheel (AGENTS.md, "Where things live"): the suite is
# development, the tools are the build's, and a sense is installed
# from the tree into the owner's extensions directory, never imported.
exclude = ["runner.tests", "runner.tests.*", "runner.tools", "runner.tools.*",
           "runner.extension*"]

[tool.setuptools.package-data]
runner = ["config.example.json"]
# The shipped transports are found by their manifests, and they bring
# their sources by their declarations (docs/steady/extensions.md, "Sources"):
# a wheel without these files has no transport at all.
"runner.transport_extensions.dtls" = ["extension.json", "sources.json"]
"runner.transport_extensions.email" = ["extension.json", "sources.json"]
"runner.transport_extensions.file" = ["extension.json", "sources.json"]
"runner.transport_extensions.nats" = ["extension.json", "sources.json"]
"runner.transport_extensions.queues" = ["extension.json", "sources.json"]

[tool.mutmut]
source_paths = ["runner"]
# Core scope: security.py is the pure policy/audit logic (392 lines, ~7 min).
# Broader scopes were measured: 4 files (security/senses/dri/posture,
# 1567 mutants) extrapolates to ~45-50 min -- too slow for per-push CI.
# Full runner/ (~10k lines) would be hours. Expand deliberately.
only_mutate = ["runner/guard/security.py"]
# The suite sits inside the source path (runner/tests/); it is the
# oracle that kills mutants, never a mutation target.
do_not_mutate = ["runner/tests/**", "runner/tools/**", "runner/extensions/**"]
pytest_add_cli_args = [
    "-x",
    "-q",
    "-p", "no:cacheprovider",
    # The suite is what `unittest discover -s runner/tests -t .` runs:
    # the folder beside it (the airgap sweep) is outside discovery
    # and must be outside pytest's collection here too. The archived
    # campaign probes sat under the same ignore until their removal
    # on 2026-11-01; while they existed, two archived files with the
    # same basename made pytest's collection fail, and under -x that
    # ended mutmut's coverage pass before any test ran, so only the
    # import-time lines of security.py counted as covered and three
    # mutants were generated where 443 had been (Q22).
    "--ignore=runner/tests/airgap",
    # Timing-sensitive: hostile-regex perf probe (73s); not mutation-relevant.
    "--deselect", "runner/tests/test_policy_constraints.py::ArgsPatternTimingTest::test_hostile_pattern_rejected_at_parse",
]
# The walk's oracle, narrowed by Q170: the test modules that
# load the mutated file (runner/guard/security.py), derived
# from the tree by runner/tools/mutation_oracle.py and pinned
# by runner/tests/test_mutation_oracle.py, which recomputes
# the derivation. Regenerate with that tool when it turns red;
# do not hand-edit the list. The whole suite was the oracle
# until 2026-11-12, and its baseline died in mutmut's stats
# pass on tests that measure the tree (Q170).
pytest_add_cli_args_test_selection = [
    "runner/tests/test_additional_negative_2026_10_15.py",
