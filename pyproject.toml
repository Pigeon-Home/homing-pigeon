    "docs/",
    # .github/ carries the CI pin file (.github/requirements-ci.txt,
    # which runner/tests/test_build_config.py reads). The CI tools
    # (runner/tools/; runner/tests/test_parallel_runner.py imports the
    # Windows shard runner at load time) come with source_paths.
    # mutmut's stats run dies if the mutant tree lacks the pin file.
    # Name the folder once: a nested entry would be copied over a copy.
    ".github/",
    # Root manuals. The doc guards locate the tree from the runner
    # package, and mutmut's copy is only source_paths plus this list
    # (plus pyproject.toml, which it adds itself; the suite in
    # runner/tests/ comes with source_paths). Without
    # these, stats collection dies on "INSTALL.md not found" before
    # any mutant runs.
    "AGENTS.md", "INSTALL.md",
    "PROTOCOL.md", "README.md",
    "SECURITY.md",
]
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Day-one set: pyflakes everywhere (F) plus pycodestyle
# errors (E) outside the grandfathered files below. The list grows
# only with a commit that keeps the gate green.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Grandfathered E501 debt, counted 2026-10-18: runner/runner.py 64,
# runner/ops/install.py 10, runner/cloud/send_job.py 3, runner/oracle/senses.py 1,
# runner/oracle/dri.py 1. New files conform from birth; these shrink as
# their files are touched. Do not add files to this list.
"runner/runner.py" = ["E501"]
"runner/ops/install.py" = ["E501"]
"runner/cloud/send_job.py" = ["E501"]
"runner/oracle/senses.py" = ["E501"]
"runner/oracle/dri.py" = ["E501"]
# The test suite's idiom: sys.path setup before imports (E402) and
# long scenario/fixture lines (E501) are deliberate there.
"runner/tests/**" = ["E402", "E501"]

[tool.pyrefly]
# Type-check gate: pyrefly (Meta's Rust checker). `pyrefly check`
# reads this table from pyproject.toml.
project-includes = [
    "runner/**/*.py",
]
# The suite (runner/tests/) is not part of the type gate.
project-excludes = [
    "runner/tests/**",
    "runner/tools/**",
    "runner/extensions/**",
]

# Sibling modules are imported in two forms: `from runner.wire.oauth import X`
# (primary) and `from oauth import X` (fallback when a file runs as
# __main__ from inside runner/). The fallback names resolve to nothing
# statically; treat them as Any instead of erroring.
ignore-missing-imports = [
    "oauth",
    "send_job",
    "_version",
    "install",
    "setup",
    "security",
    "senses",
    "sandbox",
    "review",
    "resources",
    "posture",
    "local_test",
    "harness",
    "dri",
    "auditreport",
    "winlog",
    "detection",
    "jobcrypto",
    # Role folders (runner/<role>/): the script-mode fallback imports
    # `from guard import ...`, `from wire.oauth import ...` and so on,
    # with runner/ on sys.path.
    "guard", "guard.*", "wire", "wire.*", "oracle", "oracle.*",
    "ops", "ops.*",
]

# Lenient to start: only check bodies of annotated functions.
# Unannotated code is still parsed (syntax, imports), but its bodies
# are not type-checked. Annotating a function opts it into checking.
check-unannotated-defs = false
