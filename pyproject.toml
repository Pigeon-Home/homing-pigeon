[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-home-runner"
version = "3.11.37"
description = "Self-hosted, email-driven agent: tell your cloud SI to send signed jobs via email that execute on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pigeon-Home" }]
keywords = ["agent", "self-hosted", "email", "automation", "remote-execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
homing-pigeon = "runner.runner:main"
homing-pigeon-install = "runner.install:main"
homing-pigeon-send-job = "cloud.send_job:main"
homing-pigeon-auth = "runner.oauth:main"

[project.urls]
Homepage = "https://github.com/Pigeon-Home/homing-pigeon"
Repository = "https://github.com/Pigeon-Home/homing-pigeon"
Documentation = "https://github.com/Pigeon-Home/homing-pigeon#readme"
Changelog = "https://github.com/Pigeon-Home/homing-pigeon/releases"
"Bug Tracker" = "https://github.com/Pigeon-Home/homing-pigeon/issues"

[tool.setuptools.packages.find]
include = ["runner*", "cloud*"]

[tool.setuptools.package-data]
runner = ["config.example.json"]

[tool.mutmut]
source_paths = ["runner"]
# Core scope: security.py is the pure policy/audit logic (392 lines, ~7 min).
# Broader scopes were measured: 4 files (security/senses/dri/posture,
# 1567 mutants) extrapolates to ~45-50 min -- too slow for per-push CI.
# Full runner/ (~10k lines) would be hours. Expand deliberately.
only_mutate = ["runner/security.py"]
pytest_add_cli_args = [
    "-x",
    "-q",
    "-p", "no:cacheprovider",
    # Timing-sensitive: hostile-regex perf probe (73s); not mutation-relevant.
    "--deselect", "tests/test_policy_constraints.py::ArgsPatternTimingTest::test_hostile_pattern_rejected_at_parse",
]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
also_copy = [
    # examples/ carries the shipped example extension, which
    # tests/test_extensions.py loads from the tree.
    "cloud/", "docs/", "examples/", "hardening/", ".github/",
    # Root manuals. The doc guards locate the tree from the runner
    # package, and mutmut's copy is only source_paths plus this list
    # (plus tests/ and pyproject.toml, which it adds itself). Without
    # these, stats collection dies on "INSTALL.md not found" before
    # any mutant runs.
    "AGENTS.md", "CONTRIBUTING.md", "ENTERPRISE.md", "FUTURE.md",
    "INSTALL.md",
    "PROTOCOL.md", "README.md", "RESEARCHER_IDENT.md", "RUNBOOK.md",
    "SAFEGUARDS.md", "SECURITY.md", "TRANSPORTS.md",
    "requirements-ci.txt",
    # The CI pin file. tests/test_build_config.py reads it, and
    # mutmut's stats run dies if the mutant tree does not have it.
    "requirements-ci.txt",
    # The Windows shard runner. tests/test_parallel_runner.py
    # imports it at load time, so stats collection dies if the
    # mutant tree does not have it.
    "tools/",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Day-one set: pyflakes everywhere (F) plus pycodestyle
# errors (E) outside the grandfathered files below. The list grows
# only with a commit that keeps the gate green.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Grandfathered E501 debt, counted 2026-10-18: runner/runner.py 64,
# runner/install.py 10, cloud/send_job.py 3, runner/senses.py 1,
# runner/dri.py 1. New files conform from birth; these shrink as
# their files are touched. Do not add files to this list.
"runner/runner.py" = ["E501"]
"runner/install.py" = ["E501"]
"cloud/send_job.py" = ["E501"]
"runner/senses.py" = ["E501"]
"runner/dri.py" = ["E501"]
# The test suite's idiom: sys.path setup before imports (E402) and
# long scenario/fixture lines (E501) are deliberate there.
"tests/**" = ["E402", "E501"]
