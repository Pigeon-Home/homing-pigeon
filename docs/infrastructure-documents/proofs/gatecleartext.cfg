\* Cleartext allowed: the process was started with the flag, so an
\* unencrypted job that verifies is let through, and the gate
\* writes the line that says so. Audience enforce. No earlier
\* configuration of this model turned AllowCleartext, so that
\* line was in no checked run before finding F16.
SPECIFICATION Spec
CONSTANT
  AudienceMode = "enforce"
  AllowCleartext = TRUE
  BindFirst = TRUE
INVARIANT
  P1Inv
  SensorInv
  AudienceWasRequired
  NamedByTheSignedId
  OneVersionBeforeTheBody
