\* The reader with the bar. The job may write 24, the pipe
\* holds 5, a read takes 3 at most, the result carries 6 and
\* the runner holds 9.
SPECIFICATION Spec
CONSTANT
  MaxWrite = 24
  PipeRoom = 5
  Chunk = 3
  Cap = 6
  Keep = 9
  Bounded = TRUE
INVARIANT
  TypeOK
  NothingIsLost
  HeldUnderTheBar
  HeldIsTheFirstPart
  TheResultIsAsItWas
  ACutIsATruncation
  NeverHeldWhole
