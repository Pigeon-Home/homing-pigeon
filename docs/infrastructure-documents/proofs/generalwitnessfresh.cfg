\* Expected to fail. A gate that took a job outside the
\* freshness window. Once a job is stale its record may leave,
\* and with the cache gone too the job runs a second time
\* with no priced window used: the window is what bounds a
\* replay. P1 breaks on the way, at the first stale run.
CONSTANTS
  PollRebuilds = TRUE
  SpawnProbes = TRUE
  GuardSparesFresh = TRUE
  GuardSparesCache = TRUE
  LocalFilesOnly = TRUE
  GateVerifies = TRUE
  GateFresh = FALSE
  GatePolicy = TRUE
  TransportGates = TRUE
  StartValidates = TRUE
  PrefersHybrid = TRUE
  SameSideOnly = TRUE
  FitMarks = TRUE
  LocalBounds = TRUE
SPECIFICATION Spec
INVARIANT P5Inv
