\* Expected to fail. A second run exists, and every path to
\* it uses a priced window of P5: the counterexample is a
\* crash, or a stash that cannot be written, between a run
\* and its record, and then a redelivery.
CONSTANTS
  PollRebuilds = TRUE
  SpawnProbes = TRUE
  GuardSparesFresh = TRUE
  GuardSparesCache = TRUE
  LocalFilesOnly = TRUE
SPECIFICATION Spec
INVARIANT NoSecondRun
