\* Expected to fail. A model that refuses every message would
\* satisfy P1Inv and prove nothing. This invariant says nothing
\* executes; TLC's counterexample is one handling that does.
\* Strong form, so the witness also has to satisfy audience enforce.
SPECIFICATION Spec
CONSTANT
  AudienceMode = "enforce"
  AllowCleartext = FALSE
INVARIANT
  NothingExecutes

\* The invariant lives in this file's companion only as a name
\* the spec must define. It is defined in Gate.tla as NothingExecutes.
