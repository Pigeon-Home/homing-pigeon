# Agent-Chat-Stamp: 50000c8e-1b3d-4f5a-9c7e-8d0b2a4c6e8f
#
# Nightly: move each feed sense's upstream pin to the current tip of
# its ref, fetch the pinned files, and run the drift tests against
# them. Green means the adapters still read what upstream writes, and
# the refreshed files land on main. Red means an upstream change broke
# an adapter's reading: nothing is committed, the job fails, and the
# test name says which sense and which field. The owner looks; the
# push waits for the fix.
#
# The budget (5 MiB over every upstream/ together) is enforced by the
# same tool, so a pin that balloons fails here instead of in a release.
name: upstream-pins

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-pins
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: resolve refs, fetch the pinned files
        run: python3 .github/tools/fetch_upstream.py --bump
      - name: nothing moved?
        id: diff
        run: |
          if git diff --quiet -- extensions; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- extensions
          fi
      - name: the adapters still read what upstream writes
        if: steps.diff.outputs.moved == 'true'
        run: python3 -m unittest -v runner.tests.test_upstream_pins runner.tests.test_extensions
      - name: commit the refreshed pins to main
        if: steps.diff.outputs.moved == 'true'
        run: |
          git config user.name "upstream-pins"
          git config user.email "upstream-pins@users.noreply.github.com"
          git add extensions
          git commit -F - <<'MSG'
          extensions: refresh upstream pins

          Nightly: each feed sense's upstream ref resolved to its
          current tip, the pinned files refetched, the drift tests
          green against them. See .github/workflows/upstream-pins.yml.

          Agent-Chat-Stamp: 50000c8e-1b3d-4f5a-9c7e-8d0b2a4c6e8f
          MSG
          git push origin HEAD:main
