# Agent-Stamp: 10000c2a-1d4e-4f7b-8a2c-9e5d6f7a8b9c
name: coverage

# The map of code no test runs, on Linux and Windows, kept current.
# Percentages say how much ran; runner/tools/coverage_gaps.py says
# what did not, by function, which is what a test is written against
# and what a campaign hunt aims at (docs/reports/v3.12.65/
# coverage-gaps.md, docs/use/questions.md Q11 on). Signal, not a gate:
# it never blocks a build or a release. The gaps report is uploaded
# per platform and its ten largest gaps are annotated on the run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One run at a time per ref, the newest push waiting behind it (as
# build.yml). Without a group every push queued its own run: with
# the campaign pushing a test a minute, 20 of these sat queued on
# 2026-10-25 and held the runner slots cut-release needed.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  map:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt hypothesis coverage
      # Linux: the sandbox paths only run where bwrap can start.
      - name: install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Child processes start coverage through a .pth hook, so the
      # runner, transport and sense extensions are measured too.
      - name: measure subprocesses
        shell: bash
        run: |
          site=$(python -c "import site; print(site.getsitepackages()[-1])")
          echo "import coverage; coverage.process_startup()" > "$site/hp-coverage.pth"
          echo "COVERAGE_PROCESS_START=$GITHUB_WORKSPACE/.github/coveragerc" >> "$GITHUB_ENV"
      - name: the suite under coverage
        shell: bash
        run: |
          set +e
          python -m coverage run --rcfile=.github/coveragerc -m unittest discover -s runner/tests -t . > suite.log 2>&1
          echo "suite exit $?"
          tail -3 suite.log
          exit 0
      - name: the gaps
        if: always()
        shell: bash
        run: |
          python -m coverage combine --rcfile=.github/coveragerc -q
          python -m coverage json --rcfile=.github/coveragerc -q -o coverage.json
          python runner/tools/coverage_gaps.py coverage.json --out coverage-gaps-${{ runner.os }}.md --title "${{ runner.os }}" --annotate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage-gaps-${{ runner.os }}.md
            coverage.json
            suite.log
