# Agent-Chat-Stamp: 50000c8e-1b3d-4f5a-9c7e-8d0b2a4c6e8f
#
# Cut a release from the command line: tag the version in
# pyproject.toml on a commit whose build is already green, then start
# the same pipeline a tag push would -- build.yml on the tag (the
# GitHub Release, PyPI, SourceForge, GitLab) and docker.yml for the
# image. The point-and-click path in docs/steady/use/use-runbook.md Job 4 is
# unchanged; this is the same release, started by `gh workflow run`.
#
# A tag pushed with the repository's own token does not fire the
# on-push workflows (GitHub's rule against runs that trigger runs),
# which is why this workflow dispatches them explicitly: a
# workflow_dispatch from that token is the one trigger it allows.
#
# Guards, in order: the tag must not exist; the version must match
# pyproject.toml, runner/_version.py, and runner/ops/install.py; and the
# build job on the commit must have concluded success, so a tag never
# lands before the build is green.
name: cut-release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to tag (default: the head of main)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    # The one job that writes: the tag it pushes (contents) and the
    # tag build it dispatches (actions). Granted here, exact, not at
    # the top (test_build_config, lift 5).
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || 'main' }}
          fetch-depth: 0
          # RELEASE_TOKEN (a fine-grained PAT with contents: write and
          # workflows: write) is the one credential GitHub lets push a
          # tag whose tree carries a workflow file GITHUB_TOKEN never
          # pushed. Unset, this is github.token and the REST path below
          # does the tagging.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: the version, and that every carrier agrees
        id: ver
        run: |
          set -euo pipefail
          ver=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          rv=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('runner/_version.py').read()).group(1))")
          iv=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('runner/ops/install.py').read()).group(1))")
          if [ "$ver" != "$rv" ] || [ "$ver" != "$iv" ]; then
            echo "::error::version drift: pyproject=$ver _version.py=$rv install.py=$iv"
            exit 1
          fi
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "cutting v$ver at $(git rev-parse --short HEAD)"

      - name: workflow files changed since the last tag?
        env:
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          # Information for the run page, not a gate. GITHUB_TOKEN
          # cannot push a tag whose tree carries a workflow file it
          # did not itself write (3.12.66 and 3.12.67 died at the push
          # with "refusing to allow a GitHub App to create or update
          # workflow .github/workflows/coverage.yml" the day that file
          # was added), and the rule is not "differs from main": the
          # head of main itself was refused. So the tag step below
          # goes through the REST API first, and through git with
          # RELEASE_TOKEN when the owner set one.
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$last" ]; then
            if [ "$(git rev-parse "$last:.github/workflows")" != "$(git rev-parse "$SHA:.github/workflows")" ]; then
              echo "::notice::.github/workflows changed since $last; the REST tag path (or RELEASE_TOKEN) carries it"
            fi
          fi

      - name: the tag does not exist yet
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; bump the version first"
            exit 1
          fi

      - name: same code as the last release?
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # A note, not a gate: the owner cuts releases as often as he
          # likes. But a tag whose diff since the last one touches
          # only the version carriers and the changelog is the same
          # code with a new number, and the run page should say so.
          last=$(git tag --list 'v*' --sort=-v:refname | grep -v "^$TAG\$" | head -n 1 || true)
          if [ -z "$last" ]; then
            echo "no earlier tag; nothing to compare"
            exit 0
          fi
          changed=$(git diff --name-only "$last" HEAD | grep -v -E '^(pyproject\.toml|runner/_version\.py|runner/ops/install\.py|runner/tests/test_install_edges\.py|docs/infrastructure-documents/changelog\.md)$' || true)
          if [ -z "$changed" ]; then
            echo "::warning title=same code::$TAG carries the same code as $last (only the version carriers and CHANGELOG changed)"
          else
            echo "$TAG changes $(echo "$changed" | wc -l) file(s) since $last"
          fi

      - name: the build on this commit is green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          # The `test` job of build.yml is the suite; the build-* jobs
          # are the binaries. Every one of them must have concluded
          # success on this exact commit. The verdict is read from
          # the build workflow's own run on the commit, never from
          # check runs by name: another workflow's job can share a
          # job's name (the Worker's suite was `test` too) and post
          # its check run after the suite's, and a gate that took
          # the newest check run named `test` would have read the
          # Worker's green over the suite's red.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${SHA}&per_page=20" \
            --jq '[.workflow_runs[] | {id, status, conclusion, run_attempt, event, head_branch}]' > runs.json
          python3 - <<'EOF'
          import json, os, subprocess, sys
          # A cancelled run was superseded by concurrency; it is not
          # a verdict on the commit and is ignored. A pull_request
          # run is not one either: its head_sha is the PR's head but
          # its tree is the head merged into the base, so its verdict
          # and its artifacts are another tree's. Nor is a tag build
          # on the same sha (a re-cut). The newest push or dispatch
          # run of main left is the verdict, and its jobs are its
          # latest attempt; the tag build promotes its artifacts.
          runs = [r for r in json.load(open("runs.json"))
                  if r["conclusion"] != "cancelled"
                  and r.get("event") in ("push", "workflow_dispatch")
                  and r.get("head_branch") == "main"]
          if not runs:
              print("::error::no build run on this commit")
              sys.exit(1)
          run = max(runs, key=lambda r: r["id"])
          # The run as a whole may still be going: the suites are
          # long and advisory, and the gate is the jobs below, each
          # of which must have completed green on its own.
          out = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/jobs?per_page=100",
               "--jq", "[.jobs[] | {name, status, conclusion}]"],
              capture_output=True, text=True, check=True).stdout
          jobs = {j["name"]: j for j in json.loads(out)}
          # RELIEF-48H expires 2026-11-14T03:45Z: `test` is advisory for the
          # window (build.yml runs it advisory) and is not read
          # here; the gate is the artifact legs below. Restore
          # "test" to the set at expiry.
          need = {"build-python", "build-linux", "build-linux-arm64",
                  "build-windows", "build-windows-arm64", "build-macos",
                  "build-macos-x86_64", "build-pi-light"}
          missing = sorted(need - set(jobs))
          if missing:
              print(f"::error::no job in the build run on this commit for: {', '.join(missing)}")
              sys.exit(1)
          bad = [j for name, j in jobs.items() if name in need
                 and (j["status"] != "completed" or j["conclusion"] != "success")]
          for j in bad:
              print(f"::error::{j['name']}: {j['status']}/{j['conclusion']}")
          if bad:
              sys.exit(1)
          print(f"{len(need)} jobs green on this commit (build run {run['id']})")
          # The tag build promotes this run's artifacts instead of
          # building them again (build.yml's promote_from input).
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run_id={run['id']}\n")
          EOF

      - name: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.ver.outputs.sha }}
          HAVE_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          # The job log is not readable from every seat; a failure
          # here rides as an annotation with the service's own words.
          # Path one: an annotated tag object and its ref through the
          # REST API, which creates the ref without a push and so
          # without the push-time workflow check.
          when=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if tagsha=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
                -f tag="$TAG" -f message="Version ${TAG#v}" -f object="$SHA" -f type=commit \
                -f 'tagger[name]=cut-release' -f 'tagger[email]=cut-release@users.noreply.github.com' \
                -f "tagger[date]=$when" --jq .sha 2>api.err) \
             && gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$tagsha" >/dev/null 2>>api.err; then
            echo "tagged $TAG -> $SHA (REST)"
            exit 0
          fi
          api_err=$(tr '\n' ' ' < api.err | cut -c1-600)
          echo "::warning title=REST tag::the API would not create $TAG ($api_err); trying git"
          # Path two: a git push, with RELEASE_TOKEN when the owner set
          # one (the checkout's credential), else GITHUB_TOKEN.
          git config user.name "cut-release"
          git config user.email "cut-release@users.noreply.github.com"
          if ! out=$(git tag -a "$TAG" "$SHA" -m "Version ${TAG#v}" 2>&1); then
            echo "::error title=tag::git tag failed: $(echo "$out" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          if ! out=$(git push origin "refs/tags/$TAG" 2>&1); then
            echo "::error title=tag push::git push failed: $(echo "$out" | tr '\n' ' ' | cut -c1-900)"
            if [ "$HAVE_RELEASE_TOKEN" != "true" ]; then
              echo "::error title=remedy::add a repository secret RELEASE_TOKEN (fine-grained PAT, this repository, contents: write and workflows: write) and re-run; see docs/steady/seats/questions.md Q30"
            fi
            exit 1
          fi
          echo "pushed $TAG -> $SHA (git)"

      - name: start the release pipeline on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.ver.outputs.sha }}
          GATE_RUN: ${{ steps.gate.outputs.run_id }}
        run: |
          set -euo pipefail
          # The tag build promotes the gate build's artifacts (the
          # eight legs this workflow just read green on the same
          # commit) instead of building them a second time: it
          # verifies that run against the tag's commit, downloads
          # its artifacts and publishes. Since 2026-11-12; the two
          # builds were 24 of a 31-minute cycle before the Windows
          # suite left the artifact leg, and the second build was
          # most of the 11 minutes after.
          # The input is sent only to a tree whose build.yml takes it:
          # a dispatch is validated against the workflow at the tag,
          # and an older tree would refuse the dispatch outright. The
          # tree is read at the commit, not the tag: a tag the REST
          # path placed is not in this checkout (the 3.16.21.5 cut
          # read the tag, found nothing, and dispatched a full build).
          if git show "$SHA:.github/workflows/build.yml" | grep -q "promote_from:"; then
            gh workflow run build.yml --ref "$TAG" -f promote_from="$GATE_RUN"
          else
            gh workflow run build.yml --ref "$TAG"
          fi
          gh workflow run docker.yml --ref "$TAG" -f tag="$TAG"
          gh workflow run docker.yml --ref "$TAG" -f tag=latest
          # A tag this workflow places with GITHUB_TOKEN starts no
          # push-triggered run of its own (GitHub's rule against
          # workflows triggering workflows), so the `push: tags`
          # trigger the proof workflows carry never fires for a
          # pipeline cut. The tag build dispatches the nine by name
          # from its last job, after the mirrors, so they never
          # hold a runner the release is waiting for.
          echo "::notice::$TAG cut; build.yml and docker.yml dispatched on it (the tag build starts the proofs after the mirrors)"
