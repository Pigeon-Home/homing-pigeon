# Agent-Stamp: 40000e00-1234-4abc-9def-0123456789ab
name: python-range

# The whole suite on the oldest Python the runner promises
# (pyproject requires-python) and the newest one released. build.yml
# runs it on 3.12 only, and the platform matrix runs one portable
# proof on the 3.9 floor, so before this a 3.9-only break shipped
# green. The first run here found two: job issued_at with a "+0000"
# offset was fresh on 3.12 and unparseable on 3.9, and three feed
# senses silently dropped timestamps with short fractions.
#
# Same box as build.yml's test job (a normal user, git, bubblewrap),
# so a red leg is the Python and nothing else.
on:
  # This workflow fires on no push of its own (the posture since
  # the relief window of 2026-11-12, kept at the window's close):
  # the tag build dispatches it after the mirrors when the tag's
  # tree changed under runner/, and it runs on its schedule and on
  # dispatch, so a push to main pays for build.yml alone and a tag
  # whose runner code did not change pays for none of the nine.
  # Its own `push: tags` trigger went with RELEASE_TOKEN (2026-11-12):
  # a tag pushed with the token fires push triggers, and nine
  # proof workflows on every tag held the account's runners.
  pull_request:
  schedule:
    # The nightly, so the proof runs daily while pushes to main do
    # not fire it.
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One group for every release tag. The run that is going finishes
  # and gives its verdict; the newest tag's run waits behind it and
  # replaces any older one still waiting -- one running and one
  # waiting at most. A group per tag piled nine runs per tag behind
  # each other and held the runners the next cycle's gate needed
  # (2026-11-12: a gate build's macOS leg waited eight minutes
  # behind three tags' proofs); the newest tag cancelling the run
  # before it left the long proofs with no verdict to read at all
  # (26 of the Python range proof's last 39 runs cancelled). The
  # nightly and a dispatch on a branch keep a group of their own.
  group: python-range-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 builds stop at 22.04 in setup-python's manifest.
          # The wall clock is a hang-catcher, not a size budget --
          # it names the running test when a test loops forever.
          # The floor leg runs the identical suite at roughly a
          # third of the newest interpreter's pace (the crypto is
          # pure Python), so at a shared 30 minutes it died on size
          # alone inside test_result_size, red for a reason that is
          # not the Python version -- the one thing this workflow
          # exists to isolate. Its budget is 75 (the 30-minute run
          # covered about 6,500 of about 9,900 tests, so the suite
          # needs roughly 46 there, plus growth headroom).
          # The fast leg's budget is 45 (Q185, 2026-11-14): at 30
          # the suite -- 13,215 tests at that measure -- fit only
          # on a good runner draw: the five most recent legs read
          # 1,815 seconds (killed at the wall), 1,245 seconds
          # green, and 1,541, 1,206 and 1,625 seconds failing on
          # test reds before the wall could bind, so on a slow
          # draw the clock was doing size duty there too. 45
          # covers the killed run's need 1.5 times over and the
          # worst green pace 2.2 times over, plus growth
          # headroom; it names a hanging test, not a size.
          # The completed series behind that window, in the
          # runs' own seconds: at 13,052 tests the leg also
          # read 1,774 and 1,788 seconds green on slow draws
          # -- a slow pace of about 0.137 seconds per test,
          # against which 13,215 tests need about 1,810
          # seconds, so 2,700 seconds is about 1.5 times the
          # slow-draw need as well and carries the suite at
          # that pace to about 19,700 tests.
          - python: "3.9"
            os: ubuntu-22.04
            suite-minutes: 75
          - python: "3.14"
            os: ubuntu-latest
            suite-minutes: 45
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -c .github/requirements-ci.txt hypothesis
      - name: install bubblewrap (the Linux sandbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - name: run the suite
        run: |
          set -o pipefail
          python runner/tools/suite_wall_clock.py --minutes ${{ matrix.suite-minutes }} -- discover -s runner/tests -t . -v 2>&1 | tee test-output.log
      # The suite step fails the leg on any failure (pipefail). The
      # guard is build.yml's: registered skips are allowed (root, z3,
      # the proof variable, the minimal image), the sandbox proofs
      # are not. A bare OK is impossible on a non-root hosted box.
      - name: the sandbox proofs ran
        if: always()
        run: python runner/tools/skip_guard.py test-output.log --forbid "bwrap not available" --forbid "hypothesis not installed" --annotate
