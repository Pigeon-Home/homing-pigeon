# Agent-Stamp: 40000e00-1234-4abc-9def-0123456789ab
name: upgrade-proof

# An owner upgrades by running the new installer over the old
# install. This proves that path from the last published release to
# this commit: the old release's installer installs, the owner's
# config edits and the runner's state are seeded, this tree's
# installer runs over them, and every key, every state file and a
# working runner are still there afterwards
# (runner/tools/upgrade_proof.py). The suite runs the same proof
# tree-to-itself (runner/tests/test_upgrade_proof.py); only here is
# the old side a real release.
on:
  # This workflow does not fire on pushes to main (the posture since
  # the relief window of 2026-11-12, kept at the window's close):
  # it runs on release tags whose tree changed under runner/ (the
  # tag build dispatches it after the mirrors), on its schedule and
  # on dispatch, so a push to main pays for build.yml alone. Nine
  # proof workflows on every push held the account's runners and
  # starved the release train of verdicts; the window measured the
  # cycle at 7 minutes without them and the posture stands.
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    # The nightly, so the proof runs daily while pushes to main do
    # not fire it.
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One group for every release tag, the newest tag's run cancelling
  # the one before: a release burst cuts a tag every ten minutes, and
  # nine proof runs per tag queued up behind each other and held the
  # runners the next cycle's gate needed (2026-11-12: a gate build's
  # macOS leg waited eight minutes behind three tags' proofs). A
  # superseded tag's proof is the newer tag's to give; the nightly
  # and a dispatch on a branch keep a group of their own.
  group: upgrade-proof-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  from-last-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.9"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: check out the last release before this tree
        run: |
          set -euo pipefail
          prev=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's#.*refs/tags/##' \
            | python3 runner/tools/upgrade_proof.py --previous-of runner/_version.py)
          echo "last release: $prev"
          git fetch --depth 1 origin tag "$prev"
          git worktree add ../last-release "$prev"
      - name: upgrade from it, and lose nothing
        run: python runner/tools/upgrade_proof.py ../last-release .
