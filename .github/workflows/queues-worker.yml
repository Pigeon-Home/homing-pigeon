# Agent-Stamp: 40000e00-1234-4abc-9def-0123456789ab
name: queues-worker

# The hosted queue's Cloudflare Worker (runner/cloud/queues-worker/)
# had nine tests that nothing ran. They need only Node's built-in test
# runner, which GitHub's hosted image already carries: no wrangler,
# no npm install, no network.
on:
  # RELIEF-48H expires 2026-11-14T03:45Z: for the relief window this workflow
  # does not fire on pushes to main -- it runs on release tags, on
  # its schedule and on dispatch, so a push pays for build.yml
  # alone. At expiry restore `branches: [main]` under push (and
  # drop the schedule if the window added it);
  # runner/tests/test_build_config.py fails after the date
  # until the window is reverted whole.
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    # RELIEF-48H: the nightly the window adds, so the proof still
    # runs daily while pushes to main do not fire it.
    - cron: "7 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One group for every release tag, the newest tag's run cancelling
  # the one before: a release burst cuts a tag every ten minutes, and
  # nine proof runs per tag queued up behind each other and held the
  # runners the next cycle's gate needed (2026-11-12: a gate build's
  # macOS leg waited eight minutes behind three tags' proofs). A
  # superseded tag's proof is the newer tag's to give; the nightly
  # and a dispatch on a branch keep a group of their own.
  group: queues-worker-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Not `test`: that is the suite's job name in build.yml, and a
  # second check run under the same name on the same commit is
  # one a gate reading check runs by name can mistake for it.
  worker-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the Worker's tests, and its fuzz harness (Q123; corpus replay, then one long seed)
        run: |
          node --version
          node --test runner/cloud/queues-worker/test/worker.test.mjs runner/cloud/queues-worker/test/fuzz.test.mjs
