# Agent-Stamp: 10000c2a-1d4e-4f7b-8a2c-9e5d6f7a8b9c
name: freebsd

# The suite and the switch-proof roster on FreeBSD (owner's order,
# 2026-10-25). GitHub has no FreeBSD runner, so a VM boots inside a
# Linux runner (vmactions/freebsd-vm, pinned by SHA); the boot costs
# minutes and the action is not as steady as a native runner, so
# this runs weekly, on dispatch, and when this file changes, never
# on the release path. A signal, not a gate.
#
# Inside the VM: the suite as an ordinary user (the runner is not
# root in service), then the roster as root with a real second user
# (the privilege drop, M8, on a third POSIX kernel). Confinement is
# bwrap and falls open here by the 2026-10-15 rule; a jail would be
# FreeBSD's cage (docs/infrastructure-documents/security/security-gaps.md) and is not in
# scope until the owner says so.
on:
  schedule:
    - cron: "23 7 * * 2"
  # This workflow fires on no push of its own (the posture since
  # the relief window of 2026-11-12, kept at the window's close):
  # the tag build dispatches it after the mirrors when the tag's
  # tree changed under runner/, and it runs on its schedule and on
  # dispatch, so a push to main pays for build.yml alone and a tag
  # whose runner code did not change pays for none of the nine.
  # Its own `push: tags` trigger went with RELEASE_TOKEN (2026-11-12):
  # a tag pushed with the token fires push triggers, and nine
  # proof workflows on every tag held the account's runners.
  workflow_dispatch:

permissions: {}

concurrency:
  # One group for every release tag. The run that is going finishes
  # and gives its verdict; the newest tag's run waits behind it and
  # replaces any older one still waiting -- one running and one
  # waiting at most. A group per tag piled nine runs per tag behind
  # each other and held the runners the next cycle's gate needed
  # (2026-11-12: a gate build's macOS leg waited eight minutes
  # behind three tags' proofs); the newest tag cancelling the run
  # before it left the long proofs with no verdict to read at all
  # (26 of the Python range proof's last 39 runs cancelled). The
  # nightly and a dispatch on a branch keep a group of their own.
  group: freebsd-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: false

jobs:
  freebsd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the suite and the roster inside a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          # A supported release: pkg's repositories for an EOL release
          # are withdrawn, and the first run's pkg install died on 14.2.
          release: "15.0"
          usesh: true
          mem: 4096
          # The evidence path out of the VM, stated in the open
          # (Q175): for 15.0 on x86_64 the action's first sync
          # method is rsync, a copy-based method -- the workspace
          # inside the VM is a copy on the VM's own disk, and the
          # report files the run writes into it reach the host
          # only through the action's copy-back phase. That phase
          # is requested explicitly here rather than left to a
          # default, and the run also prints the suite's failing
          # ids into this step's own log (below), which streams
          # live to the run page and cannot be lost with the
          # copy-back. Until this stood here the artifacts total
          # for this workflow was 0 on every run.
          #
          # The hosted verdict on v3.16.25.3 (Q175, run
          # 43380594494) showed the copy-back asking is not
          # enough on its own: in the pinned action the
          # copy-back section stands after the run block, and a
          # non-zero run exit throws past it, so copy-back ran
          # only after a successful run and the artifact total
          # stayed 0 on the red run that needed the evidence.
          # The run below therefore records its verdict in a
          # file in the workspace and exits 0 itself; the
          # copy-back and the upload then happen, and a host
          # step after the upload reads the verdict file and
          # restores the run's true colour.
          sync: rsync
          copyback: true
          # The VM's output is the step's, so ::error lines written
          # inside it reach the run page; each phase names itself
          # when it fails, since the log is not readable from every
          # seat. /bin/sh: no pipefail, so no pipes on the verdicts.
          prepare: |
            set -e
            phase() { echo "== $1"; }
            phase "packages"
            freebsd-version
            export ASSUME_ALWAYS_YES=yes
            pkg bootstrap -f > pkg.log 2>&1 || true
            pkg update -f >> pkg.log 2>&1 || true
            # The repository carries one Python flavor's packages (3.12
            # on 15.0, 3.11 before); take whichever flavor has
            # hypothesis, and remember the interpreter for the run.
            PY=""
            pkg install -y git node bash >> pkg.log 2>&1 || echo "::warning title=freebsd prepare::git/node/bash did not install: $(tail -n 3 pkg.log | tr '\n' ' ' | cut -c1-300)"
            for v in 312 311; do
              if pkg install -y "python$v" "py$v-hypothesis" >> pkg.log 2>&1; then
                PY="python3.${v#3}"; break
              fi
            done
            [ -n "$PY" ] || { echo "::error title=freebsd prepare::no python flavor with hypothesis installs: $(tail -n 6 pkg.log | tr '\n' ' ' | cut -c1-600)"; exit 1; }
            echo "$PY" > /tmp/hp-python
            # The runner resolves the plain name python3; the flavor
            # package installs only the versioned one.
            [ -x /usr/local/bin/python3 ] || ln -s "/usr/local/bin/$PY" /usr/local/bin/python3
            "$PY" -c "import sys, hypothesis; print(sys.version.split()[0], 'hypothesis', hypothesis.__version__)"
            pw useradd runner -m -s /bin/sh || { echo "::error title=freebsd prepare::pw useradd runner failed"; exit 1; }
            pw useradd pigeon-test -m -s /bin/sh || { echo "::error title=freebsd prepare::pw useradd pigeon-test failed"; exit 1; }
          run: |
            PY="$(cat /tmp/hp-python 2>/dev/null || echo python3.12)"
            echo "== workspace: $GITHUB_WORKSPACE, interpreter $PY"
            cd "$GITHUB_WORKSPACE" || { echo "::error title=freebsd::no workspace at $GITHUB_WORKSPACE"; exit 1; }
            ls | head -20
            chown -R runner "$GITHUB_WORKSPACE" || { echo "::error title=freebsd::chown failed"; exit 1; }
            # The parser half, before the roster and the suite, so a
            # failure of /bin/sh is not buried under their annotations.
            # sh -n only. The gate is not asked again.
            echo "== freebsd sh, parser only"
            src=0
            HP_FREEBSD_SH=/bin/sh HP_FREEBSD_SYNTAX_ONLY=1 \
              "$PY" -m unittest runner.tests.test_proof_sh_freebsd -v \
              > /tmp/freebsd-sh.log 2>&1 || src=$?
            tail -n 30 /tmp/freebsd-sh.log
            [ "$src" -eq 0 ] || echo "::error title=freebsd sh::/bin/sh syntax check exited $src; the log is in the artifact"
            # The roster first: a step keeps ten error annotations, and
            # the suite's exception lines would otherwise take them all
            # before a failed control could name itself.
            echo "== the roster, as root with a second user"
            rrc=0
            "$PY" runner/tools/switch_proofs.py --have posix --root \
              --title FreeBSD-root --out /tmp/switch-proofs-freebsd-root.md --annotate || rrc=$?
            # The suite as an ordinary user with a login environment
            # (su -m kept root's HOME and PATH, and the fake binaries
            # the suite writes under TMPDIR must be executable, so it
            # lives in the user's home, not a noexec /tmp).
            echo "== the suite, as the runner user"
            mkdir -p /home/runner/tmp && chown runner /home/runner/tmp
            rc=0
            su -l runner -c "export TMPDIR=/home/runner/tmp; cd '$GITHUB_WORKSPACE' && $PY runner/tools/suite_wall_clock.py --minutes 30 -- discover -s runner/tests -t . -v --durations 25" > /tmp/suite-freebsd.log 2>&1 || rc=$?
            tail -n 40 /tmp/suite-freebsd.log
            "$PY" runner/tools/skip_guard.py /tmp/suite-freebsd.log --annotate || true
            # The failing tests named in this step's own log (Q175):
            # the annotations above are capped at ten, and the
            # artifact below depends on the VM's copy-back phase,
            # while this step's stdout is the run page's log and
            # streams as it is written. Every FAIL:/ERROR: id the
            # suite printed, then its verdict lines, so a red run
            # names all of its red tests here even when the
            # artifact does not arrive.
            echo "== the suite's failing tests, named in this log"
            grep -E "^(FAIL|ERROR): " /tmp/suite-freebsd.log || true
            grep -E "^(Ran [0-9]+ tests|OK|FAILED)" /tmp/suite-freebsd.log || true
            # On a wall-killed run (exit 124) the summary lines
            # above never print: unittest writes its FAIL:/ERROR:
            # headers only when the suite completes. The verbose
            # per-test outcome lines are written as each test
            # finishes, so they name every completed red test
            # even then. The test in flight at the kill carries
            # no outcome line and stays unnamed.
            grep -E "\.\.\. (FAIL|ERROR)$" /tmp/suite-freebsd.log || true
            # The reports join the tree only now, for the artifact: a
            # root .md present while the suite runs reads as a live
            # doc to the doc guards.
            cp /tmp/suite-freebsd.log /tmp/switch-proofs-freebsd-root.md /tmp/freebsd-sh.log "$GITHUB_WORKSPACE"/ 2>/dev/null || true
            [ "$rc" -eq 0 ] || echo "::error title=freebsd suite::the suite exited $rc; the failing tests are annotated above and the log is in the artifact"
            # The verdict travels as a file, not as this script's
            # exit code (Q175 follow-on): in the pinned action a
            # non-zero run exit throws past the copy-back section,
            # so a red script would lose the reports it just wrote.
            # The script exits 0; the host step after the upload
            # reads this file and fails the job on any non-zero
            # code recorded here, or on the file missing.
            printf '%s %s %s\n' "$rc" "$rrc" "$src" > "$GITHUB_WORKSPACE/freebsd-verdict.txt" || true
            exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: freebsd
          path: |
            suite-freebsd.log
            switch-proofs-freebsd-root.md
            freebsd-sh.log
            freebsd-verdict.txt
          # warn, not ignore (Q175): an empty artifact was the
          # standing state for this workflow's whole history and
          # `ignore` is what kept that invisible on the run page.
          if-no-files-found: warn
      - name: the FreeBSD verdict, restored on the host
        if: always()
        run: |
          # The VM step exits 0 even on a red suite so the
          # action's copy-back runs (see the verdict file's
          # comment inside the VM); this step is where the
          # run's colour is decided. A missing verdict file
          # means the evidence path broke again, and that is
          # a failure too, not a pass.
          if [ ! -f freebsd-verdict.txt ]; then
            echo "::error title=freebsd verdict::no verdict file arrived from the VM; the evidence path is broken"
            exit 1
          fi
          read -r rc rrc src < freebsd-verdict.txt
          echo "freebsd verdict: suite=$rc roster=$rrc sh=$src"
          [ "$rc" = "0" ] && [ "$rrc" = "0" ] && [ "$src" = "0" ]
