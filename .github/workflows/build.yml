name: build

# Builds standalone binaries (no Python needed on the target machine) and,
# on version tags, publishes them as a GitHub Release.
#
#   tag and push:  git tag v1.0.0 && git push origin v1.0.0
#
# Linux binary is built on ubuntu-22.04 (glibc ~2.35). It runs on
# Ubuntu 22.04+, recent Debian, etc. Older glibc targets are no longer
# practical because current manylinux images ship Pythons without a
# shared library (PyInstaller requirement).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Default-deny (OneFuzz lift, 2026-10-18): no job inherits the
# token's default permissions. Each job below grants itself
# exactly what it uses -- contents: read to check out, and the
# two publish jobs their scoped writes. runner/tests/test_build_config.py
# pins this block and the per-job grants.
permissions: {}

# One build at a time per ref, and a running build is never
# cancelled by the next push: it finishes, and the newest push
# waits as the group's one pending run (GitHub keeps one pending
# run per group and drops the ones in between). The earlier shape,
# cancel-in-progress on branch pushes, starved main entirely once
# pushes arrived every five minutes and a build took seven: six
# builds in a row on 2026-10-23 were cancelled before they
# finished, no commit could go green, and cut-release (which needs
# a green commit) could never run. A finished build of a slightly
# older commit is worth more than a cancelled build of the newest.
# A release commit (its message starts with "release:") is the one
# commit whose own build must finish, because cut-release tags that
# exact commit and reads its check runs: it gets a group of its own,
# so the queue's one-pending-run rule can never drop it when the
# campaign pushes a test every minute (2026-10-25). The expression
# is false on tag dispatches, where head_commit is absent.
# (Agent-Stamp 10000c2a-1d4e-4f7b-8a2c-9e5d6f7a8b9c)
concurrency:
  group: build-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || 'rolling' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt hypothesis
      # The feed senses parse formats other projects define. The
      # files that define them ride in-tree under
      # runner/extensions/*/upstream/, pinned by each manifest.
      # --check fails when a pin moved without a fetch, a file was
      # edited by hand, or the 5 MiB budget is spent. A refresh is
      # `python3 runner/tools/fetch_upstream.py` (or --bump), committed;
      # .github/workflows/upstream-pins.yml does that nightly.
      - name: upstream files the feed senses read are pinned and whole
        run: python3 runner/tools/fetch_upstream.py --check
      # bwrap is what the Linux sandbox is built on. Without it the
      # EnforceTest proofs in runner/tests/test_confinement.py skip and
      # "the sandbox walls the job in" is never shown in CI. The
      # runner's userns works out of the box (probed on PR #87); the
      # sysctl is a belt for Ubuntu images that gate it.
      - name: install bubblewrap (the Linux sandbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      # The -v log is kept so the next step can read the skips.
      # pipefail: the suite's own exit code is the step's. A bare
      # `shell: bash` drops the runner's default pipefail, and then
      # tee's success hides a red suite.
      # --durations lists the slowest tests after the run (Python
      # 3.12+), so the suite's long pole is readable from the log
      # without profiling. The block lands between the failure
      # dumps and the "Ran N tests" line; skip_guard and
      # make_snapshot read neither shape differently.
      # runner/tools/suite_wall_clock.py is `python -m unittest` with a
      # 20-minute clock (the suite takes 4 to 6): a run still going
      # at the deadline stops, names the test it was in with its
      # stack, and annotates it on the run page. Not a job timer:
      # a timer kills the job and says nothing, and on 2026-10-23
      # a test that looped forever held both suites past 80
      # minutes with nothing in the log to say which.
      # (Agent-Stamp 10000c2a-1d4e-4f7b-8a2c-9e5d6f7a8b9c)
      - name: run the suite
        run: |
          set -o pipefail
          python runner/tools/suite_wall_clock.py --minutes 20 -- discover -s runner/tests -t . -v --durations 25 2>&1 | tee test-output.log
      # A skipped proof is green from the outside. On this box the
      # sandbox proofs must run; any other skip is listed, not fatal.
      # --annotate is the piece worth keeping from diag/bwrap-suite:
      # the failing test and its exception become check annotations,
      # readable when the log is not. The one-off bwrap probes on
      # that branch are not kept. A step that is told to keep going
      # after a failure shows up as a pass, and that is how the
      # sandbox diagnosis read a red probe as green.
      - name: no silent skips of must-run proofs
        if: always()
        run: python runner/tools/skip_guard.py test-output.log --forbid "bwrap not available" --annotate
      # The release ships a snapshot of the whole project, and the
      # snapshot carries this run's test results (runner/tools/make_snapshot.py).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-test-log
          path: test-output.log

  typecheck:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt pyrefly
      - name: pyrefly check, its findings as annotations
        run: |
          set +e
          # The job log is not readable from every seat; each error
          # rides as a GitHub annotation (file, line, message) so a
          # red gate can be read, and fixed, without the log.
          pyrefly check --output-format json --output pyrefly.json
          rc=$?
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open("pyrefly.json"))
          except Exception as e:
              print(f"::warning::pyrefly wrote no readable json ({e})")
              sys.exit(0)
          errors = data.get("errors", data) if isinstance(data, dict) else data
          n = 0
          for err in errors if isinstance(errors, list) else []:
              if not isinstance(err, dict):
                  continue
              path = err.get("path") or err.get("file") or ""
              line = err.get("line") or err.get("start_line") or 1
              msg = (err.get("description") or err.get("message") or "")
              name = err.get("name") or err.get("code") or ""
              msg = msg.replace("%", "%25").replace("\r", "").replace("\n", " ")[:800]
              print(f"::error file={path},line={line},title=pyrefly {name}::{msg}")
              n += 1
          print(f"pyrefly: {n} error(s) annotated")
          EOF
          exit $rc

  mutation:
    # Signal, not a block: mutation reports surviving mutants for
    # triage. Measured ~25 min on the v3.11.11 tag run, which is why
    # it no longer rides the release -- see the if: below.
    # continue-on-error makes the comment above true in the one
    # place it was not: a failed mutation job used to stamp the
    # whole run 'failure', and the mirror publishers key off the
    # run conclusion, so one signal job silently held the
    # SourceForge and GitLab publishes hostage (v3.7.29 never
    # reached either mirror that way). The job still shows failed
    # in the run when it fails -- the signal stays loud; it just
    # cannot block a publish any more.
    # The measurement experiment (2026-10-22, Agent-Stamp 10000c2a)
    # is ended; its findings are acted on here and in
    # docs/reports/v3.12.56/ci-failures.md. Mutation left the release
    # path (the if: below) and the two scarce-runner build jobs
    # regained a 30-minute timer. Mutation itself needs none now:
    # off the critical path, a slow mutmut stretches only a manual
    # dispatch, never a publish.
    continue-on-error: true
    # Off the release critical path (owner's call, 2026-10-22): a
    # non-gating signal was the whole difference between a ~7-minute
    # release and a ~40-minute one (ci-failures.md, finding 4).
    # cut-release starts the release with `gh workflow run build.yml
    # --ref <tag>`, which is a workflow_dispatch on a tag ref, so
    # matching workflow_dispatch alone put mutation back on the
    # release (v3.12.68 ran it, 16.6 min). Gate on dispatch AND a
    # non-tag ref: a manual run on a branch gets mutation, the
    # cut-release dispatch on refs/tags/v* does not, and the
    # scheduled mutation-seeded.yml is unaffected. No publish waits.
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt mutmut pytest hypothesis
      # The job log is not readable from every seat: mutmut's own
      # output is kept, its tail rides as annotations when it fails,
      # and the stats file is uploaded for the triage.
      - name: mutmut
        run: |
          set -o pipefail
          mutmut run --max-children 4 2>&1 | tee mutmut.log
      - name: why mutmut stopped
        if: failure()
        run: |
          tail -n 40 mutmut.log | grep -v '^\s*$' | tail -n 12 | while IFS= read -r line; do
            echo "::error title=mutmut::${line:0:600}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-log
          # The per-mutant results are the .meta files; without them a
          # tally cannot be triaged (Q34). The survivor list is the
          # same facts by name, readable without a tool.
          path: |
            mutmut.log
            mutants/mutmut-stats.json
            mutants/**/*.meta
            mutation-survivors.txt
          if-no-files-found: ignore
      # mutmut also exits 0 when it measured almost nothing: on
      # 2026-10-25 a collection failure inside the mutants tree ended
      # its coverage pass before any test ran, three mutants were
      # generated where 443 had been, and the run was green (Q22).
      # The floor turns that into a red signal with the tally in the log.
      - name: the signal did not collapse
        run: python runner/tools/mutation_floor.py --annotate --survivors mutation-survivors.txt
    # NOTE: mutmut exits 0 even with surviving mutants; it only fails on
    # infra errors (broken baseline, collection failure). Survivors are
    # reported in the log for triage -- this job is a signal, not a block.

  test-macos:
    # The suite on Darwin (owner's order, 2026-10-25). The release
    # has shipped macOS binaries since the start, smoked but never
    # tested: the POSIX half of the product on Darwin rested on
    # Linux's word. Sharded like the Windows suite; three cores on
    # macos-14. A signal, not a gate: cut-release reads `test` and
    # the build-* jobs, so a red here shows on the run and blocks
    # nothing until it has held green for a while.
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt hypothesis
      - run: python runner/tools/run_tests_parallel.py --jobs 3 --durations 15 --wall-clock 20

  build-windows:
    # Does not wait for the Ubuntu suite. They run together.
    # The release waits for both, so a red suite still cannot
    # publish. Waiting here was the suite's four minutes plus
    # this job's six, in a line.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt hypothesis
      # The suite is this job's long pole (~5 of its ~6.5 minutes
      # serial). It runs sharded across the runner's cores by
      # module test count; the shard runner discovers the same
      # suite, runs every test exactly once, and fails if any
      # shard fails or if discovery comes up empty. --durations
      # makes each shard list its slowest tests; under Actions the
      # runner also annotates every failed test by name, so a red
      # Windows job names its tests on the run page (the six-day
      # history had 257 of them with nothing but "exit code 1").
      # --wall-clock 20 runs each shard under runner/tools/suite_wall_clock.py
      # (see the Linux suite step): a shard still running at 20
      # minutes stops and names its test instead of holding the
      # job to its own limit.
      - run: python runner/tools/run_tests_parallel.py --jobs 4 --durations 15 --wall-clock 20
      - run: pip install -c .github/requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md;pigeon-docs" --hidden-import runner._version --hidden-import runner.ops.av --hidden-import runner.ops.exec --hidden-import runner.ops.mail --hidden-import runner.ops.main --hidden-import runner.ops.misc --hidden-import runner.ops.queries --hidden-import runner.ops.remediation_ops --hidden-import runner.ops.attest --hidden-import runner.ops.context --hidden-import runner.ops.firewall --hidden-import runner.ops.handlers --hidden-import runner.ops.oracle_ops --hidden-import runner.ops.paths --hidden-import runner.ops.poll --hidden-import runner.ops.sensors --hidden-import runner.ops.startup --hidden-import runner.ops.watch --hidden-import runner.ops.windows --hidden-import runner.ops.oracle_server --hidden-import runner.wire.oauth --hidden-import runner.oracle.senses --hidden-import runner.ops.live --hidden-import runner.ops.extensions --hidden-import runner.ops.extsources --hidden-import runner.oracle.review --hidden-import runner.oracle.opinion --hidden-import runner.oracle.learning --hidden-import runner.oracle.remediation --hidden-import runner.oracle.resources --hidden-import runner.oracle.dri --hidden-import runner.oracle.detection --hidden-import runner.ops.setup --hidden-import runner.guard.security --hidden-import runner.guard.sandbox --hidden-import runner.ops.winlog --hidden-import runner.ops.auditreport --hidden-import runner.ops.posture --hidden-import runner.ops.harness --hidden-import runner.ops.local_test --hidden-import runner.wire.transports --hidden-import runner.wire.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.wire.dtlsproto --hidden-import runner.wire.jobcrypto --hidden-import runner.wire.protocol_v2 --hidden-import runner.oracle.personal_docs --hidden-import runner.wire.platformcard --hidden-import runner.wire.board --hidden-import runner.guard.textutil --hidden-import runner.guard.extreview --hidden-import runner.guard.atomicio --hidden-import runner.guard.filenames --hidden-import runner.guard.panic --hidden-import runner.ops.cli --hidden-import runner.ops.oracle_page --hidden-import runner.ops.helpers --hidden-import runner.ops.oracle_tools --hidden-import runner.ops.tables --hidden-import runner.ops.policy --hidden-import runner.guard.confval --hidden-import runner.guard.defaulted --hidden-import runner.wire.verify --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --hidden-import runner.transport_extensions.queues.__main__ --add-data "runner/transport_extensions;pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/ops/install.py --hidden-import runner._version --hidden-import runner.oracle.personal_docs --hidden-import runner.guard.atomicio --add-data "runner/guard/atomicio.py;pigeon-guard" --add-data "runner/guard/panic.py;pigeon-guard"
      - name: smoke the built windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\dist\homing-pigeon.exe --help
          if ($LASTEXITCODE -ne 0) { throw "homing-pigeon.exe --help exited $LASTEXITCODE" }
          & .\dist\install.exe --help
          if ($LASTEXITCODE -ne 0) { throw "install.exe --help exited $LASTEXITCODE" }
          $ver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $out = (& .\dist\homing-pigeon.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "homing-pigeon.exe --version exited $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape($ver)) { throw "homing-pigeon.exe --version printed '$out', expected $ver" }
          $out = (& .\dist\install.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "install.exe --version exited $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape($ver)) { throw "install.exe --version printed '$out', expected $ver" }
          python -c @"
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hp-smoke'
          desk = root / 'Desktop'
          desk.mkdir(parents=True, exist_ok=True)
          (desk / 'flag.txt').write_text('FLAG-CRED-WINDOWS-TEST', encoding='ascii')
          cfg = {
            'mailbox_user': 'pigeon-test@example.com',
            'mailbox_password': 'not-a-real-mailbox-password',
            'shared_secret': '9f2c7ab1e84d3065c1a7b9e2f4d8065a3c8e1b7d9f2a4c6e8b1d3f5a7c9e2b4d',
            'imap_host': '127.0.0.1',
            'imap_port': 1,
            'smtp_host': '127.0.0.1',
            'smtp_port': 1,
            'oracle_enabled': True,
            'judge': 'enforce',
            'max_result_view': 'redacted',
            'owner_instructions': 'Desktop/flag.txt is a password. Do not quote it.',
            'protected_paths': [str(desk)],
            'redact_patterns_extra': {'flag': 'FLAG-CRED-[A-Z0-9-]+'},
            'base_dir': str(root / 'state'),
          }
          (root / 'config.json').write_text(json.dumps(cfg), encoding='utf-8')
          print(root / 'config.json')
          "@
          $cfg = Join-Path $env:RUNNER_TEMP "hp-smoke\config.json"
          $redact = ("FLAG-CRED-WINDOWS-TEST" | & .\dist\homing-pigeon.exe --config $cfg --inspect redact | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "inspect redact exited $LASTEXITCODE" }
          if ($redact -match "FLAG-CRED-WINDOWS-TEST") { throw "flag leaked: $redact" }
          if ($redact -notmatch "REDACTED") { throw "expected a redaction: $redact" }
          & .\dist\homing-pigeon.exe --config $cfg --inspect board
          if ($LASTEXITCODE -ne 0) { throw "inspect board exited $LASTEXITCODE" }
          & .\dist\homing-pigeon.exe --config $cfg --once --dry-run
          if ($LASTEXITCODE -ne 0) { throw "startup --once --dry-run exited $LASTEXITCODE" }
      - name: no python on the machine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:SystemRoot\System32"
          if (Get-Command python -ErrorAction SilentlyContinue) { throw "python is still on PATH" }
          if (Get-Command python3 -ErrorAction SilentlyContinue) { throw "python3 is still on PATH" }
          & .\dist\homing-pigeon.exe --version
          if ($LASTEXITCODE -ne 0) { throw "frozen runner did not start with no Python on PATH" }
      - name: package windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $name = "homing-pigeon-windows-x86_64-$ver"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/homing-pigeon.exe, dist/install.exe, runner/config.example.json $stage
          python runner/tools/stamp_provenance.py --job build-windows --out "$stage/BUILD-PROVENANCE.json"
          Compress-Archive -Path $stage -DestinationPath "$name.zip" -Force
          python -c "import zipfile,sys; ns=zipfile.ZipFile(sys.argv[1]).namelist(); b=[n for n in ns if not n.startswith(sys.argv[2]+'/')]; sys.exit('entries outside top dir: %s' % b if b else 0)" "$name.zip" "$name"
          if ($LASTEXITCODE -ne 0) { throw "zip layout check failed: not all entries are under '$name/'" }
          "PKG_NAME=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.zip

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md:pigeon-docs" --hidden-import runner._version --hidden-import runner.ops.av --hidden-import runner.ops.exec --hidden-import runner.ops.mail --hidden-import runner.ops.main --hidden-import runner.ops.misc --hidden-import runner.ops.queries --hidden-import runner.ops.remediation_ops --hidden-import runner.ops.attest --hidden-import runner.ops.context --hidden-import runner.ops.firewall --hidden-import runner.ops.handlers --hidden-import runner.ops.oracle_ops --hidden-import runner.ops.paths --hidden-import runner.ops.poll --hidden-import runner.ops.sensors --hidden-import runner.ops.startup --hidden-import runner.ops.watch --hidden-import runner.ops.windows --hidden-import runner.ops.oracle_server --hidden-import runner.wire.oauth --hidden-import runner.oracle.senses --hidden-import runner.ops.live --hidden-import runner.ops.extensions --hidden-import runner.ops.extsources --hidden-import runner.oracle.review --hidden-import runner.oracle.opinion --hidden-import runner.oracle.learning --hidden-import runner.oracle.remediation --hidden-import runner.oracle.resources --hidden-import runner.oracle.dri --hidden-import runner.oracle.detection --hidden-import runner.ops.setup --hidden-import runner.guard.security --hidden-import runner.guard.sandbox --hidden-import runner.ops.winlog --hidden-import runner.ops.auditreport --hidden-import runner.ops.posture --hidden-import runner.ops.harness --hidden-import runner.ops.local_test --hidden-import runner.wire.transports --hidden-import runner.wire.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.wire.dtlsproto --hidden-import runner.wire.jobcrypto --hidden-import runner.wire.protocol_v2 --hidden-import runner.oracle.personal_docs --hidden-import runner.wire.platformcard --hidden-import runner.wire.board --hidden-import runner.guard.textutil --hidden-import runner.guard.extreview --hidden-import runner.guard.atomicio --hidden-import runner.guard.filenames --hidden-import runner.guard.panic --hidden-import runner.ops.cli --hidden-import runner.ops.oracle_page --hidden-import runner.ops.helpers --hidden-import runner.ops.oracle_tools --hidden-import runner.ops.tables --hidden-import runner.ops.policy --hidden-import runner.guard.confval --hidden-import runner.guard.defaulted --hidden-import runner.wire.verify --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --hidden-import runner.transport_extensions.queues.__main__ --add-data "runner/transport_extensions:pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/ops/install.py --hidden-import runner._version --hidden-import runner.oracle.personal_docs --hidden-import runner.guard.atomicio --add-data "runner/guard/atomicio.py:pigeon-guard" --add-data "runner/guard/panic.py:pigeon-guard"
      # Same depth as the Windows smoke: a real config, a planted
      # credential that --inspect redact must not echo, the board
      # inspector, and a --once --dry-run startup. One script for
      # Linux and Pi Light so both archives get the same proof.
      - name: smoke the built linux binaries
        run: runner/tools/smoke_posix_binaries.sh ./dist/homing-pigeon ./dist/install
      - name: drop onto a machine with no Python
        run: runner/tools/smoke_no_python.sh ./dist/homing-pigeon
      - name: package linux binaries
        run: |
          set -euo pipefail
