    # parked release runs ~16 h -- ci-failures.md finding 3), fail
    # in 30 minutes instead of at the platform's 6-hour ceiling.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
