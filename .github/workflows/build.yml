name: build

# Builds standalone binaries (no Python needed on the target machine) and,
# on version tags, publishes them as a GitHub Release.
#
#   tag and push:  git tag v1.0.0 && git push origin v1.0.0
#
# Linux binary is built on ubuntu-22.04 (glibc ~2.35). It runs on
# Ubuntu 22.04+, recent Debian, etc. Older glibc targets are no longer
# practical because current manylinux images ship Pythons without a
# shared library (PyInstaller requirement).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py
      - run: Compress-Archive -Path dist/homing-pigeon.exe,dist/install.exe,runner/config.example.json -DestinationPath homing-pigeon-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: homing-pigeon-windows-x86_64
          path: homing-pigeon-windows-x86_64.zip

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py
      - run: |
          mkdir -p pkg
          cp dist/homing-pigeon dist/install runner/config.example.json pkg/
          tar czf homing-pigeon-linux-x86_64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: homing-pigeon-linux-x86_64
          path: homing-pigeon-linux-x86_64.tar.gz

  build-macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py
      - run: |
          mkdir -p pkg
          cp dist/homing-pigeon dist/install runner/config.example.json pkg/
          tar czf homing-pigeon-macos-arm64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: homing-pigeon-macos-arm64
          path: homing-pigeon-macos-arm64.tar.gz

  build-python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: homing-pigeon-python
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          sha384sum * > SHA384SUMS
          cat SHA384SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
