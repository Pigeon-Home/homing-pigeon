          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md:pigeon-docs" --hidden-import runner._version --hidden-import runner.ops.av --hidden-import runner.ops.exec --hidden-import runner.ops.mail --hidden-import runner.ops.main --hidden-import runner.ops.misc --hidden-import runner.ops.queries --hidden-import runner.ops.remediation_ops --hidden-import runner.ops.attest --hidden-import runner.ops.context --hidden-import runner.ops.firewall --hidden-import runner.ops.handlers --hidden-import runner.ops.oracle_ops --hidden-import runner.ops.paths --hidden-import runner.ops.poll --hidden-import runner.ops.sensors --hidden-import runner.ops.startup --hidden-import runner.ops.watch --hidden-import runner.ops.windows --hidden-import runner.ops.oracle_server --hidden-import runner.wire.oauth --hidden-import runner.oracle.senses --hidden-import runner.ops.live --hidden-import runner.ops.extensions --hidden-import runner.ops.extsources --hidden-import runner.oracle.review --hidden-import runner.oracle.opinion --hidden-import runner.oracle.learning --hidden-import runner.oracle.remediation --hidden-import runner.oracle.resources --hidden-import runner.oracle.dri --hidden-import runner.oracle.detection --hidden-import runner.ops.setup --hidden-import runner.guard.security --hidden-import runner.guard.sandbox --hidden-import runner.ops.winlog --hidden-import runner.ops.auditreport --hidden-import runner.ops.posture --hidden-import runner.ops.harness --hidden-import runner.ops.local_test --hidden-import runner.wire.transports --hidden-import runner.wire.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.wire.dtlsproto --hidden-import runner.wire.jobcrypto --hidden-import runner.wire.protocol_v2 --hidden-import runner.oracle.personal_docs --hidden-import runner.wire.platformcard --hidden-import runner.wire.board --hidden-import runner.guard.textutil --hidden-import runner.guard.extreview --hidden-import runner.guard.atomicio --hidden-import runner.guard.filenames --hidden-import runner.guard.panic --hidden-import runner.ops.cli --hidden-import runner.ops.oracle_page --hidden-import runner.ops.helpers --hidden-import runner.ops.oracle_tools --hidden-import runner.ops.tables --hidden-import runner.ops.policy --hidden-import runner.guard.confval --hidden-import runner.guard.defaulted --hidden-import runner.wire.verify --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --hidden-import runner.transport_extensions.queues.__main__ --add-data "runner/transport_extensions:pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/ops/install.py --hidden-import runner._version --hidden-import runner.oracle.personal_docs --hidden-import runner.guard.atomicio --add-data "runner/guard/atomicio.py:pigeon-guard" --add-data "runner/guard/panic.py:pigeon-guard"
      - name: smoke the built macos binaries
        run: runner/tools/smoke_posix_binaries.sh ./dist/homing-pigeon ./dist/install
      - name: package macos binaries
        run: |
          set -euo pipefail
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name="homing-pigeon-macos-x86_64-$ver"
          mkdir -p "pkg/$name"
          cp dist/homing-pigeon dist/install runner/config.example.json "pkg/$name/"
          python runner/tools/stamp_provenance.py --job build-macos-x86_64 --out "pkg/$name/BUILD-PROVENANCE.json"
          tar czf "$name.tar.gz" -C pkg "$name"
          bad=$(tar tzf "$name.tar.gz" | grep -v "^$name/" || true)
          [ -z "$bad" ] || { echo "tarball has entries outside '$name/': $bad"; exit 1; }
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.tar.gz

  build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt build
      - run: python -m build
      - run: python runner/tools/stamp_provenance.py --job build-python --out dist/BUILD-PROVENANCE.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homing-pigeon-python
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-python, build-windows, build-windows-arm64, build-linux, build-linux-arm64, build-macos, build-macos-x86_64, build-pi-light]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history: the project snapshot bundles it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      # Every install archive carries the whole project: every tracked
      # file, the full history as a git bundle, and this run's CI facts
      # and test results, with an index of links (PROJECT-SNAPSHOT.md).
      # It is built once, here, after the test job, and added to the
      # finished archives before the sums and the attestation, so both
      # cover it. The same snapshot ships alone as
      # homing-pigeon-project-<version>.tar.gz.
      # Every extension's declared upstream sources, pinned: "latest"
      # resolved to a commit, every file and archive hashed. A box
      # fetches exactly these bytes on an extension's first run
      # (runner/ops/extsources.py); the release ships this lock, never
      # the sources. A signal, not a gate, and never a hidden one:
      # each pin that cannot be made is recorded in the lock and
      # raised as a warning annotation on this run, and if the tool
      # itself fails the release ships without a lock, said in a
      # warning too (the boxes then resolve on first run).
      - name: pin the extension sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci
          python3 runner/tools/pin_extension_sources.py --out ci/EXTENSION-SOURCES.lock.json \
            || { rm -f ci/EXTENSION-SOURCES.lock.json; echo "::warning title=extension sources::pinning failed; this release ships without a sources lock"; }
      - name: snapshot the project into every archive
        run: |
          set -euo pipefail
          mkdir -p ci
          mv artifacts/test-output.log ci/ 2>/dev/null || true
          log=""; [ -f ci/test-output.log ] && log="--test-log ci/test-output.log"
          lock=""; [ -f ci/EXTENSION-SOURCES.lock.json ] && lock="--sources-lock ci/EXTENSION-SOURCES.lock.json"
          python3 runner/tools/make_snapshot.py --out snapshot $log $lock
          ver=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          archives=$(ls artifacts/homing-pigeon-*.tar.gz artifacts/homing-pigeon-*.zip)
          python3 runner/tools/make_snapshot.py --inject snapshot/project $archives
          tar czf "artifacts/homing-pigeon-project-${ver}.tar.gz" -C snapshot project
          ls -l artifacts
      # The SBOM (SPDX JSON) joins the artifact set here, before
      # the sums: SHA384SUMS then covers it, the attestation below
      # covers the sums, and the mirrors carry it for free.
      - run: python3 runner/tools/make_sbom.py --out artifacts/SBOM.spdx.json
      - run: |
          cd artifacts
          sha384sum * > SHA384SUMS
          cat SHA384SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'artifacts/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/*
          generate_release_notes: true

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: homing-pigeon-python
          path: dist
      - run: rm -f dist/BUILD-PROVENANCE.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  sourceforge:
    # Uploads the install archives, the wheel, the sdist,
    # SHA384SUMS, and the SBOM. Runs only after the GitHub Release
    # only on a tag push, so a push to main never starts it.
    # Skips until the repo secrets exist, so a release is never
    # blocked on SourceForge. Upload user: dru555444, unless
    # SOURCEFORGE_USER is set. Secrets: SOURCEFORGE_SSH_KEY,
    # SOURCEFORGE_API_KEY. Variable or secret: SOURCEFORGE_PROJECT.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: publish release files to SourceForge
        env:
          GH_TOKEN: ${{ github.token }}
          SF_USER: ${{ secrets.SOURCEFORGE_USER }}
          SF_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SF_API: ${{ secrets.SOURCEFORGE_API_KEY }}
          SF_PROJECT: ${{ vars.SOURCEFORGE_PROJECT || secrets.SOURCEFORGE_PROJECT }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SF_USER="${SF_USER:-dru555444}"
          if [ -z "${SF_KEY}" ] || [ -z "${SF_API}" ] || [ -z "${SF_PROJECT}" ]; then
            echo "::warning::SourceForge publish skipped. Set secrets SOURCEFORGE_SSH_KEY and SOURCEFORGE_API_KEY, and variable SOURCEFORGE_PROJECT."
            exit 0
          fi
          case "$SF_PROJECT" in
            *[!A-Za-z0-9-]*|""|[-]*) echo "SOURCEFORGE_PROJECT must be a SourceForge unix name"; exit 1 ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            SHA="${{ github.sha }}"
            case "$SHA" in
              *[!0-9a-f]*|"") echo "no commit sha for this run"; exit 1 ;;
            esac
            TAG=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq ".[] | select(.object.sha==\"$SHA\") | .ref" | sed 's#refs/tags/##' | head -n 1)
            [ -n "$TAG" ] || { echo "no v* tag on $SHA"; exit 1; }
          fi
          case "$TAG" in
            v[0-9A-Za-z._+-]*) ;;
            *) echo "refusing tag $TAG"; exit 1 ;;
          esac
          mkdir -p publish
          gh release download "$TAG" --repo "$REPO" --dir publish
          test -f publish/SHA384SUMS
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SF_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' 'frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC' >> "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -q 'SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY'
          sftp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -b - "${SF_USER}@frs.sourceforge.net" <<EOF
          -mkdir /home/frs/project/${SF_PROJECT}/${TAG}
          EOF
          rsync -av \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes" \
            publish/ "${SF_USER}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/${TAG}/"
          python3 - <<'PY'
          import os, pathlib, subprocess, time, urllib.parse
          project = os.environ["SF_PROJECT"]
          tag = os.environ["TAG"]
          key = os.environ["SF_API"]
          # Two releases cut minutes apart run their pipelines side by
          # side, and the older one can reach this step last. The
          # per-version folders do not care; the default-download
          # marker does. It is set only by the newest tag on the repo,
          # so the mirror never points at a release that was already
          # superseded when it got here.
          def vkey(t):
              return tuple(int(x) for x in t.lstrip("v").split("."))
          tags = subprocess.check_output(
              ["gh", "api", "--paginate",
               f"repos/{os.environ['REPO']}/git/matching-refs/tags/v",
               "--jq", ".[].ref"], text=True).split()
          vtags = []
          for ref in tags:
              name = ref.rsplit("/", 1)[-1]
              try:
                  vtags.append((vkey(name), name))
              except ValueError:
                  continue
          newest = max(vtags)[1] if vtags else tag
          if vkey(newest) > vkey(tag):
              print(f"{tag} is not the newest tag ({newest}); files are "
                    f"published, the default download stays with {newest}")
              raise SystemExit(0)
          marked = 0
          for path in sorted(pathlib.Path("publish").iterdir()):
              name = path.name
              low = name.lower()
              # Only the primary archive of each OS is the default
              # download. The other architectures are published
              # beside it and must not be marked, or the count
              # below stops being 3.
              if "windows" in low and "x86_64" in low and low.endswith(".zip"):
                  platforms = ["windows"]
              elif "linux" in low and "x86_64" in low and low.endswith((".tar.gz", ".tgz")):
                  platforms = ["linux"]
              elif "macos" in low and "arm64" in low and low.endswith((".tar.gz", ".tgz", ".zip")):
                  platforms = ["mac"]
              else:
                  continue
              quoted = "/".join(urllib.parse.quote(part) for part in (tag, name))
              url = f"https://sourceforge.net/projects/{urllib.parse.quote(project)}/files/{quoted}"
              data = "&".join(f"default={item}" for item in platforms)
              # rsync returns before FRS will serve the file. v3.11.33
              # uploaded, then the first PUT 404'd and the job exited
              # before the git mirror.
              last = None
              for _attempt in range(8):
                  try:
                      subprocess.check_call([
                          "curl", "-fsS", "-H", "Accept: application/json", "-X", "PUT",
                          "--data", data,
                          "--data-urlencode", f"api_key={key}",
                          url,
                      ])
                      last = None
                      break
                  except subprocess.CalledProcessError as exc:
                      last = exc
                      time.sleep(8)
              if last is not None:
                  raise last
              marked += 1
              print(f"default {platforms[0]} -> {name}")
          if marked != 3:
              raise SystemExit(f"expected 3 default downloads, marked {marked}")
          PY
          git clone --mirror "https://github.com/${REPO}.git" sf-src
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git -C sf-src push "ssh://${SF_USER}@git.code.sf.net/p/${SF_PROJECT}/code" refs/heads/main:refs/heads/main
          git -C sf-src push --force "ssh://${SF_USER}@git.code.sf.net/p/${SF_PROJECT}/code" 'refs/tags/*:refs/tags/*'
          echo "source mirrored to SourceForge git (main + tags)"

  gitlab:
    # Uploads the install archives, the wheel, the sdist,
    # SHA384SUMS, and the SBOM, plus a GitLab Release linking
    # as SourceForge: tag push, after the GitHub Release. Skips
    # until GITLAB_TOKEN exists. Variable or secret:
    # GITLAB_PROJECT (default pigeon-home/homing-pigeon),
    # GITLAB_USER (default pigeon-home).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: publish release to GitLab
        env:
          GH_TOKEN: ${{ github.token }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GL_PROJECT: ${{ vars.GITLAB_PROJECT || secrets.GITLAB_PROJECT || 'pigeon-home/homing-pigeon' }}
          GL_USER: ${{ vars.GITLAB_USER || secrets.GITLAB_USER || 'pigeon-home' }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GL_TOKEN}" ]; then
            echo "::warning::GitLab publish skipped. Set the GITLAB_TOKEN secret."
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            SHA="${{ github.sha }}"
            case "$SHA" in
              *[!0-9a-f]*|"") echo "no commit sha for this run"; exit 1 ;;
            esac
            TAG=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq ".[] | select(.object.sha==\"$SHA\") | .ref" | sed 's#refs/tags/##' | head -n 1)
            [ -n "$TAG" ] || { echo "no v* tag on $SHA"; exit 1; }
          fi
          case "$TAG" in
            v[0-9A-Za-z._+-]*) ;;
            *) echo "refusing tag $TAG"; exit 1 ;;
          esac
          GL_ENC=$(printf '%s' "$GL_PROJECT" | sed 's|/|%2F|g')
          export GL_API="https://gitlab.com/api/v4/projects/${GL_ENC}"
          git clone --mirror "https://github.com/${REPO}.git" gl-src
          git -C gl-src push "https://${GL_USER}:${GL_TOKEN}@gitlab.com/${GL_PROJECT}.git" refs/heads/main:refs/heads/main
          git -C gl-src push --force "https://${GL_USER}:${GL_TOKEN}@gitlab.com/${GL_PROJECT}.git" 'refs/tags/*:refs/tags/*'
          echo "source mirrored to GitLab (main + tags)"
          mkdir -p publish
          gh release download "$TAG" --repo "$REPO" --dir publish
          test -f publish/SHA384SUMS
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse
          token = os.environ["GL_TOKEN"]
          api = os.environ["GL_API"]
          project = os.environ["GL_PROJECT"]
          tag = os.environ["TAG"]

          def call(method, url, data=None):
              cmd = ["curl", "-fsS", "-X", method,
                     "-H", f"PRIVATE-TOKEN: {token}", url]
              if data is not None:
                  cmd += ["-H", "Content-Type: application/json",
                          "--data", json.dumps(data)]
              return subprocess.check_call(cmd)

          links = []
          for path in sorted(pathlib.Path("publish").iterdir()):
              url = (f"{api}/packages/generic/homing-pigeon/"
                     f"{urllib.parse.quote(tag, safe='')}/{path.name}")
              subprocess.check_call([
                  "curl", "-fsS", "-X", "PUT",
                  "-H", f"PRIVATE-TOKEN: {token}",
                  "--upload-file", str(path), url])
              print(f"uploaded {path.name}")
              links.append({
                  "name": path.name,
                  "url": url,
                  "link_type": "package",
              })
          body = {
              "tag_name": tag,
              "name": f"homing-pigeon {tag}",
              "description": ("Mirrored from the GitHub release. "
                              "Release files are in the package "
                              "registry, linked below."),
              "assets": {"links": links},
          }
          try:
              call("POST", f"{api}/releases", body)
              print(f"gitlab release {tag} created")
          except subprocess.CalledProcessError:
              call("PUT", f"{api}/releases/{urllib.parse.quote(tag, safe='')}",
                   body)
              print(f"gitlab release {tag} updated")
          PY
