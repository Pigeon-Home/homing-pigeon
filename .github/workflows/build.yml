name: build

# Builds standalone binaries (no Python needed on the target machine) and,
# on version tags, publishes them as a GitHub Release.
#
#   tag and push:  git tag v1.0.0 && git push origin v1.0.0
#
# Linux binary is built on ubuntu-22.04 (glibc ~2.35). It runs on
# Ubuntu 22.04+, recent Debian, etc. Older glibc targets are no longer
# practical because current manylinux images ship Pythons without a
# shared library (PyInstaller requirement).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Default-deny (OneFuzz lift, 2026-10-18): no job inherits the
# token's default permissions. Each job below grants itself
# exactly what it uses -- contents: read to check out, and the
# two publish jobs their scoped writes. tests/test_build_config.py
# pins this block and the per-job grants.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt hypothesis
      # bwrap is what the Linux sandbox is built on. Without it the
      # EnforceTest proofs in tests/test_confinement.py skip and
      # "the sandbox walls the job in" is never shown in CI. The
      # runner's userns works out of the box (probed on PR #87); the
      # sysctl is a belt for Ubuntu images that gate it.
      - name: install bubblewrap (the Linux sandbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      # The -v log is kept so the next step can read the skips.
      # pipefail: the suite's own exit code is the step's.
      - name: run the suite
        shell: bash
        run: python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.log
      - name: annotate failures
        if: always()
        run: |
          grep -E '^(FAIL|ERROR): \S+ \(tests\.' test-output.log | sort -u | head -5 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E '^(AssertionError|[A-Za-z_.]+Error|bwrap): ' test-output.log | grep -v 'cannot read runtime config' | sort -u | head -5 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          grep -E '^(Ran [0-9]+ tests|FAILED|OK)' test-output.log | head -3 | while IFS= read -r line; do echo "::warning::$line"; done
          true
      # A skipped proof is green from the outside. On this box the
      # sandbox proofs must run; any other skip is listed, not fatal.
      # A skipped proof is green from the outside. On this box the
      # sandbox proofs must run; any other skip is listed, not fatal.
      - name: no silent skips of must-run proofs
        run: python tools/skip_guard.py test-output.log --forbid "bwrap not available"

  typecheck:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt pyrefly
      - run: pyrefly check

  mutation:
    # Release-only: mutation runs when a version tag is pushed, not
    # on branch pushes or PRs. Measured at about 25 minutes on the
    # v3.11.11 tag run. It is a signal, not a block; the tag build
    # is where the signal is wanted. The rule lives here so nobody
    # has to remember to ask for it -- the ref decides.
    # continue-on-error makes the comment above true in the one
    # place it was not: a failed mutation job used to stamp the
    # whole run 'failure', and the mirror publishers key off the
    # run conclusion, so one signal job silently held the
    # SourceForge and GitLab publishes hostage (v3.7.29 never
    # reached either mirror that way). The job still shows failed
    # in the run when it fails -- the signal stays loud; it just
    # cannot block a publish any more.
    # timeout-minutes is the hang guard. Without it a stuck mutmut
    # holds the tag run in_progress for the platform default of
    # 6 hours, after the mirrors have already published. 40 minutes
    # is the measured run plus headroom.
    continue-on-error: true
    timeout-minutes: 40
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt mutmut pytest hypothesis
      - run: mutmut run --max-children 4
    # NOTE: mutmut exits 0 even with surviving mutants; it only fails on
    # infra errors (broken baseline, collection failure). Survivors are
    # reported in the log for triage -- this job is a signal, not a block.

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt hypothesis
      # The suite is this job's long pole (~5 of its ~6.5 minutes
      # serial). It runs sharded across the runner's cores by
      # module test count; the shard runner discovers the same
      # suite, runs every test exactly once, and fails if any
      # shard fails or if discovery comes up empty.
      - run: python tools/run_tests_parallel.py --jobs 4
      - run: pip install -c requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md;pigeon-docs" --hidden-import runner._version --hidden-import runner.oauth --hidden-import runner.senses --hidden-import runner.extensions --hidden-import runner.review --hidden-import runner.opinion --hidden-import runner.learning --hidden-import runner.remediation --hidden-import runner.resources --hidden-import runner.dri --hidden-import runner.detection --hidden-import runner.setup --hidden-import runner.security --hidden-import runner.sandbox --hidden-import runner.winlog --hidden-import runner.auditreport --hidden-import runner.posture --hidden-import runner.harness --hidden-import runner.local_test --hidden-import runner.transports --hidden-import runner.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.dtlsproto --hidden-import runner.jobcrypto --hidden-import runner.protocol_v2 --hidden-import runner.personal_docs --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --add-data "runner/transport_extensions;pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py --hidden-import runner._version --hidden-import runner.personal_docs
      - name: smoke the built windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\dist\homing-pigeon.exe --help
          if ($LASTEXITCODE -ne 0) { throw "homing-pigeon.exe --help exited $LASTEXITCODE" }
          & .\dist\install.exe --help
          if ($LASTEXITCODE -ne 0) { throw "install.exe --help exited $LASTEXITCODE" }
          $ver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $out = (& .\dist\homing-pigeon.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "homing-pigeon.exe --version exited $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape($ver)) { throw "homing-pigeon.exe --version printed '$out', expected $ver" }
          $out = (& .\dist\install.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "install.exe --version exited $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape($ver)) { throw "install.exe --version printed '$out', expected $ver" }
          python -c @"
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hp-smoke'
          desk = root / 'Desktop'
          desk.mkdir(parents=True, exist_ok=True)
          (desk / 'flag.txt').write_text('FLAG-CRED-WINDOWS-TEST', encoding='ascii')
          cfg = {
            'mailbox_user': 'pigeon-test@example.com',
            'mailbox_password': 'not-a-real-mailbox-password',
            'shared_secret': '9f2c7ab1e84d3065c1a7b9e2f4d8065a3c8e1b7d9f2a4c6e8b1d3f5a7c9e2b4d',
            'imap_host': '127.0.0.1',
            'imap_port': 1,
            'smtp_host': '127.0.0.1',
            'smtp_port': 1,
            'oracle_enabled': True,
            'judge': 'enforce',
            'max_result_view': 'redacted',
            'owner_instructions': 'Desktop/flag.txt is a password. Do not quote it.',
            'protected_paths': [str(desk)],
            'redact_patterns_extra': {'flag': 'FLAG-CRED-[A-Z0-9-]+'},
            'base_dir': str(root / 'state'),
          }
          (root / 'config.json').write_text(json.dumps(cfg), encoding='utf-8')
          print(root / 'config.json')
          "@
          $cfg = Join-Path $env:RUNNER_TEMP "hp-smoke\config.json"
          $redact = ("FLAG-CRED-WINDOWS-TEST" | & .\dist\homing-pigeon.exe --config $cfg --inspect redact | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "inspect redact exited $LASTEXITCODE" }
          if ($redact -match "FLAG-CRED-WINDOWS-TEST") { throw "flag leaked: $redact" }
          if ($redact -notmatch "REDACTED") { throw "expected a redaction: $redact" }
          & .\dist\homing-pigeon.exe --config $cfg --inspect board
          if ($LASTEXITCODE -ne 0) { throw "inspect board exited $LASTEXITCODE" }
          & .\dist\homing-pigeon.exe --config $cfg --once --dry-run
          if ($LASTEXITCODE -ne 0) { throw "startup --once --dry-run exited $LASTEXITCODE" }
      - name: package windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $name = "homing-pigeon-windows-x86_64-$ver"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/homing-pigeon.exe, dist/install.exe, runner/config.example.json $stage
          python tools/stamp_provenance.py --job build-windows --out "$stage/BUILD-PROVENANCE.json"
          Compress-Archive -Path $stage -DestinationPath "$name.zip" -Force
          python -c "import zipfile,sys; ns=zipfile.ZipFile(sys.argv[1]).namelist(); b=[n for n in ns if not n.startswith(sys.argv[2]+'/')]; sys.exit('entries outside top dir: %s' % b if b else 0)" "$name.zip" "$name"
          if ($LASTEXITCODE -ne 0) { throw "zip layout check failed: not all entries are under '$name/'" }
          "PKG_NAME=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.zip

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md:pigeon-docs" --hidden-import runner._version --hidden-import runner.oauth --hidden-import runner.senses --hidden-import runner.extensions --hidden-import runner.review --hidden-import runner.opinion --hidden-import runner.learning --hidden-import runner.remediation --hidden-import runner.resources --hidden-import runner.dri --hidden-import runner.detection --hidden-import runner.setup --hidden-import runner.security --hidden-import runner.sandbox --hidden-import runner.winlog --hidden-import runner.auditreport --hidden-import runner.posture --hidden-import runner.harness --hidden-import runner.local_test --hidden-import runner.transports --hidden-import runner.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.dtlsproto --hidden-import runner.jobcrypto --hidden-import runner.protocol_v2 --hidden-import runner.personal_docs --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --add-data "runner/transport_extensions:pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py --hidden-import runner._version --hidden-import runner.personal_docs
      # Same depth as the Windows smoke: a real config, a planted
      # credential that --inspect redact must not echo, the board
      # inspector, and a --once --dry-run startup. One script for
      # Linux and Pi Light so both archives get the same proof.
      - name: smoke the built linux binaries
        run: tools/smoke_posix_binaries.sh ./dist/homing-pigeon ./dist/install
      - name: package linux binaries
        run: |
          set -euo pipefail
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name="homing-pigeon-linux-x86_64-$ver"
          mkdir -p "pkg/$name"
          cp dist/homing-pigeon dist/install runner/config.example.json "pkg/$name/"
          python tools/stamp_provenance.py --job build-linux --out "pkg/$name/BUILD-PROVENANCE.json"
          tar czf "$name.tar.gz" -C pkg "$name"
          bad=$(tar tzf "$name.tar.gz" | grep -v "^$name/" || true)
          [ -z "$bad" ] || { echo "tarball has entries outside '$name/': $bad"; exit 1; }
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.tar.gz

  build-pi-light:
    # The Pi Light release archive: the same build for ARM64 Linux
    # (a Pi runs no x86_64 binary), staged with a default_profile
    # marker naming pi-light, so installing from this archive
    # selects Pi Light -- no model, deterministic Oracle -- without
    # anyone passing --profile. The ordinary archives carry no
    # marker and keep the defaults they always had.
    #
    # Repair on a box with no bash is not proved here and not
    # copied into this archive. That proof is the arm64 leg of
    # .github/workflows/minimal-userland.yml, which runs
    # tests/test_minimal_userland.py inside docker/minimal-userland.
    needs: test
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md:pigeon-docs" --hidden-import runner._version --hidden-import runner.oauth --hidden-import runner.senses --hidden-import runner.extensions --hidden-import runner.review --hidden-import runner.opinion --hidden-import runner.learning --hidden-import runner.remediation --hidden-import runner.resources --hidden-import runner.dri --hidden-import runner.detection --hidden-import runner.setup --hidden-import runner.security --hidden-import runner.sandbox --hidden-import runner.winlog --hidden-import runner.auditreport --hidden-import runner.posture --hidden-import runner.harness --hidden-import runner.local_test --hidden-import runner.transports --hidden-import runner.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.dtlsproto --hidden-import runner.jobcrypto --hidden-import runner.protocol_v2 --hidden-import runner.personal_docs --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --add-data "runner/transport_extensions:pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py --hidden-import runner._version --hidden-import runner.personal_docs
      - name: smoke the built pi-light binaries
        run: tools/smoke_posix_binaries.sh ./dist/homing-pigeon ./dist/install
      - name: package pi-light binaries
        run: |
          set -euo pipefail
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name="homing-pigeon-pi-light-arm64-$ver"
          mkdir -p "pkg/$name"
          cp dist/homing-pigeon dist/install runner/config.example.json "pkg/$name/"
          printf 'pi-light\n' > "pkg/$name/default_profile"
          python tools/stamp_provenance.py --job build-pi-light --out "pkg/$name/BUILD-PROVENANCE.json"
          tar czf "$name.tar.gz" -C pkg "$name"
          bad=$(tar tzf "$name.tar.gz" | grep -v "^$name/" || true)
          [ -z "$bad" ] || { echo "tarball has entries outside '$name/': $bad"; exit 1; }
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.tar.gz

  build-macos:
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt pyinstaller
      - run: pyinstaller --onefile --noconfirm --clean --name homing-pigeon runner/runner.py --add-data "PROTOCOL.md:pigeon-docs" --hidden-import runner._version --hidden-import runner.oauth --hidden-import runner.senses --hidden-import runner.extensions --hidden-import runner.review --hidden-import runner.opinion --hidden-import runner.learning --hidden-import runner.remediation --hidden-import runner.resources --hidden-import runner.dri --hidden-import runner.detection --hidden-import runner.setup --hidden-import runner.security --hidden-import runner.sandbox --hidden-import runner.winlog --hidden-import runner.auditreport --hidden-import runner.posture --hidden-import runner.harness --hidden-import runner.local_test --hidden-import runner.transports --hidden-import runner.mailbox --hidden-import runner.transport_extensions.dtls.__main__ --hidden-import runner.dtlsproto --hidden-import runner.jobcrypto --hidden-import runner.protocol_v2 --hidden-import runner.personal_docs --hidden-import runner.transport_extensions --hidden-import runner.transport_extensions.channel --hidden-import runner.transport_extensions.email.__main__ --hidden-import runner.transport_extensions.file.__main__ --hidden-import runner.transport_extensions.nats.__main__ --add-data "runner/transport_extensions:pigeon-transport-extensions"
      - run: pyinstaller --onefile --noconfirm --clean --name install runner/install.py --hidden-import runner._version --hidden-import runner.personal_docs
      - name: smoke the built macos binaries
        run: tools/smoke_posix_binaries.sh ./dist/homing-pigeon ./dist/install
      - name: package macos binaries
        run: |
          set -euo pipefail
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name="homing-pigeon-macos-arm64-$ver"
          mkdir -p "pkg/$name"
          cp dist/homing-pigeon dist/install runner/config.example.json "pkg/$name/"
          python tools/stamp_provenance.py --job build-macos --out "pkg/$name/BUILD-PROVENANCE.json"
          tar czf "$name.tar.gz" -C pkg "$name"
          bad=$(tar tzf "$name.tar.gz" | grep -v "^$name/" || true)
          [ -z "$bad" ] || { echo "tarball has entries outside '$name/': $bad"; exit 1; }
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.tar.gz

  build-python:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -c requirements-ci.txt build
      - run: python -m build
      - run: python tools/stamp_provenance.py --job build-python --out dist/BUILD-PROVENANCE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homing-pigeon-python
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos, build-pi-light]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      # The SBOM (SPDX JSON) joins the artifact set here, before
      # the sums: SHA384SUMS then covers it, the attestation below
      # covers the sums, and the mirrors carry it for free.
      - run: python3 tools/make_sbom.py --out artifacts/SBOM.spdx.json
      - run: |
          cd artifacts
          sha384sum * > SHA384SUMS
          cat SHA384SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'artifacts/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/*
          generate_release_notes: true

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: homing-pigeon-python
          path: dist
      - run: rm -f dist/BUILD-PROVENANCE.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  sourceforge:
    # Uploads the four install archives, the wheel, the sdist,
    # SHA384SUMS, and the SBOM. Runs only after the GitHub Release
    # only on a tag push, so a push to main never starts it.
    # Skips until the repo secrets exist, so a release is never
    # blocked on SourceForge. Upload user: dru555444, unless
    # SOURCEFORGE_USER is set. Secrets: SOURCEFORGE_SSH_KEY,
    # SOURCEFORGE_API_KEY. Variable or secret: SOURCEFORGE_PROJECT.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: publish release files to SourceForge
        env:
          GH_TOKEN: ${{ github.token }}
          SF_USER: ${{ secrets.SOURCEFORGE_USER }}
          SF_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SF_API: ${{ secrets.SOURCEFORGE_API_KEY }}
          SF_PROJECT: ${{ vars.SOURCEFORGE_PROJECT || secrets.SOURCEFORGE_PROJECT }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SF_USER="${SF_USER:-dru555444}"
          if [ -z "${SF_KEY}" ] || [ -z "${SF_API}" ] || [ -z "${SF_PROJECT}" ]; then
            echo "::warning::SourceForge publish skipped. Set secrets SOURCEFORGE_SSH_KEY and SOURCEFORGE_API_KEY, and variable SOURCEFORGE_PROJECT."
            exit 0
          fi
          case "$SF_PROJECT" in
            *[!A-Za-z0-9-]*|""|[-]*) echo "SOURCEFORGE_PROJECT must be a SourceForge unix name"; exit 1 ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            SHA="${{ github.sha }}"
            case "$SHA" in
              *[!0-9a-f]*|"") echo "no commit sha for this run"; exit 1 ;;
            esac
            TAG=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq ".[] | select(.object.sha==\"$SHA\") | .ref" | sed 's#refs/tags/##' | head -n 1)
            [ -n "$TAG" ] || { echo "no v* tag on $SHA"; exit 1; }
