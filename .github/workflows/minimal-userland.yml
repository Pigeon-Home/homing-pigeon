# Agent-Stamp: 30000f1a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
name: minimal-userland

# The README's repair claim, proven on a box with no bash: a signed
# job naming an absent interpreter is repaired to sh and really
# runs, a job whose shape does not fit (PowerShell, or bash-only
# syntax) is left alone, and every repair is stated in the result.
# The run fails if the suite skips: a skip is not a proof. x86_64
# and arm64 (the Raspberry Pi's architecture, and the proof the
# Pi Light archive points at). See runner/tests/test_minimal_userland.py.
on:
  # This workflow fires on no push of its own (the posture since
  # the relief window of 2026-11-12, kept at the window's close):
  # the tag build dispatches it after the mirrors when the tag's
  # tree changed under runner/, and it runs on its schedule and on
  # dispatch, so a push to main pays for build.yml alone and a tag
  # whose runner code did not change pays for none of the nine.
  # Its own `push: tags` trigger went with RELEASE_TOKEN (2026-11-12):
  # a tag pushed with the token fires push triggers, and nine
  # proof workflows on every tag held the account's runners.
  pull_request:
  schedule:
    # The nightly, so the proof runs daily while pushes to main do
    # not fire it.
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions: {}

# One run at a time per ref, the newest push waiting behind it (as
# build.yml). Without a group every push queued its own run: with
# the campaign pushing a test a minute, 20 of these sat queued on
# 2026-10-25 and held the runner slots cut-release needed.
concurrency:
  # One group for every release tag, the newest tag's run cancelling
  # the one before: a release burst cuts a tag every ten minutes, and
  # nine proof runs per tag queued up behind each other and held the
  # runners the next cycle's gate needed (2026-11-12: a gate build's
  # macOS leg waited eight minutes behind three tags' proofs). A
  # superseded tag's proof is the newer tag's to give; the nightly
  # and a dispatch on a branch keep a group of their own.
  group: minimal-userland-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  repair-on-busybox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f .github/docker/minimal-userland/Dockerfile -t hp-minimal .
      - name: prove repair, and fail if the suite skipped
        run: |
          set -euo pipefail
          docker run --rm hp-minimal 2>&1 | tee minimal-out.txt || true
          # Not `Ran 6 tests`: a count is a census that breaks when a
          # test is added. The guard wants N > 0, a bare OK, no skip.
          python3 runner/tools/skip_guard.py minimal-out.txt --no-skips --require-ok --annotate
