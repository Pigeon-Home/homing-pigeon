name: job-user

# Q12 (docs/steady/seats/questions.md): the job_user privilege drop can
# only be exercised where a real second user exists and the
# suite runs as root. No ordinary CI job provides either, so
# the enforce tests skip everywhere else -- this job creates
# the user and runs the corpus under sudo, the env-axes
# pattern. It also runs the credential canary module, whose
# other-uid counterpart lives in the job_user tests.
#
# The corpus includes the Q18 probe: a failed initgroups must not
# leave the runner's groups on the job. It was red by design until
# _demote fell back to the user's primary group alone (Q18's
# answer); it is green now, and would go red again on a regression.
on:
  # This workflow fires on no push of its own (the posture since
  # the relief window of 2026-11-12, kept at the window's close):
  # the tag build dispatches it after the mirrors when the tag's
  # tree changed under runner/, and it runs on its schedule and on
  # dispatch, so a push to main pays for build.yml alone and a tag
  # whose runner code did not change pays for none of the nine.
  # Its own `push: tags` trigger went with RELEASE_TOKEN (2026-11-12):
  # a tag pushed with the token fires push triggers, and nine
  # proof workflows on every tag held the account's runners.
  schedule:
    # The nightly, so the proof runs daily while pushes to main do
    # not fire it.
    - cron: "53 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One group for every release tag, the newest tag's run cancelling
  # the one before: a release burst cuts a tag every ten minutes, and
  # nine proof runs per tag queued up behind each other and held the
  # runners the next cycle's gate needed (2026-11-12: a gate build's
  # macOS leg waited eight minutes behind three tags' proofs). A
  # superseded tag's proof is the newer tag's to give; the nightly
  # and a dispatch on a branch keep a group of their own.
  group: job-user-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  job-user:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install -c .github/requirements-ci.txt hypothesis
      - name: create the second user and prove it exists
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash pigeon-test
          id pigeon-test
      - name: the corpus, as root, with the user present
        run: |
          set -o pipefail
          PY="$(command -v python)"
          sudo env "PATH=$PATH" "$PY" -m unittest \
            runner.tests.test_secret_files_job_user \
            runner.tests.test_credential_canary -v 2>&1 | tee job-user.log
      - name: report
        if: always()
        run: |
          grep -qE '^OK' job-user.log && verdict=OK || verdict=FAILED
          echo "::notice title=job-user::$verdict -- $(grep -E '^Ran ' job-user.log | tr '\n' ' ')"
          { grep -E '^(FAIL|ERROR): ' job-user.log || true; } | while read -r line; do
            echo "::warning title=job-user::$line"
          done
          { grep -E '^(AssertionError|[A-Za-z]+Error): ' job-user.log || true; } | head -10 | while read -r line; do
            echo "::warning title=job-user detail::${line:0:300}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: job-user
          path: job-user.log
