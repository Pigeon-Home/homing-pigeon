name: macos-confinement

# The macOS confinement backend's live proof
# (runner/guard/macos_confine.py). There is no Mac in the
# project's own fleet, so the hosted Macs are the field: one
# Apple silicon leg and one Intel leg, the two machines the
# release freezes its macOS binaries on.
#
# On each, the backend's own test module runs whole, twice --
# as the runner's ordinary user, which is how a macOS install
# runs (a launchd agent of the user's own), and as root, where
# a job user can be applied at the spawn door. The live classes
# read the boundary from inside a job: the one tree that takes
# a write, the ceiling on a process's address map and whether
# the job can lift it, a set-user-ID program, a signal to a
# process outside, a job handed to launchd, the services of the
# session a job may look up -- the user database, and not the
# pasteboard: a mark put on the clipboard outside is not read
# inside, and a job's write to it does not land -- and the mode
# a fresh install states on this Mac.
#
# Then the leg freezes the two release binaries with the build
# workflow's own commands, read out of build.yml so the two
# cannot drift, and puts them to the questions a release's user
# meets. The frozen runner must start with confinement at
# enforce and run a job under it -- the job's exit code says
# whether a write outside its work directory landed, whether
# it carried a ceiling and whether the pasteboard answered it,
# and the audit log must name the controls. The same job under
# a config that names the pasteboard must be answered, which is
# the setting read through the release binary. The frozen
# installer, run from a staged copy of the release archive into
# a home of its own, must leave confinement at enforce in the
# config it writes.
#
# The first step prints what the tests cannot say for
# themselves: what the host is, how large a bare process's
# address map already is there (the kernel holds a data-size
# limit against the whole map, so that size is the floor under
# every memory ceiling), which language runtimes still start
# under a given ceiling, and what a job reaches besides files:
# the host's process list and the hardware's properties, which
# the profile leaves it, and the clipboard and the session's
# other services, which it is refused -- each asked from inside
# a job, with launchd's own answer printed beside it.
#
# A signal on the backend, not a gate on a release: weekly and
# on dispatch, never on the release path.
on:
  schedule:
    - cron: "23 10 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  # One run per ref at a time, and the one that is going
  # finishes: its verdict is the point.
  group: macos-confinement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confinement:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            build_job: build-macos
          - os: macos-15-intel
            arch: x86_64
            build_job: build-macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: the host
        run: |
          set +e
          echo "== the host"
          sw_vers
          echo "machine: $(uname -m)  leg: ${{ matrix.arch }}"
          echo "hw.ncpu=$(sysctl -n hw.ncpu) hw.memsize=$(sysctl -n hw.memsize)"
          id -un
          ls -l /bin/sh /private/var/select/sh /usr/bin/sandbox-exec /bin/ps 2>&1
          echo "== a bare process's address map (ps: vsz and rss in KiB)"
          /bin/sh -c 'ps -o vsz=,rss=,comm= -p $$'
          python -c "import os, subprocess; print(subprocess.run(['ps', '-o', 'vsz=,rss=,comm=', '-p', str(os.getpid())], capture_output=True, text=True).stdout.strip())"
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from runner.guard import macos_confine as MC

          print("== the probe, and the limit its trial read")
          print("probe:", MC.macos_confinement_problem())
          print("trial:", MC.trial_facts())
          for level, text in MC.posture_lines({}):
              print("posture: %s %s" % (level, text))

          print("== which runtimes still start, by the ceiling")
          runtimes = (["/bin/sh", "-c", "true"], [sys.executable, "-c", "pass"],
                      ["node", "-e", "0"], ["ruby", "-e", "0"],
                      ["perl", "-e", "0"], ["java", "-version"],
                      ["git", "--version"])
          for mib in (512, 2048, 8192):
              row = []
              for cmd in runtimes:
                  name = os.path.basename(cmd[0])
                  try:
                      done = subprocess.run(
                          MC.build_shim_argv(cmd, memory_bytes=mib << 20),
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=120)
                      row.append("%s=%s" % (name, "starts" if done.returncode == 0
                                            else "exit %d" % done.returncode))
                  except Exception as e:
                      row.append("%s=%s" % (name, type(e).__name__))
              print("%5d MiB: %s" % (mib, "  ".join(row)))

          print("== what a job reaches besides files, and what it is refused")
          PASTEBOARD = MC.PASTEBOARD_SERVICE
          NAMED = {"security": {"confinement": {"macos": {"mach_services": [
              PASTEBOARD, "hp.no.such.service"]}}}}
          LOOKUP = (
              "import ctypes, sys\n"
              "libc = ctypes.CDLL(None)\n"
              "bp = ctypes.c_uint.in_dll(libc, 'bootstrap_port')\n"
              "port = ctypes.c_uint(0)\n"
              "print('kr=%d' % libc.bootstrap_look_up("
              "bp, sys.argv[1].encode(), ctypes.byref(port)))\n")

          def job(argv, work, cfg=None):
              try:
                  proc = MC.spawn_confined_process(
                      argv, cwd=work, env=dict(os.environ), cfg=cfg)
              except Exception as e:
                  return ("no spawn", "", str(e)[-200:])
              try:
                  out, err = proc.communicate(timeout=60)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  out, err = proc.communicate()
              proc.close()
              return (proc.returncode,
                      out.decode("utf-8", "replace").strip(),
                      err.decode("utf-8", "replace").strip()[-200:])

          def outside(argv, **kw):
              try:
                  return subprocess.run(argv, capture_output=True,
                                        timeout=60, **kw)
              except Exception as e:
                  return subprocess.CompletedProcess(argv, 99, b"", str(e).encode())

          def read(result, mark):
              return "exit %s, %s" % (
                  result[0], "READ" if mark in result[1] else "not read")

          with tempfile.TemporaryDirectory() as work:
              print("left to a job -- the host's process list:", job(
                  [sys.executable, "-c",
                   "import ctypes\n"
                   "libc = ctypes.CDLL(None)\n"
                   "print('processes listed:', "
                   "libc.proc_listallpids(None, 0))\n"], work)[:2])
              # The count of the lines that carry it, never the lines.
              rc, out, err = job(
                  ["/bin/sh", "-c",
                   "/usr/sbin/ioreg -c IOPlatformExpertDevice -d 2 | "
                   "grep -c IOPlatformSerialNumber"], work)
              print("left to a job -- the hardware's serial number:",
                    "READ" if out not in ("", "0") else "not read (exit %s)" % rc)
              mark = "HP-CLIPBOARD-MARK"
              outside(["/usr/bin/pbcopy"], input=mark.encode())
              done = outside(["/usr/bin/pbpaste"])
              print("the clipboard, outside a job:", read(
                  (done.returncode, done.stdout.decode("utf-8", "replace")), mark))
              print("the clipboard, inside a job:", read(
                  job(["/usr/bin/pbpaste"], work), mark))
              job(["/bin/sh", "-c",
                   "printf %s HP-WRITTEN-BY-A-JOB | /usr/bin/pbcopy"], work)
              print("the clipboard after a job wrote to it:",
                    "WRITTEN" if outside(["/usr/bin/pbpaste"]).stdout
                    == b"HP-WRITTEN-BY-A-JOB" else "as it was")
              print("the clipboard, inside a job whose config names the pasteboard:",
                    read(job(["/usr/bin/pbpaste"], work, NAMED), mark))
              for name in (PASTEBOARD, "hp.no.such.service",
                           MC.SESSION_SERVICES[0], MC.SESSION_SERVICES[1],
                           "com.apple.system.DirectoryService.libinfo_v1"):
                  print("a lookup of %s -- outside a job: %s; inside: %s; "
                        "inside under a config that names the pasteboard "
                        "and hp.no.such.service: %s" % (
                            name,
                            outside([sys.executable, "-c", LOOKUP, name]
                                    ).stdout.decode().strip(),
                            job([sys.executable, "-c", LOOKUP, name], work)[1],
                            job([sys.executable, "-c", LOOKUP, name], work,
                                NAMED)[1]))
              for what, argv, word in (
                      ("the network configuration", ["/usr/sbin/scutil", "--dns"], "resolver"),
                      ("the list of keychains", ["/usr/bin/security", "list-keychains"], "keychain"),
                      ("the list of disks", ["/usr/sbin/diskutil", "list"], "/dev/disk")):
                  print("%s -- outside a job: %s; inside: %s" % (
                      what,
                      "answered" if word in outside(argv).stdout.decode(
                          "utf-8", "replace") else "not answered",
                      "ANSWERED" if word in job(argv, work)[1] else "refused"))
              outside(["/usr/bin/pbcopy"], input=b"")
              done = outside(["/usr/bin/pbpaste"])
              print("the system's reader on an empty clipboard, outside a job: "
                    "exit %s, %d bytes" % (done.returncode, len(done.stdout)))
              print("the same inside a job: exit %s" % job(["/usr/bin/pbpaste"], work)[0])
          PY
          exit 0
      - name: the backend's test module, as the runner's user
        env:
          # The clipboard tests put a mark of their own on this
          # session's clipboard: asked for here, and nowhere a
          # person's clipboard is.
          HP_LIVE_CLIPBOARD: "1"
        run: |
          set -o pipefail
          python -m unittest runner.tests.test_macos_confine -v 2>&1 | tee macos-confinement-user.log
          # A clipboard test that found no pasteboard to ask
          # proved nothing: on this leg that is a failure.
          if grep -a -q -e "no pasteboard answers this session" -e "writes this session's clipboard" macos-confinement-user.log; then
            echo "::error title=macos-confinement::a clipboard test did not run as the runner's user: no pasteboard answered outside a job"
            exit 1
          fi
      - name: the same module, as root
        if: always()
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 HP_LIVE_CLIPBOARD=1 python -m unittest runner.tests.test_macos_confine -v 2>&1 | tee macos-confinement-root.log
          echo "clipboard tests that found no pasteboard to ask as root: $(grep -a -c "no pasteboard answers this session" macos-confinement-root.log || true)"
      - name: freeze the release binaries, as the build freezes them
        if: always()
        run: |
          set -euo pipefail
          pip install -c .github/requirements-ci.txt pyinstaller
          # The two freeze commands of this leg's build job, read
          # out of build.yml: what is frozen here is what a
          # release freezes.
          python - "${{ matrix.build_job }}" > freeze.sh <<'PY'
          import re, sys
          text = open(".github/workflows/build.yml", encoding="utf-8").read()
          block = re.search(r"(?ms)^  %s:\n(.*?)(?=^  [a-z0-9_-]+:\n|\Z)" % re.escape(sys.argv[1]), text).group(1)
          runs = re.findall(r"(?m)^\s+- run: (pyinstaller .*)$", block)
          assert len(runs) == 2, runs
          print("set -e")
          print("\n".join(runs))
          PY
          sh freeze.sh > freeze.log 2>&1 || { tail -n 40 freeze.log; exit 1; }
          ls -l dist/homing-pigeon dist/install
          ./dist/homing-pigeon --version
          ./dist/install --version
      - name: the frozen runner, with confinement at enforce
        if: always()
        run: |
          set +e
          root="$RUNNER_TEMP/hp-frozen"; mkdir -p "$root/state" "$root/outside"
          python - "$root" <<'PY'
          import json, sys
          root = sys.argv[1]
          cfg = {
              "mailbox_user": "pigeon-test@example.com",
              "mailbox_password": "not-a-real-mailbox-password",
              "shared_secret": "9f2c7ab1e84d3065c1a7b9e2f4d8065a3c8e1b7d9f2a4c6e8b1d3f5a7c9e2b4d",
              "imap_host": "127.0.0.1", "imap_port": 1,
              "smtp_host": "127.0.0.1", "smtp_port": 1,
              "base_dir": root + "/state",
              "security": {"modes": {"confinement": "enforce",
                                     "job_user": "off",
                                     "audience": "off"}},
          }
          json.dump(cfg, open(root + "/config.json", "w"))
          # The same config with the pasteboard named among the
          # services a job may look up.
          cfg["security"]["confinement"] = {"macos": {"mach_services": [
              "com.apple.pasteboard.1"]}}
          json.dump(cfg, open(root + "/config-pasteboard.json", "w"))
          # The job says what it found by the code it exits with:
          # 11 its own work directory took no write, 12 a write
          # outside it landed, 13 and 14 it carries no ceiling of
          # its own, 15 the pasteboard answered it, 0 none of
          # those.
          script = (
              ': > inside.txt || exit 11\n'
              '(: > "$HP_OUTSIDE") 2>/dev/null && exit 12\n'
              's=$(ulimit -S -d); h=$(ulimit -H -d)\n'
              '[ "$s" = "$h" ] || exit 13\n'
              'case $s in unlimited|"") exit 14 ;; esac\n'
              '/usr/bin/pbpaste > /dev/null 2>&1 && exit 15\n'
              'exit 0\n')
          json.dump({"job_id": "hp-frozen-proof", "kind": "exec",
                     "script": script,
                     "env": {"HP_OUTSIDE": root + "/outside/escaped.txt"},
                     "timeout_sec": 60},
                    open(root + "/variant.json", "w"))
          PY
          bad=0
          echo "== the pasteboard answers outside a job"
          # The control under the job's clipboard reading: a
          # mark put on the clipboard here is read back here.
          printf %s "HP-FROZEN-MARK" | /usr/bin/pbcopy
          if [ "$(/usr/bin/pbpaste 2>/dev/null)" = "HP-FROZEN-MARK" ]; then echo "a mark put on the clipboard is read back outside a job"; else bad=1; echo "::error title=macos-confinement::no pasteboard answered outside a job: the job's clipboard reading would prove nothing"; fi
          echo "== the frozen runner starts at enforce"
          ./dist/homing-pigeon --config "$root/config.json" --once --dry-run > "$root/start.log" 2>&1
          rc=$?
          tail -n 6 "$root/start.log" | cut -c1-400
          echo "start: exit $rc"
          [ "$rc" -eq 0 ] || { bad=1; echo "::error title=macos-confinement::the frozen runner did not start with confinement at enforce (exit $rc): $(tail -n 2 "$root/start.log" | tr '\n' ' ' | cut -c1-400)"; }
          echo "== a job through the frozen runner"
          ./dist/homing-pigeon --config "$root/config.json" --run-variant "$root/variant.json" > "$root/job.log" 2>&1
          rc=$?
          tail -n 4 "$root/job.log" | cut -c1-400
          report="$(grep -a '"stage"' "$root/job.log" | tail -n 1)"
          code="$(printf '%s' "$report" | python -c "import json, sys; r = json.loads(sys.stdin.read() or '{}'); print(r.get('stage'), r.get('exit_code'))")"
          echo "job: exit $rc, report: $code"
          [ "$code" = "ran 0" ] || { bad=1; echo "::error title=macos-confinement::the job through the frozen runner did not read the boundary as confined ($code)"; }
          if [ -e "$root/outside/escaped.txt" ]; then bad=1; echo "::error title=macos-confinement::a write outside the job's work directory landed"; else echo "no file landed outside the work directory"; fi
          echo "== what the audit log says of it"
          # A job run by this door keeps its records under the
          # state directory's own work tree: every audit log
          # below the state directory is read.
          line="$(find "$root/state" -name security-audit.jsonl -exec grep -a -h '"feature": "confinement"' {} + | tail -n 1)"
          printf '%s\n' "$line" | cut -c1-500
          case "$line" in
            *'"decision": "confined"'*'macos: seatbelt_profile + no_network + spawn_resource_limits'*) ;;
            *) bad=1; echo "::error title=macos-confinement::the audit log does not record the job as confined under the macOS controls" ;;
          esac
          echo "== the same job under a config that names the pasteboard"
          ./dist/homing-pigeon --config "$root/config-pasteboard.json" --run-variant "$root/variant.json" > "$root/job-pasteboard.log" 2>&1
          rc=$?
          tail -n 4 "$root/job-pasteboard.log" | cut -c1-400
          report="$(grep -a '"stage"' "$root/job-pasteboard.log" | tail -n 1)"
          code="$(printf '%s' "$report" | python -c "import json, sys; r = json.loads(sys.stdin.read() or '{}'); print(r.get('stage'), r.get('exit_code'))")"
          echo "job: exit $rc, report: $code"
          [ "$code" = "ran 15" ] || { bad=1; echo "::error title=macos-confinement::under a config that names the pasteboard, the job through the frozen runner was not answered by it ($code)"; }
          # No record before this job names a service: one that
          # does is this job's, wherever its log stands.
          line="$(find "$root/state" -name security-audit.jsonl -exec grep -a -h '"feature": "confinement"' {} + | grep -a '"decision": "confined"' | grep -a 'services the config names: com.apple.pasteboard.1' | tail -n 1)"
          printf '%s\n' "$line" | cut -c1-500
          [ -n "$line" ] || { bad=1; echo "::error title=macos-confinement::the audit log does not name the service the config named"; }
          echo "== the frozen runner's posture report"
          ./dist/homing-pigeon --config "$root/config.json" --posture > "$root/posture.log" 2>&1
          grep -a -i "confinement" "$root/posture.log" | cut -c1-300
          grep -a -q "no other of the session's services: the clipboard is refused" "$root/posture.log" || { bad=1; echo "::error title=macos-confinement::the frozen runner's posture report does not say the clipboard is refused"; }
          echo "frozen runner verdict: $bad"
          exit "$bad"
      - name: the frozen installer, on a home of its own
        if: always()
        run: |
          set +e
          home="$RUNNER_TEMP/hp-home"; pkg="$RUNNER_TEMP/hp-pkg"
          mkdir -p "$home" "$pkg"
          # The release archive's own contents, staged as the
          # build's packaging step stages them.
          cp dist/homing-pigeon dist/install runner/config.example.json "$pkg/"
          bad=0
          ( cd "$pkg" && HOME="$home" ./install --dir "$home/.homing-pigeon" --no-inference --no-collector --dry-run ) > "$home/install.log" 2>&1
          rc=$?
          grep -a -n "platform:\|installed:\|error\|Traceback" "$home/install.log" | cut -c1-600 | head -n 40
          echo "installer: exit $rc"
          [ "$rc" -eq 0 ] || { bad=1; echo "::error title=macos-confinement::the frozen installer exited $rc: $(tail -n 3 "$home/install.log" | tr '\n' ' ' | cut -c1-400)"; }
          grep -a -q "security.modes.confinement left at enforce" "$home/install.log" || { bad=1; echo "::error title=macos-confinement::the frozen installer did not leave confinement at enforce on this Mac"; }
          grep -a -q "platform: a job may ask the user database who a user is, and no other of the session's services: the clipboard is refused" "$home/install.log" || { bad=1; echo "::error title=macos-confinement::the frozen installer did not say the clipboard is refused on this Mac"; }
          mode="$(python -c "import json, sys; cfg = json.load(open(sys.argv[1])); print(cfg.get('security', {}).get('modes', {}).get('confinement', 'enforce'))" "$home/.homing-pigeon/config.json" 2>&1)"
          echo "security.modes.confinement in the written config: $mode"
          [ "$mode" = "enforce" ] || { bad=1; echo "::error title=macos-confinement::the config the frozen installer wrote states confinement as $mode"; }
          ( cd "$pkg" && HOME="$home" ./install --dir "$home/.homing-pigeon" --uninstall ) > "$home/uninstall.log" 2>&1
          echo "uninstall: exit $?"
          echo "frozen installer verdict: $bad"
          exit "$bad"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-confinement-${{ matrix.arch }}
          path: |
            macos-confinement-user.log
            macos-confinement-root.log
          if-no-files-found: warn
