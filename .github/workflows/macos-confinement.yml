name: macos-confinement

# The macOS confinement backend's live proof
# (runner/guard/macos_confine.py). There is no Mac in the
# project's own fleet, so the hosted Macs are the field: one
# Apple silicon leg and one Intel leg, the two machines the
# release freezes its macOS binaries on.
#
# On each, the backend's own test module runs whole, twice --
# as the runner's ordinary user, which is how a macOS install
# runs (a launchd agent of the user's own), and as root, where
# a job user can be applied at the spawn door. The live classes
# read the boundary from inside a job: the one tree that takes
# a write, the ceiling on a process's address map and whether
# the job can lift it, a set-user-ID program, a signal to a
# process outside, a job handed to launchd, and the mode a
# fresh install states on this Mac.
#
# Then the leg freezes the two release binaries with the build
# workflow's own commands, read out of build.yml so the two
# cannot drift, and puts them to the questions a release's user
# meets. The frozen runner must start with confinement at
# enforce and run a job under it -- the job's exit code says
# whether a write outside its work directory landed and whether
# it carried a ceiling, and the audit log must name the
# controls. The frozen installer, run from a staged copy of the
# release archive into a home of its own, must leave
# confinement at enforce in the config it writes.
#
# The first step prints what the tests cannot say for
# themselves: what the host is, how large a bare process's
# address map already is there (the kernel holds a data-size
# limit against the whole map, so that size is the floor under
# every memory ceiling), which language runtimes still start
# under a given ceiling, and the two things the profile leaves
# a job able to reach besides files -- the host's process list
# and the clipboard.
#
# A signal on the backend, not a gate on a release: weekly and
# on dispatch, never on the release path.
on:
  schedule:
    - cron: "23 10 * * 4"
  workflow_dispatch:
    inputs:
      try_services:
        description: "Mach service names to try a job's programs under, separated by spaces"
        required: false
        default: ""

permissions: {}

concurrency:
  # One run per ref at a time, and the one that is going
  # finishes: its verdict is the point.
  group: macos-confinement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confinement:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            build_job: build-macos
          - os: macos-15-intel
            arch: x86_64
            build_job: build-macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: the host
        run: |
          set +e
          echo "== the host"
          sw_vers
          echo "machine: $(uname -m)  leg: ${{ matrix.arch }}"
          echo "hw.ncpu=$(sysctl -n hw.ncpu) hw.memsize=$(sysctl -n hw.memsize)"
          id -un
          ls -l /bin/sh /private/var/select/sh /usr/bin/sandbox-exec /bin/ps 2>&1
          echo "== a bare process's address map (ps: vsz and rss in KiB)"
          /bin/sh -c 'ps -o vsz=,rss=,comm= -p $$'
          python -c "import os, subprocess; print(subprocess.run(['ps', '-o', 'vsz=,rss=,comm=', '-p', str(os.getpid())], capture_output=True, text=True).stdout.strip())"
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from runner.guard import macos_confine as MC

          print("== the probe, and the limit its trial read")
          print("probe:", MC.macos_confinement_problem())
          print("trial:", MC.trial_facts())
          for level, text in MC.posture_lines({}):
              print("posture: %s %s" % (level, text))

          print("== which runtimes still start, by the ceiling")
          runtimes = (["/bin/sh", "-c", "true"], [sys.executable, "-c", "pass"],
                      ["node", "-e", "0"], ["ruby", "-e", "0"],
                      ["perl", "-e", "0"], ["java", "-version"],
                      ["git", "--version"])
          for mib in (512, 2048, 8192):
              row = []
              for cmd in runtimes:
                  name = os.path.basename(cmd[0])
                  try:
                      done = subprocess.run(
                          MC.build_shim_argv(cmd, memory_bytes=mib << 20),
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=120)
                      row.append("%s=%s" % (name, "starts" if done.returncode == 0
                                            else "exit %d" % done.returncode))
                  except Exception as e:
                      row.append("%s=%s" % (name, type(e).__name__))
              print("%5d MiB: %s" % (mib, "  ".join(row)))

          print("== what the profile leaves a job able to reach besides files")

          def job(argv, work):
              proc = MC.spawn_confined_process(argv, cwd=work,
                                               env=dict(os.environ))
              try:
                  out, err = proc.communicate(timeout=30)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  out, err = proc.communicate()
              proc.close()
              return (proc.returncode,
                      out.decode("utf-8", "replace").strip(),
                      err.decode("utf-8", "replace").strip()[-200:])

          with tempfile.TemporaryDirectory() as work:
              print("the host's process list:", job(
                  [sys.executable, "-c",
                   "import ctypes\n"
                   "libc = ctypes.CDLL(None)\n"
                   "print('processes listed:', "
                   "libc.proc_listallpids(None, 0))\n"], work))
              subprocess.run(["/usr/bin/pbcopy"], input=b"HP-CLIPBOARD-MARK",
                             timeout=30)
              rc, out, err = job(["/usr/bin/pbpaste"], work)
              print("the clipboard:", (
                  rc, "read from inside a job" if "HP-CLIPBOARD-MARK" in out
                  else "not read", err))
          PY
          exit 0
      - name: what a job's programs ask the session's services for
        env:
          HP_TRY_SERVICES: ${{ inputs.try_services }}
        run: |
          set +e
          python - <<'PY'
          import ctypes, os, re, shutil, subprocess, sys, tempfile, time
          from runner.guard import macos_confine as MC

          PY = sys.executable
          TRY = [s for s in os.environ.get("HP_TRY_SERVICES", "").replace(",", " ").split() if s]
          TEMP = os.environ.get("RUNNER_TEMP") or tempfile.gettempdir()
          MARK = "HP-MARK-%d" % os.getpid()


          def profile_for(work, services=None, mach_all=False, extra=""):
              """The backend's own profile with its Mach rule replaced."""
              text = MC.build_profile(os.path.realpath(work), interpreter=PY)
              assert text.count("(allow mach*)\n") == 1, "the Mach rule moved"
              if mach_all:
                  return text
              rule = ""
              if services:
                  rule = "(allow mach-lookup\n" + "".join(
                      '    (global-name "%s")\n' % s for s in services) + ")\n"
              return text.replace("(allow mach*)\n", rule + extra)


          def run(argv, profile, work, timeout=60, stdin=None):
              """One command under a profile and the launcher: (exit, out, err)."""
              env = dict(os.environ)
              tmp = os.path.join(work, ".hp-tmp")
              os.makedirs(tmp, exist_ok=True)
              env["TMPDIR"] = tmp
              full = [MC.SANDBOX_EXEC_BIN, "-p", profile] + MC.build_shim_argv(
                  argv, memory_bytes=8 << 30)
              try:
                  done = subprocess.run(full, cwd=work, env=env, input=stdin,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                        timeout=timeout)
                  return (done.returncode,
                          done.stdout.decode("utf-8", "replace").strip(),
                          done.stderr.decode("utf-8", "replace").strip())
              except subprocess.TimeoutExpired:
                  return ("timeout", "", "")
              except Exception as e:
                  return (type(e).__name__, "", str(e)[:200])


          def sh(script):
              return ["/bin/sh", "-c", script]


          ME = subprocess.run(["id", "-un"], capture_output=True, text=True).stdout.strip()

          # name, argv, and the text its output must carry to count as working
          FUNCTION = [
              ("sh-tools", sh("ls -l . >/dev/null && date >/dev/null && mktemp ./x.XXXXXX >/dev/null && echo a | sed s/a/b/ | grep -q b && awk 'BEGIN{print 1}' >/dev/null && echo SH-OK"), "SH-OK"),
              ("id-un", sh("id -un"), ME),
              ("whoami", ["whoami"], ME),
              ("ls-owner", sh("ls -ld . | awk '{print $3}'"), ME),
              ("python-pwd", [PY, "-c", "import os, pwd; print(pwd.getpwuid(os.getuid()).pw_name)"], ME),
              ("python-std", [PY, "-c", "import time, locale, tempfile, json, hashlib, subprocess, socket; time.localtime(); tempfile.mkstemp(); socket.gethostname(); print(subprocess.run(['/bin/echo', 'PY-OK'], capture_output=True, text=True).stdout)"], "PY-OK"),
              ("python-tz", [PY, "-c", "import time; print('TZ', time.tzname[0])"], "TZ"),
              ("python-ssl", [PY, "-c", "import ssl; ssl.create_default_context(); print('SSL-OK')"], "SSL-OK"),
              ("pip", [PY, "-m", "pip", "--version"], "pip"),
              ("perl", ["perl", "-e", "print scalar(getpwuid($<)), qq(\\n)"], ME),
              ("ruby", ["ruby", "-e", "require 'etc'; puts Etc.getpwuid.name"], ME),
              ("node", ["node", "-e", "const os = require('os'); require('fs').writeFileSync('n.txt', 'x'); console.log(os.userInfo().username)"], ME),
              ("java", ["java", "-version"], ""),
              ("git-named", sh("rm -rf r1 && git init -q r1 && cd r1 && git -c user.name=a -c user.email=a@b.c commit -q --allow-empty -m x && git log --oneline | wc -l"), "1"),
              ("git-auto", sh("rm -rf r2 && git init -q r2 && cd r2 && git commit -q --allow-empty -m x && git log --format=%an | head -n 1"), ""),
              ("cc", sh("printf 'int main(void){return 0;}\\n' > h.c && cc h.c -o h && ./h && echo CC-OK"), "CC-OK"),
              ("make", sh("printf 'all:\\n\\t@echo MAKE-OK\\n' > Makefile && make"), "MAKE-OK"),
              ("xcrun", ["xcrun", "--find", "cc"], "cc"),
              ("sw_vers", ["sw_vers", "-productVersion"], "."),
              ("defaults-sys", ["defaults", "read", "/System/Library/CoreServices/SystemVersion", "ProductVersion"], "."),
              ("plutil", ["plutil", "-lint", "/System/Library/CoreServices/SystemVersion.plist"], "OK"),
              ("curl-v", ["curl", "--version"], "curl"),
              ("openssl", ["openssl", "version"], "SSL"),
              ("sqlite3", ["sqlite3", ":memory:", "select 41+1"], "42"),
              ("zip", sh("echo x > z.txt && zip -q z.zip z.txt && unzip -l z.zip >/dev/null && echo ZIP-OK"), "ZIP-OK"),
              ("tar", sh("echo x > t.txt && tar czf t.tgz t.txt && tar tzf t.tgz"), "t.txt"),
              ("file", ["file", "/bin/ls"], "Mach-O"),
              ("locale", ["locale"], "LC_"),
              ("uname", ["uname", "-a"], "Darwin"),
              ("hostname", ["hostname"], ""),
              ("sysctl", ["sysctl", "-n", "hw.ncpu"], ""),
              ("df", ["df", "-k", "."], "Filesystem"),
              ("getconf-tmp", ["getconf", "DARWIN_USER_TEMP_DIR"], "/"),
              ("codesign", sh("codesign -dv /bin/ls 2>&1 | head -n 1"), "Executable"),
              ("osascript-plain", ["osascript", "-e", "return 1 + 1"], "2"),
              ("date-tz", ["date", "+%Z"], ""),
          ]


          def works(result, want):
              rc, out, err = result
              return rc == 0 and (want in out or want in err)


          def function_pass(profile, work):
              row = {}
              for name, argv, want in FUNCTION:
                  if shutil.which(argv[0]) is None and not os.path.isabs(argv[0]):
                      row[name] = "absent"
                      continue
                  result = run(argv, profile, work)
                  row[name] = "works" if works(result, want) else "exit %s: %s" % (
                      result[0], (result[2] or result[1]).replace("\n", " | ")[-110:])
              return row


          def outside(argv, **kw):
              try:
                  return subprocess.run(argv, capture_output=True, text=True, timeout=60, **kw)
              except Exception as e:
                  return subprocess.CompletedProcess(argv, 99, "", str(e))


          LOOKUP = (
              "import ctypes, sys\n"
              "libc = ctypes.CDLL(None)\n"
              "bp = ctypes.c_uint.in_dll(libc, 'bootstrap_port')\n"
              "port = ctypes.c_uint(0)\n"
              "kr = libc.bootstrap_look_up(bp, sys.argv[1].encode(), ctypes.byref(port))\n"
              "print('LOOKUP kr=%d port=%d' % (kr, port.value))\n")
          REGISTER = (
              "import ctypes\n"
              "libc = ctypes.CDLL(None)\n"
              "bp = ctypes.c_uint.in_dll(libc, 'bootstrap_port')\n"
              "libc.mach_reply_port.restype = ctypes.c_uint\n"
              "port = libc.mach_reply_port()\n"
              "kr = libc.bootstrap_register(bp, b'hp.facts.squat', ctypes.c_uint(port))\n"
              "print('REGISTER kr=%d' % kr)\n")
          RESOLVE = (
              "import socket\n"
              "try:\n"
              "    print('RESOLVED', socket.getaddrinfo('example.com', 80)[0][4][0])\n"
              "except Exception as e:\n"
              "    print('NOT-RESOLVED', type(e).__name__, e)\n")
          PROCS = (
              "import ctypes\n"
              "libc = ctypes.CDLL(None)\n"
              "print('PROCS', libc.proc_listallpids(None, 0))\n")


          def reach_pass(profile, work):
              """What a job reaches under a profile, each as a short verdict."""
              row = {}
              outside(["/usr/bin/pbcopy"], input=MARK)
              rc, out, err = run(["/usr/bin/pbpaste"], profile, work, timeout=30)
              row["clipboard-read"] = "READ" if MARK in out else "no (exit %s)" % rc
              written = MARK + "-W"
              run(sh("printf %s | /usr/bin/pbcopy" % written), profile, work, timeout=30)
              row["clipboard-write"] = "WRITTEN" if outside(["/usr/bin/pbpaste"]).stdout == written else "no"
              rc, out, err = run([PY, "-c", RESOLVE], profile, work, timeout=60)
              row["resolve-a-name"] = out[:60] or "exit %s %s" % (rc, err[-60:])
              rc, out, err = run(["/usr/bin/dscacheutil", "-q", "host", "-a", "name", "example.com"], profile, work, timeout=60)
              row["dscacheutil-host"] = "RESOLVED" if "ip_address" in out else "no (exit %s)" % rc
              rc, out, err = run([PY, "-c", LOOKUP, "com.apple.pasteboard.1"], profile, work, timeout=30)
              row["look-up-pasteboard"] = out[:40] or "exit %s %s" % (rc, err[-60:])
              rc, out, err = run([PY, "-c", REGISTER], profile, work, timeout=30)
              row["register-a-name"] = out[:40] or "exit %s %s" % (rc, err[-60:])
              rc, out, err = run([PY, "-c", PROCS], profile, work, timeout=30)
              row["list-processes"] = out[:40] or "exit %s %s" % (rc, err[-60:])
              outside(["/usr/bin/pkill", "-x", "Calculator"])
              rc, out, err = run(["/usr/bin/open", "-g", "-a", "Calculator"], profile, work, timeout=60)
              time.sleep(2)
              row["open-an-app"] = "LAUNCHED" if outside(["/usr/bin/pgrep", "-x", "Calculator"]).returncode == 0 else "no (exit %s: %s)" % (rc, err[-70:])
              outside(["/usr/bin/pkill", "-x", "Calculator"])
              escape = os.path.join(TEMP, "hp-facts-open-escape")
              if os.path.exists(escape):
                  os.unlink(escape)
              with open(os.path.join(work, "esc.command"), "w") as fh:
                  fh.write("#!/bin/sh\n: > '%s'\n" % escape)
              os.chmod(os.path.join(work, "esc.command"), 0o755)
              rc, out, err = run(["/usr/bin/open", "-g", "./esc.command"], profile, work, timeout=60)
              time.sleep(4)
              row["open-a-script"] = "RAN OUTSIDE THE PROFILE" if os.path.exists(escape) else "no (exit %s: %s)" % (rc, err[-70:])
              outside(["/usr/bin/pkill", "-x", "Terminal"])
              outside(["/usr/bin/defaults", "write", "hp.facts.domain", "mark", MARK])
              rc, out, err = run(["/usr/bin/defaults", "read", "hp.facts.domain", "mark"], profile, work, timeout=30)
              row["read-a-preference"] = "READ" if MARK in out else "no (exit %s)" % rc
              outside(["/usr/bin/defaults", "delete", "hp.facts.domain"])
              rc, out, err = run(["/usr/sbin/scutil", "--dns"], profile, work, timeout=30)
              row["scutil-dns"] = "ANSWERED %d bytes" % len(out) if "resolver" in out else "no (exit %s)" % rc
              rc, out, err = run(sh("/usr/sbin/ioreg -c IOPlatformExpertDevice -d 2 | grep -c IOPlatformSerialNumber"), profile, work, timeout=30)
              row["ioreg-serial"] = "READ" if out.strip() not in ("", "0") else "no"
              rc, out, err = run(["/usr/bin/security", "list-keychains"], profile, work, timeout=30)
              row["list-keychains"] = "ANSWERED" if "keychain" in out else "no (exit %s)" % rc
              rc, out, err = run(["/usr/sbin/screencapture", "-x", "shot.png"], profile, work, timeout=30)
              row["screencapture"] = "CAPTURED" if os.path.exists(os.path.join(work, "shot.png")) else "no (exit %s)" % rc
              rc, out, err = run(["/usr/sbin/diskutil", "list"], profile, work, timeout=30)
              row["diskutil-list"] = "ANSWERED" if "/dev/disk" in out else "no (exit %s)" % rc
              rc, out, err = run(["/usr/bin/logger", MARK + "-LOG"], profile, work, timeout=30)
              row["logger"] = "exit %s" % rc
              return row


          SENSITIVE = re.compile(
              r"pasteboard|pboard|windowserver|launchservices|\.lsd\.|coreservices|tccd|"
              r"usernot|SecurityServer|securityd|secd|keychain|distributed_notifications|"
              r"appleevents|quarantine|dock|Finder|SystemUIServer|accountsd|cloudd|bird|"
              r"contacts|Calendar|AddressBook|speech|audio|cmio|mediaremote|bluetooth|"
              r"locationd|dnssd|mDNSResponder|networkd|nehelper|nesession|configd|"
              r"SystemConfiguration|metadata|spotlight|screencapture|pbs", re.I)


          def denials_since(t0):
              """The Mach denials the system log holds since t0: {(operation, name): {who}}."""
              time.sleep(2)
              start = time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(t0 - 1))
              try:
                  log = subprocess.run(
                      ["sudo", "-n", "log", "show", "--start", start, "--style", "compact",
                       "--predicate", 'eventMessage CONTAINS "deny" AND eventMessage CONTAINS "mach-"'],
                      capture_output=True, text=True, timeout=300)
              except Exception as e:
                  return {}, "log could not be read: %s" % e
              found = {}
              for line in log.stdout.splitlines():
                  m = re.search(r"Sandbox: (.+?)\((\d+)\) deny\(\d+\) (mach-[a-z-]+) (\S+)", line)
                  if not m:
                      m = re.search(r"duplicate reports? for (.+?)()? deny\(\d+\) (mach-[a-z-]+) (\S+)", line)
                  if m:
                      found.setdefault((m.group(3), m.group(4)), set()).add(m.group(1))
              return found, "log exit %d, %d lines, %d denials" % (
                  log.returncode, len(log.stdout.splitlines()), len(found))


          def show(title, row, base=None):
              print("-- " + title)
              for name in row:
                  mark = "" if base is None or base.get(name) == row[name] else "   <-- differs from all services"
                  if base is None or mark or not str(row[name]).startswith("works"):
                      print("   %-18s %s%s" % (name, row[name], mark))
              if base is not None:
                  same = sum(1 for n in row if base.get(n) == row[n])
                  print("   (%d of %d as with all services)" % (same, len(row)))


          work = tempfile.mkdtemp(prefix="hp-services-")
          print("== the operation names this macOS knows")
          names = ["mach-lookup", "mach-register", "mach-bootstrap", "mach-task-name",
                   "mach-priv-task-port", "mach-priv-host-port", "mach-per-user-lookup",
                   "mach-cross-domain-lookup", "mach-derive-port", "mach-issue-extension",
                   "mach-kernel-endpoint", "mach-host-special-port-set",
                   "mach-task-special-port-set", "mach-host-exception-port-set",
                   "syscall-unix", "syscall-mach", "process-info-pidinfo",
                   "process-info-listpids", "process-info-setcontrol",
                   "process-info-dirtycontrol", "process-info-rusage",
                   "process-info-codesignature", "process-info-ledger",
                   "process-codesigning-status-get", "lsopen", "job-creation",
                   "appleevent-send", "user-preference-read", "user-preference-write",
                   "distributed-notification-post", "darwin-notification-post",
                   "nvram-get", "iokit-open", "iokit-get-properties", "system-socket",
                   "ipc-posix-shm", "ipc-posix-sem", "ipc-sysv-shm", "signal",
                   "process-fork", "process-exec", "pseudo-tty", "sysctl-read"]
          known, unknown = [], []
          for op in names:
              done = outside([MC.SANDBOX_EXEC_BIN, "-p", "(version 1)\n(allow default)\n(deny %s)\n" % op, "/usr/bin/true"])
              (known if done.returncode == 0 else unknown).append(op)
          print("known:", " ".join(known))
          print("not known:", " ".join(unknown))

          print("== the services Apple's own base profiles name")
          for name in ("system.sb", "bsd.sb"):
              path = "/System/Library/Sandbox/Profiles/" + name
              try:
                  text = open(path, encoding="utf-8", errors="replace").read()
              except OSError as e:
                  print(name, "unreadable:", e)
                  continue
              found = sorted(set(re.findall(r'\((?:global|local)-name(?:-regex)? "([^"]+)"\)', text)))
              print("%s: %d names: %s" % (name, len(found), " ".join(found)))
              for line in text.splitlines():
                  if re.search(r"\(allow mach-(?!lookup)|mach-bootstrap|mach-register", line):
                      print("   %s: %s" % (name, line.strip()[:150]))

          print("== with every service (the profile as it stands)")
          base_profile = profile_for(work, mach_all=True)
          base = function_pass(base_profile, work)
          show("what works", base)
          reach_base = reach_pass(base_profile, work)
          show("what a job reaches", reach_base)

          print("== with no service at all, then with what was asked for, round by round")
          allowed = []
          for rnd in range(6):
              t0 = time.time()
              row = function_pass(profile_for(work, allowed), work)
              found, note = denials_since(t0)
              show("round %d: %d services named" % (rnd, len(allowed)), row, base)
              print("   log: " + note)
              asked = {}
              for (op, name), who in sorted(found.items()):
                  asked.setdefault(op, []).append("%s [%s]" % (name, ",".join(sorted(who))[:60]))
              for op, items in asked.items():
                  print("   refused %s: %s" % (op, "; ".join(items)))
              new = sorted({name for (op, name) in found
                            if op == "mach-lookup" and name not in allowed and not SENSITIVE.search(name)})
              held = sorted({name for (op, name) in found
                             if op == "mach-lookup" and name not in allowed and SENSITIVE.search(name)})
              if held:
                  print("   asked for and never added: " + " ".join(held))
              if not new:
                  break
              print("   added: " + " ".join(new))
              allowed += new
          print("the closure: %d services: %s" % (len(allowed), " ".join(allowed)))
          show("what a job reaches under the closure", reach_pass(profile_for(work, allowed), work), reach_base)

          print("== hand-picked lists")
          info = ["com.apple.system.opendirectoryd.libinfo",
                  "com.apple.system.opendirectoryd.membership",
                  "com.apple.system.DirectoryService.libinfo_v1"]
          notify = ["com.apple.system.notification_center"]
          prefs = ["com.apple.cfprefsd.daemon", "com.apple.cfprefsd.agent"]
          logs = ["com.apple.logd", "com.apple.diagnosticd", "com.apple.system.logger"]
          rest = ["com.apple.bsd.dirhelper", "com.apple.trustd", "com.apple.trustd.agent"]
          lists = [("none", []), ("user database", info),
                   ("+ notifications", info + notify),
                   ("+ preferences", info + notify + prefs),
                   ("+ logging", info + notify + prefs + logs),
                   ("+ dirhelper, trustd", info + notify + prefs + logs + rest)]
          if TRY:
              lists.append(("the list handed in", TRY))
          for title, services in lists:
              profile = profile_for(work, services)
              show("%s (%d)" % (title, len(services)), function_pass(profile, work), base)
          show("what a job reaches with the user database alone", reach_pass(profile_for(work, info), work), reach_base)
          show("what a job reaches with the widest hand-picked list", reach_pass(profile_for(work, lists[5][1]), work), reach_base)
          if TRY:
              show("what a job reaches with the list handed in", reach_pass(profile_for(work, TRY), work), reach_base)

          print("== the process rule narrowed to a job's own (a reading for later)")
          text = profile_for(work, info)
          if text.count("(allow process*)\n") == 1:
              for title, rule in (
                      ("fork, exec, and its own process information",
                       "(allow process-fork)\n(allow process-exec*)\n(allow process-info* (target self))\n"),
                      ("fork, exec, and process information of itself and its children",
                       "(allow process-fork)\n(allow process-exec*)\n(allow process-info* (target self))\n(allow process-info* (target children))\n")):
                  narrowed = text.replace("(allow process*)\n", rule)
                  show(title, function_pass(narrowed, work), base)
                  rc, out, err = run([PY, "-c", PROCS], narrowed, work, timeout=30)
                  print("   list-processes: %s" % (out[:40] or "exit %s %s" % (rc, err[-80:])))
          shutil.rmtree(work, ignore_errors=True)
          PY
          exit 0
      - name: the backend's test module, as the runner's user
        run: |
          set -o pipefail
          python -m unittest runner.tests.test_macos_confine -v 2>&1 | tee macos-confinement-user.log
      - name: the same module, as root
        if: always()
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m unittest runner.tests.test_macos_confine -v 2>&1 | tee macos-confinement-root.log
      - name: freeze the release binaries, as the build freezes them
        if: always()
        run: |
          set -euo pipefail
          pip install -c .github/requirements-ci.txt pyinstaller
          # The two freeze commands of this leg's build job, read
          # out of build.yml: what is frozen here is what a
          # release freezes.
          python - "${{ matrix.build_job }}" > freeze.sh <<'PY'
          import re, sys
          text = open(".github/workflows/build.yml", encoding="utf-8").read()
          block = re.search(r"(?ms)^  %s:\n(.*?)(?=^  [a-z0-9_-]+:\n|\Z)" % re.escape(sys.argv[1]), text).group(1)
          runs = re.findall(r"(?m)^\s+- run: (pyinstaller .*)$", block)
          assert len(runs) == 2, runs
          print("set -e")
          print("\n".join(runs))
          PY
          sh freeze.sh > freeze.log 2>&1 || { tail -n 40 freeze.log; exit 1; }
          ls -l dist/homing-pigeon dist/install
          ./dist/homing-pigeon --version
          ./dist/install --version
      - name: the frozen runner, with confinement at enforce
        if: always()
        run: |
          set +e
          root="$RUNNER_TEMP/hp-frozen"; mkdir -p "$root/state" "$root/outside"
          python - "$root" <<'PY'
          import json, sys
          root = sys.argv[1]
          json.dump({
              "mailbox_user": "pigeon-test@example.com",
              "mailbox_password": "not-a-real-mailbox-password",
              "shared_secret": "9f2c7ab1e84d3065c1a7b9e2f4d8065a3c8e1b7d9f2a4c6e8b1d3f5a7c9e2b4d",
              "imap_host": "127.0.0.1", "imap_port": 1,
              "smtp_host": "127.0.0.1", "smtp_port": 1,
              "base_dir": root + "/state",
              "security": {"modes": {"confinement": "enforce",
                                     "job_user": "off",
                                     "audience": "off"}},
          }, open(root + "/config.json", "w"))
          # The job says what it found by the code it exits with:
          # 11 its own work directory took no write, 12 a write
          # outside it landed, 13 and 14 it carries no ceiling of
          # its own, 0 none of those.
          script = (
              ': > inside.txt || exit 11\n'
              '(: > "$HP_OUTSIDE") 2>/dev/null && exit 12\n'
              's=$(ulimit -S -d); h=$(ulimit -H -d)\n'
              '[ "$s" = "$h" ] || exit 13\n'
              'case $s in unlimited|"") exit 14 ;; esac\n'
              'exit 0\n')
          json.dump({"job_id": "hp-frozen-proof", "kind": "exec",
                     "script": script,
                     "env": {"HP_OUTSIDE": root + "/outside/escaped.txt"},
                     "timeout_sec": 60},
                    open(root + "/variant.json", "w"))
          PY
          bad=0
          echo "== the frozen runner starts at enforce"
          ./dist/homing-pigeon --config "$root/config.json" --once --dry-run > "$root/start.log" 2>&1
          rc=$?
          tail -n 6 "$root/start.log" | cut -c1-400
          echo "start: exit $rc"
          [ "$rc" -eq 0 ] || { bad=1; echo "::error title=macos-confinement::the frozen runner did not start with confinement at enforce (exit $rc): $(tail -n 2 "$root/start.log" | tr '\n' ' ' | cut -c1-400)"; }
          echo "== a job through the frozen runner"
          ./dist/homing-pigeon --config "$root/config.json" --run-variant "$root/variant.json" > "$root/job.log" 2>&1
          rc=$?
          tail -n 4 "$root/job.log" | cut -c1-400
          report="$(grep -a '"stage"' "$root/job.log" | tail -n 1)"
          code="$(printf '%s' "$report" | python -c "import json, sys; r = json.loads(sys.stdin.read() or '{}'); print(r.get('stage'), r.get('exit_code'))")"
          echo "job: exit $rc, report: $code"
          [ "$code" = "ran 0" ] || { bad=1; echo "::error title=macos-confinement::the job through the frozen runner did not read the boundary as confined ($code)"; }
          if [ -e "$root/outside/escaped.txt" ]; then bad=1; echo "::error title=macos-confinement::a write outside the job's work directory landed"; else echo "no file landed outside the work directory"; fi
          echo "== what the audit log says of it"
          # A job run by this door keeps its records under the
          # state directory's own work tree: every audit log
          # below the state directory is read.
          line="$(find "$root/state" -name security-audit.jsonl -exec grep -a -h '"feature": "confinement"' {} + | tail -n 1)"
          printf '%s\n' "$line" | cut -c1-500
          case "$line" in
            *'"decision": "confined"'*'macos: seatbelt_profile + no_network + spawn_resource_limits'*) ;;
            *) bad=1; echo "::error title=macos-confinement::the audit log does not record the job as confined under the macOS controls" ;;
          esac
          echo "== the frozen runner's posture report"
          ./dist/homing-pigeon --config "$root/config.json" --posture 2>&1 | grep -a -i "confinement" | cut -c1-300
          echo "frozen runner verdict: $bad"
          exit "$bad"
      - name: the frozen installer, on a home of its own
        if: always()
        run: |
          set +e
          home="$RUNNER_TEMP/hp-home"; pkg="$RUNNER_TEMP/hp-pkg"
          mkdir -p "$home" "$pkg"
          # The release archive's own contents, staged as the
          # build's packaging step stages them.
          cp dist/homing-pigeon dist/install runner/config.example.json "$pkg/"
          bad=0
          ( cd "$pkg" && HOME="$home" ./install --dir "$home/.homing-pigeon" --no-inference --no-collector --dry-run ) > "$home/install.log" 2>&1
          rc=$?
          grep -a -n "platform:\|installed:\|error\|Traceback" "$home/install.log" | cut -c1-600 | head -n 40
          echo "installer: exit $rc"
          [ "$rc" -eq 0 ] || { bad=1; echo "::error title=macos-confinement::the frozen installer exited $rc: $(tail -n 3 "$home/install.log" | tr '\n' ' ' | cut -c1-400)"; }
          grep -a -q "security.modes.confinement left at enforce" "$home/install.log" || { bad=1; echo "::error title=macos-confinement::the frozen installer did not leave confinement at enforce on this Mac"; }
          mode="$(python -c "import json, sys; cfg = json.load(open(sys.argv[1])); print(cfg.get('security', {}).get('modes', {}).get('confinement', 'enforce'))" "$home/.homing-pigeon/config.json" 2>&1)"
          echo "security.modes.confinement in the written config: $mode"
          [ "$mode" = "enforce" ] || { bad=1; echo "::error title=macos-confinement::the config the frozen installer wrote states confinement as $mode"; }
          ( cd "$pkg" && HOME="$home" ./install --dir "$home/.homing-pigeon" --uninstall ) > "$home/uninstall.log" 2>&1
          echo "uninstall: exit $?"
          echo "frozen installer verdict: $bad"
          exit "$bad"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-confinement-${{ matrix.arch }}
          path: |
            macos-confinement-user.log
            macos-confinement-root.log
          if-no-files-found: warn
