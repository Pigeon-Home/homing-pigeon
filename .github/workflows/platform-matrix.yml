# Agent-Stamp: 30000f1a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
name: platform-matrix

# Proof of work across hosts. One portable proof
# (tests/test_platform_proof.py: a signed job runs under the platform
# default and under this Python, a bad signature yields no result, an
# absent interpreter is repaired and stated, non-ASCII survives the
# locale, the result has its members) runs on every leg below, and a
# leg fails unless every test ran and passed -- a skipped proof is
# not a proof (tools/skip_guard.py --no-skips --require-ok).
#
# Legs: native runners (Linux/Windows/macOS, x86_64 and arm64);
# containers for glibc and musl distributions, the Python 3.9 floor,
# and a FIPS-forced Red Hat; QEMU-emulated containers (32-bit ARM as
# on an older Raspberry Pi, i386, ppc64le, s390x, riscv64); BSD VMs;
# and the ordinary administrator fat-fingers applied to a known-good
# base (bash removed, no $HOME, a minimal PATH, the C locale, umask
# 077, a noexec /tmp, a read-only root, a closed stdin).
#
# tier: core legs run on every push and PR; the whole corpus runs
# nightly and on dispatch. The README's "Proven platforms" table is
# pinned to the leg names here by tests/test_build_config.py.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  container:
    name: ${{ matrix.name }}
    if: ${{ matrix.tier == 'core' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- core: every push -------------------------------------
          - {name: alpine-3-x86_64,        tier: core, runner: ubuntu-latest,    image: "alpine:3"}
          - {name: rocky-9-x86_64,         tier: core, runner: ubuntu-latest,    image: "rockylinux:9"}
          - {name: python-3.9-floor-x86_64, tier: core, runner: ubuntu-latest,   image: "python:3.9-slim"}
          - {name: debian-13-arm64,        tier: core, runner: ubuntu-24.04-arm, image: "debian:trixie-slim"}
          - {name: debian-12-armv7-qemu,   tier: core, runner: ubuntu-latest,    image: "debian:bookworm-slim", platform: linux/arm/v7}
          - {name: fatfinger-no-bash,      tier: core, runner: ubuntu-latest,    image: "python:3.12-slim", mutation: no-bash}
          - {name: fatfinger-noexec-tmp,   tier: core, runner: ubuntu-latest,    image: "python:3.12-slim", docker_flags: "--tmpfs /tmp:rw,noexec,nosuid,size=256m"}
          # ---- full: nightly and on dispatch -- distributions, x86_64 --
          - {name: debian-12-x86_64,       tier: full, runner: ubuntu-latest,    image: "debian:bookworm-slim"}
          - {name: debian-11-x86_64,       tier: full, runner: ubuntu-latest,    image: "debian:bullseye-slim"}
          - {name: ubuntu-22.04-x86_64,    tier: full, runner: ubuntu-latest,    image: "ubuntu:22.04"}
          - {name: ubuntu-24.04-x86_64,    tier: full, runner: ubuntu-latest,    image: "ubuntu:24.04"}
          - {name: fedora-latest-x86_64,   tier: full, runner: ubuntu-latest,    image: "fedora:latest"}
          - {name: almalinux-8-x86_64,     tier: full, runner: ubuntu-latest,    image: "almalinux:8"}
          - {name: ubi9-minimal-x86_64,    tier: full, runner: ubuntu-latest,    image: "registry.access.redhat.com/ubi9/ubi-minimal"}
          - {name: ubi9-minimal-fips-x86_64, tier: full, runner: ubuntu-latest,  image: "registry.access.redhat.com/ubi9/ubi-minimal", fips: "1"}
          - {name: opensuse-leap-15-x86_64, tier: full, runner: ubuntu-latest,   image: "opensuse/leap:15"}
          - {name: archlinux-x86_64,       tier: full, runner: ubuntu-latest,    image: "archlinux:latest"}
          - {name: amazonlinux-2023-x86_64, tier: full, runner: ubuntu-latest,   image: "amazonlinux:2023"}
          - {name: python-3.14-x86_64,     tier: full, runner: ubuntu-latest,    image: "python:3.14-slim"}
          # ---- full: distributions, arm64 native ----------------------
          - {name: alpine-3-arm64,         tier: full, runner: ubuntu-24.04-arm, image: "alpine:3"}
          - {name: ubuntu-24.04-arm64,     tier: full, runner: ubuntu-24.04-arm, image: "ubuntu:24.04"}
          - {name: fedora-latest-arm64,    tier: full, runner: ubuntu-24.04-arm, image: "fedora:latest"}
          - {name: rocky-9-arm64,          tier: full, runner: ubuntu-24.04-arm, image: "rockylinux:9"}
          # ---- full: other architectures under QEMU -------------------
          - {name: debian-12-i386-qemu,    tier: full, runner: ubuntu-latest,    image: "debian:bookworm-slim", platform: linux/386}
          - {name: debian-12-ppc64le-qemu, tier: full, runner: ubuntu-latest,    image: "debian:bookworm-slim", platform: linux/ppc64le}
          - {name: debian-12-s390x-qemu,   tier: full, runner: ubuntu-latest,    image: "debian:bookworm-slim", platform: linux/s390x}
          - {name: debian-13-riscv64-qemu, tier: full, runner: ubuntu-latest,    image: "debian:trixie-slim", platform: linux/riscv64}
          # ---- full: the rest of the fat-fingers -----------------------
          - {name: fatfinger-no-home,      tier: full, runner: ubuntu-latest,    image: "python:3.12-slim", mutation: no-home}
          - {name: fatfinger-path-minimal, tier: full, runner: ubuntu-latest,    image: "python:3.12-slim", mutation: path-minimal}
          - {name: fatfinger-c-locale,     tier: full, runner: ubuntu-latest,    image: "python:3.12-slim", mutation: c-locale}
          - {name: fatfinger-umask-077,    tier: full, runner: ubuntu-latest,    image: "python:3.12-slim", mutation: umask-077}
          - {name: fatfinger-closed-stdin, tier: full, runner: ubuntu-latest,    image: "python:3.12-slim", mutation: closed-stdin}
          - {name: fatfinger-readonly-root, tier: full, runner: ubuntu-latest,   image: "python:3.12-slim", docker_flags: "--read-only --tmpfs /tmp:rw,size=256m"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: ${{ matrix.platform != '' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: ${{ matrix.platform }}
      - name: run the portable proof in ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          plat=""; [ -n "${{ matrix.platform }}" ] && plat="--platform ${{ matrix.platform }}"
          docker run --rm $plat ${{ matrix.docker_flags }} \
            -v "$PWD:/src:ro" \
            -e HP_MUTATION="${{ matrix.mutation }}" \
            -e HP_FIPS="${{ matrix.fips }}" \
            "${{ matrix.image }}" sh /src/tools/platform_proof.sh 2>&1 | tee leg.log
          grep PLATFORM-REPORT leg.log | tail -1 >> "$GITHUB_STEP_SUMMARY"

  native:
    name: ${{ matrix.name }}
    if: ${{ matrix.tier == 'core' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: native-ubuntu-x86_64,   tier: core, runner: ubuntu-latest}
          - {name: native-ubuntu-arm64,    tier: core, runner: ubuntu-24.04-arm}
          - {name: native-windows-arm64,   tier: core, runner: windows-11-arm}
          - {name: native-macos-x86_64,    tier: core, runner: macos-13}
          - {name: native-windows-x86_64,  tier: full, runner: windows-latest}
          - {name: native-macos-arm64,     tier: full, runner: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: run the portable proof natively
        shell: bash
        env:
          HP_PLATFORM_PROOF: "1"
        run: |
          python -m unittest tests.test_platform_proof -v 2>&1 | tee proof.log || true
          python tools/skip_guard.py proof.log --no-skips --require-ok
          grep PLATFORM-REPORT proof.log | tail -1 >> "$GITHUB_STEP_SUMMARY"

  vm:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: vm-freebsd-14, os: freebsd}
          - {name: vm-openbsd-7,  os: openbsd}
          - {name: vm-netbsd-10,  os: netbsd}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: ${{ matrix.os == 'freebsd' }}
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          usesh: true
          prepare: pkg install -y python3
          run: sh tools/platform_proof.sh
      - if: ${{ matrix.os == 'openbsd' }}
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          usesh: true
          prepare: pkg_add -I python%3
          run: sh tools/platform_proof.sh
      - if: ${{ matrix.os == 'netbsd' }}
        uses: vmactions/netbsd-vm@fac0a63f3e5244c600cb9ca532d27ee774ecdb4b # v1.4.3
        with:
          usesh: true
          prepare: pkgin -y install python312 || pkgin -y install python311
          run: sh tools/platform_proof.sh
