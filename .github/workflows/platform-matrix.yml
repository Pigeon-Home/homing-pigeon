# Agent-Stamp: 30000f1a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
name: platform-matrix

# Proof of work across hosts. One portable proof
# (runner/tests/test_platform_proof.py: a signed job runs under the platform
# default and under this Python, a bad signature yields no result, an
# absent interpreter is repaired and stated, non-ASCII survives the
# locale, the result has its members) runs on every leg below, and a
# leg fails unless every test ran and passed -- a skipped proof is
# not a proof (runner/tools/skip_guard.py --no-skips --require-ok).
#
# Legs: native runners (Linux/Windows/macOS, x86_64 and arm64);
# containers for glibc and musl distributions, the Python 3.9 floor,
# and a FIPS-forced Red Hat; QEMU-emulated containers (32-bit ARM as
# on an older Raspberry Pi, i386, ppc64le, s390x, riscv64); BSD VMs;
# and the ordinary administrator fat-fingers applied to a known-good
# base (bash removed, no $HOME, a minimal PATH, the C locale, umask
# 077, a noexec /tmp, a read-only root, a closed stdin).
#
# The corpus is .github/platform-legs.json (one entry per leg, with a
# tier). The plan job filters it. A push or a pull request runs the
# core legs on plentiful runners only, so a commit is not waiting on
# macOS, Windows, or an ARM hosted runner that the binary build is
# already using. The nightly schedule and a manual dispatch run the
# whole corpus, including those scarce runners. A job-level `if:`
# cannot read the matrix context, so the plan job feeds the matrices
# via fromJSON. The "Proven platforms" table in docs/steady/use/platforms.md is pinned to
# the leg names in that file by runner/tests/test_build_config.py.
on:
  # This workflow fires on no push of its own (the posture since
  # the relief window of 2026-11-12, kept at the window's close):
  # the tag build dispatches it after the mirrors when the tag's
  # tree changed under runner/, and it runs on its schedule and on
  # dispatch, so a push to main pays for build.yml alone and a tag
  # whose runner code did not change pays for none of the nine.
  # Its own `push: tags` trigger went with RELEASE_TOKEN (2026-11-12):
  # a tag pushed with the token fires push triggers, and nine
  # proof workflows on every tag held the account's runners.
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# A new push replaces the previous push's matrix. It does not
# cancel the nightly, and the nightly does not cancel a push:
# the event name is part of the group.
concurrency:
  # One group for every release tag. The run that is going finishes
  # and gives its verdict; the newest tag's run waits behind it and
  # replaces any older one still waiting -- one running and one
  # waiting at most. A group per tag piled nine runs per tag behind
  # each other and held the runners the next cycle's gate needed
  # (2026-11-12: a gate build's macOS leg waited eight minutes
  # behind three tags' proofs); the newest tag cancelling the run
  # before it left the long proofs with no verdict to read at all
  # (26 of the Python range proof's last 39 runs cancelled). The
  # nightly and a dispatch on a branch keep a group of their own.
  group: platform-matrix-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'pull_request') }}

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      container: ${{ steps.plan.outputs.container }}
      container_count: ${{ steps.plan.outputs.container_count }}
      native: ${{ steps.plan.outputs.native }}
      native_count: ${{ steps.plan.outputs.native_count }}
      vm: ${{ steps.plan.outputs.vm }}
      vm_count: ${{ steps.plan.outputs.vm_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: python3 runner/tools/platform_plan.py

  container:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.container_count != '0' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Three legs at a time since 2026-11-12: the nine container
      # legs starting at once, with the other proof workflows a
      # release tag starts, held the account's job concurrency and
      # queued the next cycle's gate legs for minutes (3.16.24.7:
      # build-windows waited 4.1 minutes, 3.16.24.9: 8). The proofs
      # run after the mirrors and are off the cycle's path; a
      # slower fan-out costs nothing the release waits for.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.container) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ matrix.platform != '' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      - name: run the portable proof in ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          plat=""; [ -n "${{ matrix.platform }}" ] && plat="--platform ${{ matrix.platform }}"
          docker run --rm $plat ${{ matrix.docker_flags }} \
            -v "$PWD:/src:ro" \
            -e HP_MUTATION="${{ matrix.mutation }}" \
            -e HP_FIPS="${{ matrix.fips }}" \
            "${{ matrix.image }}" sh /src/runner/tools/platform_proof.sh 2>&1 | tee leg.log \
            || { tail -n 15 leg.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          grep PLATFORM-REPORT leg.log | tail -1 >> "$GITHUB_STEP_SUMMARY"

  native:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.native_count != '0' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: run the portable proof natively
        shell: bash
        env:
          HP_PLATFORM_PROOF: "1"
        run: |
          python -m unittest runner.tests.test_platform_proof -v 2>&1 | tee proof.log || true
          python runner/tools/skip_guard.py proof.log --no-skips --require-ok --annotate
          grep PLATFORM-REPORT proof.log | tail -1 >> "$GITHUB_STEP_SUMMARY"

  vm:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.vm_count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.vm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ matrix.os == 'freebsd' }}
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: pkg install -y python3
          run: sh runner/tools/platform_proof.sh
      - if: ${{ matrix.os == 'openbsd' }}
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          usesh: true
          prepare: pkg_add -I python%3
          run: sh runner/tools/platform_proof.sh
      - if: ${{ matrix.os == 'netbsd' }}
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1.5.3
        with:
          usesh: true
          # NetBSD: pkg_add is the bootstrap tool (pkgin is itself a package),
          # and /usr/pkg/bin is not on the default PATH over ssh.
          prepare: /usr/sbin/pkg_add -I python312 || /usr/sbin/pkg_add -I python311
          run: PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH sh runner/tools/platform_proof.sh
