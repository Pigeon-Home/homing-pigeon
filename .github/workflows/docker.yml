name: Publish Docker image

# Docker publishing: manual via workflow_dispatch, plus automatic on
# version tags (each release gets a versioned image and moves `latest`).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest, v1.4.1)'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

# Default-deny: the one job grants itself exactly what it
# uses, below.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pigeon-home/homing-pigeon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=sha,prefix=

      # The image is run before it is published: the entrypoint
      # builds a config from the environment, then the runner must
      # start with --once --dry-run and exit 0, touching nothing.
      # Until this step existed the image was built and pushed to
      # ghcr.io on every tag without ever being executed.
      - name: build the image locally and run it once
        run: |
          set -euo pipefail
          docker build -f .github/docker/Dockerfile -t hp-image-smoke .
          docker run --rm \
            -e PIGEON_MAILBOX_USER=pigeon-test@example.com \
            -e PIGEON_MAILBOX_PASSWORD=not-a-real-mailbox-password \
            -e PIGEON_SHARED_SECRET=9f2c7ab1e84d3065c1a7b9e2f4d8065a3c8e1b7d9f2a4c6e8b1d3f5a7c9e2b4d \
            -e PIGEON_IMAP_HOST=127.0.0.1 -e PIGEON_IMAP_PORT=1 \
            -e PIGEON_SMTP_HOST=127.0.0.1 -e PIGEON_SMTP_PORT=1 \
            hp-image-smoke --config /data/config.json --once --dry-run
          docker run --rm --entrypoint python3 hp-image-smoke /app/runner/runner.py --version

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore attestation for the image — verifiable provenance.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
