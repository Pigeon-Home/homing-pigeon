# Agent-Stamp: 40000e00-1234-4abc-9def-0123456789ab
name: stamp-audit

# Every commit's agent stamp against the stamp record, over the whole
# history (runner/tools/stamp_audit.py). From the moment the rules
# were set (2026-10-27, the conductor's word) a stamp signs from one
# session, a session signs as one stamp, a recycled stamp signs
# nothing, and every stamp is on docs/archive/RESEARCHER_IDENT.md.
# The suite runs the same check on a shallow clone; this job reads
# the full history, so a stamp borrowed by another chat is caught on
# the push that borrows it. The report rides on the run's summary.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: stamp-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: the stamps against the record, every commit
        run: |
          set -o pipefail
          python runner/tools/stamp_audit.py --markdown --check 2>&1 | tee stamp-audit.md
      - name: the report on the run's summary
        if: always()
        run: cat stamp-audit.md >> "$GITHUB_STEP_SUMMARY"
