name: Attest with one Sigstore retry
description: >-
  Build provenance for the release artifacts. Sigstore's transparency
  log times out now and then; one retry after a pause rides out a
  blip. A second failure fails the job. The retry lives here so the
  release job in build.yml stays a real gate: continue-on-error is
  allowed only on the mutation signal job.

inputs:
  subject-path:
    description: Files to attest, as the attest action takes them
    required: true

runs:
  using: composite
  steps:
    - id: attest
      continue-on-error: true
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: ${{ inputs.subject-path }}
    - if: steps.attest.outcome == 'failure'
      shell: bash
      run: sleep 60
    - if: steps.attest.outcome == 'failure'
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: ${{ inputs.subject-path }}
