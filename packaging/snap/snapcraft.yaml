# DRAFT, not built, not registered, not uploaded.
# Agent-Stamp: 00000000-muse-7e57-d0c5-58316a922026
#
# Draft Snap Store package definition for Homing Pigeon, prepared
# 2026-11-20. It follows the shape recommended in
# docs/steady/project/snap-store-readiness.md: the python plugin
# on the core24 base, Python bundled into the snap, bubblewrap
# staged beside the runner, and the five console scripts exposed
# as apps. The design notes stand in
# docs/steady/design/app-stores-design.md.
#
# The snap name below is not registered yet; registration is the
# conductor's hand, from his own Snap Store account. The classic
# confinement grant has not been requested yet either; that
# request is also his, through the store's forum process.
#
# Placement: the readiness page leaves the layout choice (a snap
# folder at the root, or a packaging folder) to the conductor.
# This draft sits in the packaging folder, so the runner part's
# source points at the tree root from here; in the standard
# layout the same line reads source: .
#
# Build spike, 2026-11-20: a staged build of this exact layout
# passed the runner's own checks, including a bubblewrap trial
# job (the record stands in the readiness page). The spike also
# found that adopt-info alone adopts nothing: Snapcraft takes a
# part's metadata only through parse-info or a craftctl set
# call, and this part had neither, so a build would have failed
# at the prime step for want of a version. The override-build
# below sets the version from the installed package metadata,
# which is the single source adopt-info was always meant to
# read. A full snapcraft build itself remains untried; the
# machine the spike ran on cannot mount squashfs images, so
# snapd could not install snapcraft or the core24 base there.
#
# Build failure, 2026-11-21: the first Launchpad build of the
# root snap twin (Snapcraft 9.2.1, builds 3355983 amd64 and
# 3355984 arm64) failed at the prime step with an empty version.
# The python plugin never installed the project: its install
# step is "[ -f setup.py ] || [ -f pyproject.toml ] && pip
# install -U ." and in the Launchpad build both tests were false
# in the build working directory, so only certifi was installed
# and importlib.metadata found no pigeon-home-runner metadata.
# The override-build below now installs the project explicitly
# from $CRAFT_PART_SRC before reading its version, and rewrites
# the new scripts' shebangs the way the plugin rewrites the
# scripts it installs itself.
#
# Second failure, 2026-11-21 (build 3355989): the explicit pip
# install above failed because $CRAFT_PART_SRC is not the tree
# root: its ls showed only "buildd" and "homing-pigeon", the
# cloned tree under its own name. The install now targets
# $CRAFT_PART_SRC/homing-pigeon.
#
# Third failure, 2026-11-22 (build 3356273, on the Launchpad
# builder): there the part source IS the tree root, its ls
# showing the tree directly with no homing-pigeon subdirectory,
# so the hard-coded subdirectory path did not exist and the
# install died. The override-build now resolves the tree
# directory first: the homing-pigeon subdirectory when it
# exists, else the part source itself.

name: homing-pigeon
base: core24
adopt-info: runner
summary: A self hosted, email driven agent runner
description: |
  Homing Pigeon runs signed jobs on your own machine. Tell your
  cloud SI to send the job by email; the runner verifies it,
  runs it confined, and mails the result back.
confinement: classic
grade: stable
license: Apache-2.0

platforms:
  amd64:
  arm64:

apps:
  homing-pigeon:
    command: bin/homing-pigeon
    daemon: simple
  homing-pigeon-install:
    command: bin/homing-pigeon-install
  homing-pigeon-send-job:
    command: bin/homing-pigeon-send-job
  homing-pigeon-auth:
    command: bin/homing-pigeon-auth
  homing-pigeon-host:
    command: bin/homing-pigeon-host

parts:
  runner:
    plugin: python
    source: ../..
    python-packages:
      - certifi
    stage-packages:
      - python3-venv
      - python3.12
      - python3.12-minimal
      - libpython3.12-stdlib
      - libpython3.12-minimal
      - bubblewrap
    override-build: |
      craftctl default
      # See the 2026-11-21 notes in the header: the python plugin
      # did not install the project in the Launchpad build, so
      # install it explicitly from the cloned tree inside the
      # part source directory.
      echo "runner part source: $CRAFT_PART_SRC"
      ls "$CRAFT_PART_SRC"
      # The part source layout differs by builder: the
      # snapcraft.io builder nests the tree as a homing-pigeon
      # subdirectory, while the Launchpad builder's part source
      # IS the tree root (build 3356273). Resolve the tree
      # directory first, then install from it.
      if [ -d "$CRAFT_PART_SRC/homing-pigeon" ]; then
        HP_SRC="$CRAFT_PART_SRC/homing-pigeon"
      else
        HP_SRC="$CRAFT_PART_SRC"
      fi
      echo "runner tree source: $HP_SRC"
      ls "$HP_SRC"
      "$CRAFT_PART_INSTALL/bin/pip" install -U "$HP_SRC"
      ls "$CRAFT_PART_INSTALL/bin"
      # Scripts installed above carry the venv interpreter shebang;
      # rewrite them as the plugin rewrites scripts it installs.
      find "$CRAFT_PART_INSTALL" -type f -executable -print0 | xargs --no-run-if-empty -0 sed -i "1 s|^#!$CRAFT_PART_INSTALL/bin/python.*|#!/usr/bin/env python3|"
      craftctl set version="$($CRAFT_PART_INSTALL/bin/python -c "import importlib.metadata; print(importlib.metadata.version('pigeon-home-runner'))")"
