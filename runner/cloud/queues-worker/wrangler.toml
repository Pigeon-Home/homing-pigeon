# Agent-Chat-Stamp: 50000c8e-1b3d-4f5a-9c7e-8d0b2a4c6e8f
name = "homing-pigeon-queues-worker"
main = "src/index.js"
compatibility_date = "2026-10-25"
# A dashboard secret (TENANT, SI_TOKEN, RUNNER_TOKEN, HMAC_SECRET)
# is not in this file. Deploy must leave it there.
keep_vars = true

# One Durable Object per tenant holds its queue, results and quota.
[[durable_objects.bindings]]
name = "TENANT_QUEUE"
class_name = "TenantQueue"

[[migrations]]
tag = "v1"
# SQLite-backed. A free-plan account rejects new_classes (error 10097).
new_sqlite_classes = ["TenantQueue"]

# Tenant records: {si_token_sha256, runner_token_sha256, hmac_secret,
# quota: {jobs_per_hour, bytes_per_day}} keyed by tenant slug.
# [[kv_namespaces]]
# binding = "TENANTS"
# id = "..."

# A one-tenant deployment with no KV: set these as secrets instead.
#   wrangler secret put TENANT
#   wrangler secret put SI_TOKEN
#   wrangler secret put RUNNER_TOKEN
#   wrangler secret put HMAC_SECRET
#
# [vars]
# REJECT_INVALID_HMAC = "true"   # the default; "false" turns the gate off
# LEASE_MS = "300000"
