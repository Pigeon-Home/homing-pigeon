<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <title>Security tokens in the tree, 15 October to 8 November 2026</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">Security tokens in the tree</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">15 October to 8 November 2026</text>
  <!-- the grid and the two axes -->
  <path d="M 80 374 L 854 374" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="378.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 320 L 854 320" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="324.5" text-anchor="end" fill="#d9a9b1" font-size="13">5M</text>
  <path d="M 80 266 L 854 266" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="270.5" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 212 L 854 212" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="216.5" text-anchor="end" fill="#d9a9b1" font-size="13">15M</text>
  <path d="M 80 158 L 854 158" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="162.5" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 104 L 854 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">25M</text>
  <path d="M 80 374 L 80 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 241.2 374 L 241.2 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="241.2" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 20</text>
  <path d="M 402.5 374 L 402.5 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="402.5" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 25</text>
  <path d="M 563.8 374 L 563.8 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="563.8" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 30</text>
  <path d="M 725 374 L 725 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="725" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 4</text>
  <path d="M 854 374 L 854 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="854" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 8</text>
  <!-- the series: implied from the line count, then measured -->
  <path d="M 80 367.5 L 241.2 350.2 L 402.5 312.4 L 563.8 255.2 L 725 190.4" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 725 190.4 L 854 155.8" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80" cy="367.5" r="5" fill="#21050b" stroke="#3987e5" stroke-width="2.5"/>
  <circle cx="241.2" cy="350.2" r="5" fill="#21050b" stroke="#3987e5" stroke-width="2.5"/>
  <circle cx="402.5" cy="312.4" r="5" fill="#21050b" stroke="#3987e5" stroke-width="2.5"/>
  <circle cx="563.8" cy="255.2" r="5" fill="#21050b" stroke="#3987e5" stroke-width="2.5"/>
  <circle cx="725" cy="190.4" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="854" cy="155.8" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <text x="86" y="340.5" fill="#ffffff" font-size="15" font-weight="bold">0.6M</text>
  <text x="850" y="139.8" text-anchor="end" fill="#ffffff" font-size="15" font-weight="bold">20.2M</text>
  <!-- the key -->
  <circle cx="58" cy="439.5" r="5" fill="#21050b" stroke="#3987e5" stroke-width="2.5"/>
  <text x="74" y="444" fill="#ffd7de" font-size="13.5">implied from the line count</text>
  <circle cx="267.6" cy="439.5" r="6" fill="#3987e5"/>
  <text x="283.6" y="444" fill="#ffd7de" font-size="13.5">measured</text>
</svg>
