<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>What the security-token count is made of, 15 October to 16 November 2026: one fuzz run log and everything else</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">What the count is made of</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">Security tokens in the tree, 15 October to 16 November 2026, split in two</text>
  <!-- the grid and the two axes -->
  <path d="M 80 424 L 704 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 370.7 L 704 370.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="375.2" text-anchor="end" fill="#d9a9b1" font-size="13">5M</text>
  <path d="M 80 317.3 L 704 317.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="321.8" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 264 L 704 264" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="268.5" text-anchor="end" fill="#d9a9b1" font-size="13">15M</text>
  <path d="M 80 210.7 L 704 210.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="215.2" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 157.3 L 704 157.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="161.8" text-anchor="end" fill="#d9a9b1" font-size="13">25M</text>
  <path d="M 80 104 L 704 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 424 L 80 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 411.5 424 L 411.5 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="411.5" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 1</text>
  <path d="M 684.5 424 L 684.5 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="684.5" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 15</text>
  <!-- everything else: the lower band -->
  <path d="M 80 424 L 80 419.2 L 177.5 406.8 L 275 364.8 L 294.5 361.7 L 372.5 337.7 L 470 297 L 548 289.2 L 645.5 269.8 L 684.5 272.4 L 704 268.8 L 704 424 Z" fill="#3987e5" fill-opacity="0.42"/>
  <!-- the fuzz run log: the upper band, stacked on the lower one -->
  <path d="M 80 419.2 L 177.5 406.8 L 275 364.8 L 294.5 361.7 L 372.5 313.8 L 470 232.5 L 548 208 L 645.5 157.3 L 684.5 141.9 L 704 138.2 L 704 268.8 L 684.5 272.4 L 645.5 269.8 L 548 289.2 L 470 297 L 372.5 337.7 L 294.5 361.7 L 275 364.8 L 177.5 406.8 L 80 419.2 Z" fill="#c98500" fill-opacity="0.5"/>
  <path d="M 80 419.2 L 177.5 406.8 L 275 364.8 L 294.5 361.7 L 372.5 337.7 L 470 297 L 548 289.2 L 645.5 269.8 L 684.5 272.4 L 704 268.8" fill="none" stroke="#21050b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 80 419.2 L 177.5 406.8 L 275 364.8 L 294.5 361.7 L 372.5 337.7 L 470 297 L 548 289.2 L 645.5 269.8 L 684.5 272.4 L 704 268.8" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 294.5 361.7 L 372.5 313.8 L 470 232.5 L 548 208 L 645.5 157.3 L 684.5 141.9 L 704 138.2" fill="none" stroke="#c98500" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 712 138.2 L 712 265.8" fill="none" stroke="#c98500" stroke-width="1"/>
  <path d="M 712 271.8 L 712 424" fill="none" stroke="#3987e5" stroke-width="1"/>
  <text x="720" y="197.5" fill="#ffffff" font-size="17" font-weight="bold">12.2M</text>
  <text x="720" y="215.5" fill="#ffd7de" font-size="13">one fuzz run log</text>
  <text x="720" y="232.5" fill="#ffd7de" font-size="13">46% of the count</text>
  <text x="720" y="340.4" fill="#ffffff" font-size="17" font-weight="bold">14.6M</text>
  <text x="720" y="358.4" fill="#ffd7de" font-size="13">everything else: code,</text>
  <text x="720" y="375.4" fill="#ffd7de" font-size="13">tests, docs, records</text>
  <text x="696" y="124.2" text-anchor="end" fill="#ffffff" font-size="15" font-weight="bold">26.8M in all</text>
  <rect x="50" y="483.5" width="16" height="12" rx="3" fill="#c98500"/>
  <text x="74" y="494" fill="#ffd7de" font-size="13.5">the fuzz run log (one file)</text>
  <rect x="256.6" y="483.5" width="16" height="12" rx="3" fill="#3987e5"/>
  <text x="280.6" y="494" fill="#ffd7de" font-size="13.5">everything else in the tree</text>
</svg>
