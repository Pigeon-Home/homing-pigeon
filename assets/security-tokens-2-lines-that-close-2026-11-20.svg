  <path d="M 663.5 236.2 L 663.5 233.1" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="669.5" y="227.1" font-weight="bold" fill="#ffffff" font-size="12.5">0.29M</text>
