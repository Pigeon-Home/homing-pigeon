<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>2 lines that close: a ceiling for the fuzz run log at 21.0 million closing onto the line of everything else at 17.9 million by at least 0.39 of the gap a week, the gap of 3,056,466 between them closing to 0 by week 30 at the latest, and the whole tree at 35.9 million where the 2 lines meet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">2 lines that close</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">The gap between the 2 lines, week by week, from the count of 24 November 2026</text>
  <!-- the side that is not counted -->
  <rect x="404.2" y="104" width="299.8" height="320" fill="#ffffff" fill-opacity="0.045"/>
  <!-- the grid and the 2 axes -->
  <path d="M 80 424 L 704 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 370.7 L 704 370.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="375.2" text-anchor="end" fill="#d9a9b1" font-size="13">5M</text>
  <path d="M 80 317.3 L 704 317.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="321.8" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 264 L 704 264" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="268.5" text-anchor="end" fill="#d9a9b1" font-size="13">15M</text>
  <path d="M 80 210.7 L 704 210.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="215.2" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 157.3 L 704 157.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="161.8" text-anchor="end" fill="#d9a9b1" font-size="13">25M</text>
  <path d="M 80 104 L 704 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 424 L 80 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 217.8 424 L 217.8 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="217.8" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 1</text>
  <path d="M 404.2 424 L 404.2 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="404.2" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 24</text>
  <path d="M 460.9 424 L 460.9 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="460.9" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 1</text>
  <path d="M 574.3 424 L 574.3 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="574.3" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 15</text>
  <path d="M 704 424 L 704 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="704" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 31</text>
  <path d="M 404.2 104 L 404.2 424" fill="none" stroke="#d9a9b1" stroke-width="1"/>
  <text x="392.2" y="412" text-anchor="end" fill="#ffd7de" font-size="13.5">counted</text>
  <text x="416.2" y="412" fill="#ffd7de" font-size="13.5">not counted</text>
  <!-- where the run log went with no bend: 27.5M, on an if -->
  <path d="M 404.2 130.2 L 704 130.2" fill="none" stroke="#c98500" stroke-width="1.2" stroke-dasharray="3 6"/>
  <text x="698" y="123.2" text-anchor="end" fill="#d9a9b1" font-size="12">27.5M: the run log's own line, with no bend</text>
  <!-- the yellow line: where everything else ends, 17.9M -->
  <path d="M 80 232.6 L 704 232.6" fill="none" stroke="#ffe14a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- the red line: 21M as drawn, then closing on the yellow line -->
