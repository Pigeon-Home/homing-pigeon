  <text x="369.6" y="194" font-weight="bold" fill="#ffffff" font-size="12.5">3.39M</text>
  <path d="M 420.4 236.2 L 420.4 214.1" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="426.4" y="208.1" font-weight="bold" fill="#ffffff" font-size="12.5">2.07M</text>
