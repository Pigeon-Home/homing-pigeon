  <path d="M 379.8 236.2 L 379.8 200" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="385.8" y="194" font-weight="bold" fill="#ffffff" font-size="12.5">3.39M</text>
  <path d="M 436.6 236.2 L 436.6 214.1" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="442.6" y="208.1" font-weight="bold" fill="#ffffff" font-size="12.5">2.07M</text>
  <path d="M 493.3 236.2 L 493.3 222.7" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="499.3" y="216.7" font-weight="bold" fill="#ffffff" font-size="12.5">1.26M</text>
