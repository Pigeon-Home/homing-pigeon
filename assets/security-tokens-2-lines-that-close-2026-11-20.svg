  <text x="68" y="268.5" text-anchor="end" fill="#d9a9b1" font-size="13">15M</text>
  <path d="M 80 210.7 L 704 210.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="215.2" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 157.3 L 704 157.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="161.8" text-anchor="end" fill="#d9a9b1" font-size="13">25M</text>
  <path d="M 80 104 L 704 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 424 L 80 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 217.8 424 L 217.8 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="217.8" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 1</text>
  <path d="M 379.8 424 L 379.8 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="379.8" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 21</text>
  <path d="M 460.9 424 L 460.9 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="460.9" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 1</text>
  <path d="M 574.3 424 L 574.3 430" fill="none" stroke="#6a2130" stroke-width="1"/>
