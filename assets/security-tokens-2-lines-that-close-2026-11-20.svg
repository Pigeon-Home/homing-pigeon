  <path d="M 169.1 424 L 177.2 420 L 185.4 416.6 L 193.5 409.5 L 201.6 389.1 L 209.7 375.4 L 217.8 365.8 L 225.9 363.3 L 234 361.5 L 242.1 359.6 L 250.2 359.6 L 258.3 359.6 L 266.4 359.6 L 274.5 342.7 L 282.6 342.7 L 290.7 342.7 L 298.8 342.7 L 306.9 311.4 L 315 297.2 L 323.1 293.4 L 331.2 293.4 L 339.3 293.4 L 347.4 261.2 L 355.5 254.3 L 363.6 249.9" fill="none" stroke="#c98500" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="363.6" cy="264.5" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="363.6" cy="249.9" r="6.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <text x="90" y="191" font-weight="bold" fill="#ffffff" font-size="14">21.0M: the run log's ceiling</text>
  <text x="90" y="227.2" font-weight="bold" fill="#ffffff" font-size="14">17.6M: everything else's floor</text>
  <text x="718" y="122" font-weight="bold" fill="#ffffff" font-size="17">3.39M</text>
  <text x="718" y="139" fill="#ffd7de" font-size="13">the gap on 19 November</text>
  <text x="718" y="178" font-weight="bold" fill="#ffffff" font-size="17">0</text>
  <text x="718" y="195" fill="#ffd7de" font-size="13">the gap in 30 weeks,</text>
  <text x="718" y="211" fill="#ffd7de" font-size="13">exactly, in whole tokens</text>
  <text x="718" y="250" font-weight="bold" fill="#ffffff" font-size="17">17.6M</text>
  <text x="718" y="267" fill="#ffd7de" font-size="13">where the 2 lines meet.</text>
  <text x="718" y="283" fill="#ffd7de" font-size="13">a result, not a target</text>
  <text x="718" y="322" font-weight="bold" fill="#ffffff" font-size="17">35.2M</text>
  <text x="718" y="339" fill="#ffd7de" font-size="13">the whole tree then.</text>
  <text x="718" y="355" fill="#ffd7de" font-size="13">The 2 lines of today</text>
  <text x="718" y="371" fill="#ffd7de" font-size="13">add to 38.6M.</text>
  <path d="M 50 489.5 L 78 489.5" fill="none" stroke="#d0202c" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="494" fill="#ffd7de" font-size="13.5">the ceiling: it closes by 0.61 a week</text>
  <path d="M 376.7 489.5 L 404.7 489.5" fill="none" stroke="#ffe14a" stroke-width="3" stroke-linecap="round"/>
  <text x="414.7" y="494" fill="#ffd7de" font-size="13.5">the floor</text>
  <path d="M 504.6 489.5 L 532.6 489.5" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linecap="round"/>
  <text x="542.6" y="494" fill="#ffd7de" font-size="13.5">the gap</text>
  <path d="M 618.3 489.5 L 646.3 489.5" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="656.3" y="494" fill="#ffd7de" font-size="13.5">the run log, bent down</text>
