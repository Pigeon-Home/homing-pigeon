  <text x="653.3" y="227.1" font-weight="bold" fill="#ffffff" font-size="12.5">0.29M</text>
  <path d="M 704 236.2 L 704 234.3" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="696" y="256.2" text-anchor="end" font-weight="bold" fill="#ffffff" font-size="12.5">0.17M</text>
  <!-- the run log: counted, then at most the ceiling -->
  <path d="M 363.6 249.9 L 371.7 241.1 L 379.8 232.9 L 387.9 225.3 L 396.1 218.2 L 404.2 211.6 L 412.3 212.5 L 420.4 214.1 L 428.5 215.6 L 436.6 217 L 444.7 218.3 L 452.8 219.5 L 460.9 220.7 L 469 221.7 L 477.1 222.7 L 485.2 223.6 L 493.3 224.5 L 501.4 225.3 L 509.5 226 L 517.6 226.7 L 525.7 227.4 L 533.8 228 L 541.9 228.5 L 550 229.1 L 558.1 229.5 L 566.2 230 L 574.3 230.4 L 582.4 230.8 L 590.5 231.2 L 598.6 231.5 L 606.8 231.8 L 614.9 232.1 L 623 232.4 L 631.1 232.7 L 639.2 232.9 L 647.3 233.1 L 655.4 233.3 L 663.5 233.5 L 671.6 233.7 L 679.7 233.9 L 687.8 234 L 695.9 234.2 L 704 234.3" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- everything else: counted, then its own rule -->
  <path d="M 363.6 264.5 L 371.7 262.6 L 379.8 260.8 L 387.9 259.1 L 396.1 257.5 L 404.2 256.1 L 412.3 254.7 L 420.4 253.5 L 428.5 252.3 L 436.6 251.2 L 444.7 250.2 L 452.8 249.2 L 460.9 248.3 L 469 247.5 L 477.1 246.7 L 485.2 246 L 493.3 245.3 L 501.4 244.7 L 509.5 244.1 L 517.6 243.6 L 525.7 243.1 L 533.8 242.6 L 541.9 242.2 L 550 241.8 L 558.1 241.4 L 566.2 241 L 574.3 240.7 L 582.4 240.4 L 590.5 240.1 L 598.6 239.8 L 606.8 239.6 L 614.9 239.4 L 623 239.1 L 631.1 238.9 L 639.2 238.8 L 647.3 238.6 L 655.4 238.4 L 663.5 238.3 L 671.6 238.1 L 679.7 238 L 687.8 237.9 L 695.9 237.8 L 704 237.7" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="420.4" cy="253.5" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="477.1" cy="246.7" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="533.8" cy="242.6" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="590.5" cy="240.1" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="647.3" cy="238.6" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="704" cy="237.7" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <path d="M 80 419.2 L 88.1 418 L 96.2 415.9 L 104.3 410.1 L 112.4 407.2 L 120.5 406.7 L 128.6 405.4 L 136.7 401.1 L 144.8 394.7 L 152.9 387 L 161 363.4 L 169.1 354.2 L 177.2 345.8 L 185.4 343.8 L 193.5 339.3 L 201.6 336.7 L 209.7 317.8 L 217.8 309.1 L 225.9 298.6 L 234 297.6 L 242.1 298.2 L 250.2 296.8 L 258.3 291.9 L 266.4 291.2 L 274.5 288.6 L 282.6 287.8 L 290.7 285.9 L 298.8 280 L 306.9 269.4 L 315 275.8 L 323.1 272.7 L 331.2 269.1 L 339.3 268.6 L 347.4 268 L 355.5 265.5 L 363.6 264.5" fill="none" stroke="#21050b" stroke-width="5" stroke-linejoin="round"/>
