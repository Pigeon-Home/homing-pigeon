  <path d="M 379.8 245.4 L 387.9 237.8 L 396.1 230.7 L 404.2 224.1 L 412.3 217.9 L 420.4 212.1 L 428.5 212.5 L 436.6 214.1 L 444.7 215.6 L 452.8 217 L 460.9 218.3 L 469 219.5 L 477.1 220.7 L 485.2 221.7 L 493.3 222.7 L 501.4 223.6 L 509.5 224.5 L 517.6 225.3 L 525.7 226 L 533.8 226.7 L 541.9 227.4 L 550 228 L 558.1 228.5 L 566.2 229.1 L 574.3 229.5 L 582.4 230 L 590.5 230.4 L 598.6 230.8 L 606.8 231.2 L 614.9 231.5 L 623 231.8 L 631.1 232.1 L 639.2 232.4 L 647.3 232.7 L 655.4 232.9 L 663.5 233.1 L 671.6 233.3 L 679.7 233.5 L 687.8 233.7 L 695.9 233.9 L 704 234" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- everything else: counted, then its own rule -->
  <path d="M 379.8 260.5 L 387.9 258.8 L 396.1 257.2 L 404.2 255.8 L 412.3 254.4 L 420.4 253.2 L 428.5 252 L 436.6 250.9 L 444.7 249.9 L 452.8 248.9 L 460.9 248 L 469 247.2 L 477.1 246.4 L 485.2 245.7 L 493.3 245 L 501.4 244.4 L 509.5 243.8 L 517.6 243.3 L 525.7 242.8 L 533.8 242.3 L 541.9 241.9 L 550 241.5 L 558.1 241.1 L 566.2 240.7 L 574.3 240.4 L 582.4 240.1 L 590.5 239.8 L 598.6 239.6 L 606.8 239.3 L 614.9 239.1 L 623 238.9 L 631.1 238.7 L 639.2 238.5 L 647.3 238.3 L 655.4 238.1 L 663.5 238 L 671.6 237.8 L 679.7 237.7 L 687.8 237.6 L 695.9 237.5 L 704 237.4" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="436.6" cy="250.9" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="493.3" cy="245" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="550" cy="241.5" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="606.8" cy="239.3" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="663.5" cy="238" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <path d="M 80 419.2 L 88.1 418 L 96.2 415.9 L 104.3 410.1 L 112.4 407.2 L 120.5 406.7 L 128.6 405.4 L 136.7 401.1 L 144.8 394.7 L 152.9 387 L 161 363.4 L 169.1 354.2 L 177.2 345.8 L 185.4 343.8 L 193.5 339.3 L 201.6 336.7 L 209.7 317.8 L 217.8 309.1 L 225.9 298.6 L 234 297.6 L 242.1 298.2 L 250.2 296.8 L 258.3 291.9 L 266.4 291.2 L 274.5 288.6 L 282.6 287.8 L 290.7 285.9 L 298.8 280 L 306.9 269.4 L 315 275.8 L 323.1 272.7 L 331.2 269.1 L 339.3 268.6 L 347.4 268 L 355.5 265.5 L 363.6 264.5 L 371.7 260.5 L 379.8 260.5" fill="none" stroke="#21050b" stroke-width="5" stroke-linejoin="round"/>
