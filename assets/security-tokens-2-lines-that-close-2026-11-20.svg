  <path d="M 404.2 232.6 L 404.2 200" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="410.2" y="194" font-weight="bold" fill="#ffffff" font-size="12.5">3.06M</text>
  <path d="M 460.9 232.6 L 460.9 212.7" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="466.9" y="206.7" font-weight="bold" fill="#ffffff" font-size="12.5">1.86M</text>
  <path d="M 517.6 232.6 L 517.6 220.5" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="523.6" y="214.5" font-weight="bold" fill="#ffffff" font-size="12.5">1.14M</text>
  <path d="M 574.3 232.6 L 574.3 225.2" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="580.3" y="219.2" font-weight="bold" fill="#ffffff" font-size="12.5">0.69M</text>
  <path d="M 631.1 232.6 L 631.1 228.1" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="637.1" y="222.1" font-weight="bold" fill="#ffffff" font-size="12.5">0.42M</text>
  <path d="M 687.8 232.6 L 687.8 229.8" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="693.8" y="223.8" font-weight="bold" fill="#ffffff" font-size="12.5">0.26M</text>
  <text x="700" y="254" text-anchor="end" fill="#ffd7de" font-size="12.5">on the slowest closing the rule allows:</text>
  <text x="700" y="270" text-anchor="end" fill="#ffd7de" font-size="12.5">gap 1 at week 29, 0 at week 30</text>
  <text x="700" y="286" text-anchor="end" fill="#ffd7de" font-size="12.5">a faster closing reaches 0 sooner</text>
  <!-- the run log: counted, then at most the ceiling -->
  <path d="M 404.2 220.8 L 412.3 214.6 L 420.4 208.8 L 428.5 206.2 L 436.6 208 L 444.7 209.7 L 452.8 211.3 L 460.9 212.7 L 469 214.1 L 477.1 215.3 L 485.2 216.5 L 493.3 217.6 L 501.4 218.6 L 509.5 219.6 L 517.6 220.5 L 525.7 221.3 L 533.8 222.1 L 541.9 222.8 L 550 223.5 L 558.1 224.1 L 566.2 224.7 L 574.3 225.2 L 582.4 225.7 L 590.5 226.2 L 598.6 226.6 L 606.8 227 L 614.9 227.4 L 623 227.8 L 631.1 228.1 L 639.2 228.4 L 647.3 228.7 L 655.4 229 L 663.5 229.2 L 671.6 229.4 L 679.7 229.6 L 687.8 229.8 L 695.9 230 L 704 230.2" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- everything else: counted, then its own rule -->
  <path d="M 404.2 252.5 L 412.3 251.1 L 420.4 249.9 L 428.5 248.7 L 436.6 247.6 L 444.7 246.6 L 452.8 245.6 L 460.9 244.7 L 469 243.9 L 477.1 243.1 L 485.2 242.4 L 493.3 241.7 L 501.4 241.1 L 509.5 240.5 L 517.6 240 L 525.7 239.5 L 533.8 239 L 541.9 238.6 L 550 238.2 L 558.1 237.8 L 566.2 237.4 L 574.3 237.1 L 582.4 236.8 L 590.5 236.5 L 598.6 236.3 L 606.8 236 L 614.9 235.8 L 623 235.6 L 631.1 235.4 L 639.2 235.2 L 647.3 235 L 655.4 234.8 L 663.5 234.7 L 671.6 234.5 L 679.7 234.4 L 687.8 234.3 L 695.9 234.2 L 704 234.1" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="460.9" cy="244.7" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="517.6" cy="240" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="574.3" cy="237.1" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="631.1" cy="235.4" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="687.8" cy="234.3" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <path d="M 80 419.2 L 88.1 418 L 96.2 415.9 L 104.3 410.1 L 112.4 407.2 L 120.5 406.7 L 128.6 405.4 L 136.7 401.1 L 144.8 394.7 L 152.9 387 L 161 363.4 L 169.1 354.2 L 177.2 345.8 L 185.4 343.8 L 193.5 339.3 L 201.6 336.7 L 209.7 317.8 L 217.8 309.1 L 225.9 298.6 L 234 297.6 L 242.1 298.2 L 250.2 296.8 L 258.3 291.9 L 266.4 291.2 L 274.5 288.6 L 282.6 287.8 L 290.7 285.9 L 298.8 280 L 306.9 269.4 L 315 275.8 L 323.1 272.7 L 331.2 269.1 L 339.3 268.6 L 347.4 268 L 355.5 265.5 L 363.6 264.5 L 371.7 260.5 L 379.8 259.3 L 387.9 259.1 L 396.1 255.5 L 404.2 252.5" fill="none" stroke="#21050b" stroke-width="5" stroke-linejoin="round"/>
