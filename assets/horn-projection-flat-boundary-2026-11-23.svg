<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1240" height="560" fill="#101418"/>
  <text x="620" y="42" text-anchor="middle" font-size="25" fill="#e8e2d4">One relation, two sizes: the Horn chain and its flat boundary</text>
  <text x="620" y="70" text-anchor="middle" font-size="15" fill="#9fb4c0">Visible pairs a_i, b_i and output z. Internal bits t_i and r_i carry the work.</text>

  <!-- left panel -->
  <rect x="30" y="95" width="580" height="420" fill="none" stroke="#3d4a54" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-size="19" fill="#e8e2d4">With the internal bits kept: 3m + 1 Horn clauses</text>
  <text x="320" y="152" text-anchor="middle" font-size="14" fill="#9fb4c0">each clause of width at most 3, at most 1 positive literal</text>

  <!-- pairs to t -->
  <g font-size="15" fill="#e8e2d4">
    <text x="70" y="205">a_1, b_1</text>
    <text x="70" y="265">a_2, b_2</text>
    <text x="70" y="325">a_3, b_3</text>
    <text x="70" y="385">a_m, b_m</text>
  </g>
  <g stroke="#d9a441" stroke-width="2" fill="none">
    <line x1="140" y1="198" x2="215" y2="198"/>
    <line x1="140" y1="258" x2="215" y2="258"/>
    <line x1="140" y1="318" x2="215" y2="318"/>
    <line x1="140" y1="378" x2="215" y2="378"/>
  </g>
  <g font-size="15" fill="#d9a441">
    <text x="222" y="203">t_1</text>
    <text x="222" y="263">t_2</text>
    <text x="222" y="323">t_3</text>
    <text x="222" y="383">t_m</text>
  </g>
  <text x="150" y="180" font-size="13" fill="#9fb4c0">a_i or b_i forces t_i</text>

  <!-- t to r chain: t_1 alone forces r_1; each later r_i is forced jointly by
       r_(i-1) and t_i, meeting at the AND junction dots, arrows into each r_i -->
  <g stroke="#4fb3a9" stroke-width="2" fill="none">
    <line x1="255" y1="198" x2="326" y2="198"/>
    <line x1="255" y1="258" x2="326" y2="258"/>
    <line x1="255" y1="318" x2="326" y2="318"/>
    <line x1="255" y1="378" x2="326" y2="378"/>
    <polyline points="385,210 385,234 300,234 300,254"/>
    <polyline points="385,270 385,294 300,294 300,314"/>
    <polyline points="385,330 385,354 300,354 300,374"/>
  </g>
  <g fill="#4fb3a9">
    <circle cx="300" cy="258" r="4.5"/>
    <circle cx="300" cy="318" r="4.5"/>
    <circle cx="300" cy="378" r="4.5"/>
    <polygon points="326,193 337,198 326,203"/>
    <polygon points="326,253 337,258 326,263"/>
    <polygon points="326,313 337,318 326,323"/>
    <polygon points="326,373 337,378 326,383"/>
  </g>
  <g font-size="15" fill="#4fb3a9">
    <text x="338" y="203">r_1</text>
    <text x="338" y="263">r_2</text>
    <text x="338" y="323">r_3</text>
    <text x="338" y="383">r_m</text>
  </g>
  <text x="300" y="180" font-size="13" fill="#9fb4c0">r_(i-1) and t_i together force r_i</text>
  <text x="292" y="224" text-anchor="middle" font-size="12" fill="#9fb4c0">t_1 forces r_1</text>

  <!-- r_m to z -->
  <line x1="375" y1="378" x2="461" y2="378" stroke="#e8e2d4" stroke-width="2"/>
  <polygon points="461,373 472,378 461,383" fill="#e8e2d4"/>
  <text x="478" y="383" font-size="16" fill="#e8e2d4">z</text>
  <text x="420" y="360" font-size="13" fill="#9fb4c0">r_m forces z</text>

  <text x="320" y="455" text-anchor="middle" font-size="14" fill="#9fb4c0">Unit propagation walks the chain once.</text>
  <text x="320" y="478" text-anchor="middle" font-size="14" fill="#9fb4c0">Satisfiability stays linear (Dowling and Gallier, 1984).</text>
  <text x="320" y="501" text-anchor="middle" font-size="14" fill="#9fb4c0">In the least completion, r_i equals r_(i-1) and t_i together.</text>

  <!-- right panel -->
  <rect x="630" y="95" width="580" height="420" fill="none" stroke="#3d4a54" stroke-width="1.5"/>
  <text x="920" y="128" text-anchor="middle" font-size="19" fill="#e8e2d4">With the internal bits forgotten: at least 2^m clauses</text>
  <text x="920" y="152" text-anchor="middle" font-size="14" fill="#9fb4c0">flat CNF over the visible variables only, m = 1 to 5</text>

  <!-- bars: heights for 2,4,8,16,32 scaled: 32 -> 240px -->
  <g fill="#d95f4b">
    <rect x="690" y="455" width="52" height="15"/>
    <rect x="790" y="440" width="52" height="30"/>
    <rect x="890" y="410" width="52" height="60"/>
    <rect x="990" y="350" width="52" height="120"/>
    <rect x="1090" y="230" width="52" height="240"/>
  </g>
  <g font-size="14" fill="#e8e2d4" text-anchor="middle">
    <text x="716" y="445">2</text>
    <text x="816" y="430">4</text>
    <text x="916" y="400">8</text>
    <text x="1016" y="340">16</text>
    <text x="1116" y="220">32</text>
    <text x="716" y="490">m = 1</text>
    <text x="816" y="490">m = 2</text>
    <text x="916" y="490">m = 3</text>
    <text x="1016" y="490">m = 4</text>
    <text x="1116" y="490">m = 5</text>
  </g>
  <line x1="670" y1="470" x2="1170" y2="470" stroke="#3d4a54" stroke-width="1.5"/>
  <text x="920" y="192" text-anchor="middle" font-size="14" fill="#9fb4c0">Each of the 2^m minimal patterns has z false and</text>
  <text x="920" y="214" text-anchor="middle" font-size="14" fill="#9fb4c0">exactly 1 true bit per pair.</text>
  <text x="905" y="242" text-anchor="middle" font-size="13" fill="#9fb4c0">Each minimal pattern falsifies exactly one canonical clause.</text>
</svg>
