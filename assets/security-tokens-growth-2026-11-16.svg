<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>Security tokens in the tree, 15 October to 15 December 2026: measured to 15 November, then projected</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">Security tokens in the tree</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">Counted to 15 November 2026, then two models carried to 15 December</text>
  <!-- the modelled side: everything right of the last count -->
  <rect x="420.5" y="104" width="329.5" height="320" fill="#ffffff" fill-opacity="0.045"/>
  <!-- the grid and the two axes -->
  <path d="M 80 424 L 750 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 370.7 L 750 370.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="375.2" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 317.3 L 750 317.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="321.8" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 264 L 750 264" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="268.5" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 210.7 L 750 210.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="215.2" text-anchor="end" fill="#d9a9b1" font-size="13">40M</text>
  <path d="M 80 157.3 L 750 157.3" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="161.8" text-anchor="end" fill="#d9a9b1" font-size="13">50M</text>
  <path d="M 80 104 L 750 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">60M</text>
  <path d="M 80 424 L 80 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 266.7 424 L 266.7 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="266.7" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 1</text>
  <path d="M 420.5 424 L 420.5 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="420.5" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 15</text>
  <path d="M 596.2 424 L 596.2 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="596.2" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 1</text>
  <path d="M 750 424 L 750 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="750" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 15</text>
  <path d="M 420.5 104 L 420.5 424" fill="none" stroke="#d9a9b1" stroke-width="1"/>
  <text x="408.5" y="126" text-anchor="end" fill="#ffd7de" font-size="13.5">counted</text>
  <text x="432.5" y="126" fill="#ffd7de" font-size="13.5">modelled, not counted</text>
  <!-- the ceiling the curve bends toward -->
  <path d="M 80 221.3 L 750 221.3" fill="none" stroke="#ffd7de" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="90" y="210.3" fill="#ffd7de" font-size="14" font-weight="bold">Ceiling, 38M: approached, never crossed</text>
  <!-- the straight trend: the endpoints' slope, carried on -->
  <path d="M 80 421.6 L 750 148.7" fill="none" stroke="#f04866" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- the asymptotic curve: from the last count toward the ceiling -->
  <path d="M 420.5 282.9 L 426 281.3 L 431.5 279.6 L 437 278.1 L 442.5 276.5 L 448 275 L 453.4 273.6 L 458.9 272.1 L 464.4 270.8 L 469.9 269.4 L 475.4 268.1 L 480.9 266.8 L 486.4 265.6 L 491.9 264.4 L 497.4 263.2 L 502.9 262.1 L 508.4 261 L 513.9 259.9 L 519.3 258.9 L 524.8 257.9 L 530.3 256.9 L 535.8 255.9 L 541.3 255 L 546.8 254.1 L 552.3 253.2 L 557.8 252.3 L 563.3 251.5 L 568.8 250.6 L 574.3 249.9 L 579.8 249.1 L 585.2 248.3 L 590.7 247.6 L 596.2 246.9 L 601.7 246.2 L 607.2 245.5 L 612.7 244.9 L 618.2 244.2 L 623.7 243.6 L 629.2 243 L 634.7 242.4 L 640.2 241.8 L 645.7 241.3 L 651.1 240.7 L 656.6 240.2 L 662.1 239.7 L 667.6 239.2 L 673.1 238.7 L 678.6 238.2 L 684.1 237.8 L 689.6 237.3 L 695.1 236.9 L 700.6 236.5 L 706.1 236.1 L 711.6 235.7 L 717 235.3 L 722.5 234.9 L 728 234.5 L 733.5 234.2 L 739 233.8 L 744.5 233.5 L 750 233.2" fill="none" stroke="#12a594" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="750" cy="148.7" r="4.5" fill="#f04866" stroke="#21050b" stroke-width="2"/>
  <circle cx="750" cy="233.2" r="4.5" fill="#12a594" stroke="#21050b" stroke-width="2"/>
  <!-- the series: every point a count, every circle closed -->
  <path d="M 80 421.6 L 134.9 415.4 L 189.8 394.4 L 244.8 368.9 L 299.7 328.3 L 343.6 316 L 398.5 290.6 L 420.5 282.9" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80" cy="421.6" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="134.9" cy="415.4" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="189.8" cy="394.4" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="244.8" cy="368.9" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="299.7" cy="328.3" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="343.6" cy="316" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="398.5" cy="290.6" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="420.5" cy="282.9" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <text x="86" y="394.6" fill="#ffffff" font-size="15" font-weight="bold">0.4M</text>
  <text x="408.5" y="268.9" text-anchor="end" fill="#ffffff" font-size="15" font-weight="bold">26.5M</text>
  <text x="764" y="149.7" fill="#ffffff" font-size="17" font-weight="bold">51.6M</text>
  <text x="764" y="167.7" fill="#ffd7de" font-size="13">straight trend</text>
  <text x="764" y="255.2" fill="#ffffff" font-size="17" font-weight="bold">35.8M</text>
  <text x="764" y="273.2" fill="#ffd7de" font-size="13">asymptotic curve</text>
  <!-- the key -->
  <circle cx="58" cy="489.5" r="6" fill="#3987e5"/>
  <text x="74" y="494" fill="#ffd7de" font-size="13.5">counted</text>
  <path d="M 150 489.5 L 178 489.5" fill="none" stroke="#f04866" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="188" y="494" fill="#ffd7de" font-size="13.5">straight trend</text>
  <path d="M 294.8 489.5 L 322.8 489.5" fill="none" stroke="#12a594" stroke-width="3" stroke-linecap="round"/>
  <text x="332.8" y="494" fill="#ffd7de" font-size="13.5">asymptotic curve</text>
  <path d="M 462.1 489.5 L 490.1 489.5" fill="none" stroke="#ffd7de" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="500.1" y="494" fill="#ffd7de" font-size="13.5">ceiling</text>
</svg>
