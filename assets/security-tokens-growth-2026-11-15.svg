<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <title>Security tokens in the tree, 15 October to 15 November 2026</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">Security tokens in the tree</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">15 October to 15 November 2026</text>
  <!-- the grid and the two axes -->
  <path d="M 80 374 L 854 374" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="378.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 329 L 854 329" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="333.5" text-anchor="end" fill="#d9a9b1" font-size="13">5M</text>
  <path d="M 80 284 L 854 284" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="288.5" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 239 L 854 239" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="243.5" text-anchor="end" fill="#d9a9b1" font-size="13">15M</text>
  <path d="M 80 194 L 854 194" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="198.5" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 149 L 854 149" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="153.5" text-anchor="end" fill="#d9a9b1" font-size="13">25M</text>
  <path d="M 80 104 L 854 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 374 L 80 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 204.8 374 L 204.8 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="204.8" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 20</text>
  <path d="M 329.7 374 L 329.7 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="329.7" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 25</text>
  <path d="M 454.5 374 L 454.5 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="454.5" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 30</text>
  <path d="M 579.4 374 L 579.4 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="579.4" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 4</text>
  <path d="M 679.2 374 L 679.2 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="679.2" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 8</text>
  <path d="M 804.1 374 L 804.1 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <path d="M 854 374 L 854 380" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="854" y="398" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 15</text>
  <!-- the series: every point a count, every circle closed -->
  <path d="M 80 370 L 204.8 359.5 L 329.7 324.1 L 454.5 281 L 579.4 212.5 L 679.2 191.7 L 804.1 149 L 854 135.9" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80" cy="370" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="204.8" cy="359.5" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="329.7" cy="324.1" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="454.5" cy="281" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="579.4" cy="212.5" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="679.2" cy="191.7" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="804.1" cy="149" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="854" cy="135.9" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <text x="86" y="343" fill="#ffffff" font-size="15" font-weight="bold">0.4M</text>
  <text x="850" y="119.9" text-anchor="end" fill="#ffffff" font-size="15" font-weight="bold">26.5M</text>
  <!-- the key -->
  <circle cx="58" cy="439.5" r="6" fill="#3987e5"/>
  <text x="74" y="444" fill="#ffd7de" font-size="13.5">counted from the tree at each release</text>
</svg>
