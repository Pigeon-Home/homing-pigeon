<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" fill="#1a1a1a" font-size="17" font-weight="bold">Security tokens in the tree — 15 October to 15 November 2026</text>

  <!-- gridlines and y-axis labels (millions of tokens) -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="64" y1="372" x2="696" y2="372"/>
    <line x1="64" y1="321.1" x2="696" y2="321.1"/>
    <line x1="64" y1="270.2" x2="696" y2="270.2"/>
    <line x1="64" y1="219.3" x2="696" y2="219.3"/>
    <line x1="64" y1="168.3" x2="696" y2="168.3"/>
    <line x1="64" y1="117.4" x2="696" y2="117.4"/>
    <line x1="64" y1="66.5" x2="696" y2="66.5"/>
  </g>
  <g fill="#555555" font-size="12" text-anchor="end">
    <text x="58" y="376">0</text>
    <text x="58" y="325.1">5M</text>
    <text x="58" y="274.2">10M</text>
    <text x="58" y="223.3">15M</text>
    <text x="58" y="172.3">20M</text>
    <text x="58" y="121.4">25M</text>
    <text x="58" y="70.5">30M</text>
  </g>
  <text x="18" y="210" fill="#555555" font-size="12" text-anchor="middle" transform="rotate(-90 18 210)">security tokens</text>

  <!-- the series: dashed while the points are implied, solid across the measured anchors -->
  <polyline points="64,365.9 154.3,349.6 244.6,314 334.9,260 425.1,198.9" fill="none" stroke="#1f6fd6" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="334.9,260 425.1,198.9 515.4,166.7 605.7,117.4 696,102.6" fill="none" stroke="#1f6fd6" stroke-width="2.5"/>

  <!-- implied points: hollow -->
  <g fill="#ffffff" stroke="#1f6fd6" stroke-width="2.5">
    <circle cx="64" cy="365.9" r="6"/>
    <circle cx="154.3" cy="349.6" r="6"/>
    <circle cx="244.6" cy="314" r="6"/>
    <circle cx="334.9" cy="260" r="6"/>
  </g>
  <!-- measured points: filled -->
  <g fill="#1f6fd6">
    <circle cx="425.1" cy="198.9" r="6.5"/>
    <circle cx="515.4" cy="166.7" r="6.5"/>
    <circle cx="605.7" cy="117.4" r="6.5"/>
    <circle cx="696" cy="102.6" r="6.5"/>
  </g>

  <!-- value labels -->
  <g fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="64" y="349.9">0.6M</text>
    <text x="154.3" y="333.6">2.2M</text>
    <text x="244.6" y="298">5.7M</text>
    <text x="334.9" y="244">11.0M</text>
    <text x="425.1" y="182.9">17M</text>
    <text x="515.4" y="150.7">20.2M</text>
    <text x="605.7" y="101.4">25.0M</text>
    <text x="688" y="86.6">26.5M</text>
  </g>

  <!-- x-axis labels -->
  <g fill="#555555" font-size="12" text-anchor="middle">
    <text x="64" y="394">Oct 15</text>
    <text x="154.3" y="394">Oct 20</text>
    <text x="244.6" y="394">Oct 25</text>
    <text x="334.9" y="394">Oct 30</text>
    <text x="425.1" y="394">Nov 4</text>
    <text x="515.4" y="394">Nov 8</text>
    <text x="605.7" y="394">Nov 13</text>
    <text x="696" y="394">Nov 15</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#1a1a1a">
    <circle cx="180" cy="410" r="5" fill="#ffffff" stroke="#1f6fd6" stroke-width="2"/>
    <text x="192" y="414">implied from the line count</text>
    <circle cx="400" cy="410" r="5.5" fill="#1f6fd6"/>
    <text x="412" y="414">measured</text>
  </g>
</svg>
