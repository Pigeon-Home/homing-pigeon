<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>Security tokens in the tree, 15 October to 31 December 2026: counted to 19 November, then the line a rule draws toward a limit of 38 million and the line this week's pace draws</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">The curve and its limit</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">Security tokens in the tree: counted to 19 November 2026, then 2 ways on from the last count</text>
  <!-- the grid and the axes -->
  <path d="M 80 424.0 L 704 424.0" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 352.9 L 704 352.9" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="357.4" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 281.8 L 704 281.8" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="286.3" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 210.7 L 704 210.7" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="215.2" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 139.6 L 704 139.6" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="144.1" text-anchor="end" fill="#d9a9b1" font-size="13">40M</text>
  <path d="M 80.0 424 L 80.0 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80.0" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 217.8 424 L 217.8 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="217.8" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 1</text>
  <path d="M 363.6 424 L 363.6 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="363.6" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 19</text>
  <path d="M 460.9 424 L 460.9 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="460.9" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 1</text>
  <path d="M 574.3 424 L 574.3 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="574.3" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 15</text>
  <path d="M 704.0 424 L 704.0 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="704.0" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 31</text>
  <!-- the limit: 38 million -->
  <path d="M 80 153.8 L 704 153.8" fill="none" stroke="#ffd7de" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="90" y="144.8" fill="#ffffff" font-size="14" font-weight="bold">The limit: 38 million</text>
  <!-- where the counts end -->
  <path d="M 363.6 424 L 363.6 104.0" fill="none" stroke="#6a2130" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="355.6" y="414.0" text-anchor="end" fill="#d9a9b1" font-size="12">counted</text>
  <text x="371.6" y="414.0" fill="#d9a9b1" font-size="12">not yet counted</text>
  <!-- this week's pace, carried on unchanged -->
  <path d="M 363.6 201.6 L 455.9 104.0" fill="none" stroke="#d9a9b1" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <!-- the rule: each day at most a fixed share of what is left to the limit -->
  <path d="M 363.6 201.6 L 367.7 200.3 L 371.7 199.1 L 375.8 197.8 L 379.8 196.6 L 383.9 195.5 L 387.9 194.3 L 392.0 193.2 L 396.1 192.2 L 400.1 191.1 L 404.2 190.1 L 408.2 189.1 L 412.3 188.2 L 416.3 187.2 L 420.4 186.3 L 424.4 185.4 L 428.5 184.6 L 432.5 183.7 L 436.6 182.9 L 440.6 182.1 L 444.7 181.4 L 448.7 180.6 L 452.8 179.9 L 456.8 179.2 L 460.9 178.5 L 464.9 177.8 L 469.0 177.2 L 473.0 176.5 L 477.1 175.9 L 481.1 175.3 L 485.2 174.7 L 489.2 174.2 L 493.3 173.6 L 497.4 173.1 L 501.4 172.6 L 505.5 172.0 L 509.5 171.6 L 513.6 171.1 L 517.6 170.6 L 521.7 170.1 L 525.7 169.7 L 529.8 169.3 L 533.8 168.8 L 537.9 168.4 L 541.9 168.0 L 546.0 167.7 L 550.0 167.3 L 554.1 166.9 L 558.1 166.6 L 562.2 166.2 L 566.2 165.9 L 570.3 165.5 L 574.3 165.2 L 578.4 164.9 L 582.4 164.6 L 586.5 164.3 L 590.5 164.0 L 594.6 163.8 L 598.6 163.5 L 602.7 163.2 L 606.8 163.0 L 610.8 162.7 L 614.9 162.5 L 618.9 162.2 L 623.0 162.0 L 627.0 161.8 L 631.1 161.6 L 635.1 161.4 L 639.2 161.2 L 643.2 161.0 L 647.3 160.8 L 651.3 160.6 L 655.4 160.4 L 659.4 160.2 L 663.5 160.0 L 667.5 159.9 L 671.6 159.7 L 675.6 159.5 L 679.7 159.4 L 683.7 159.2 L 687.8 159.1 L 691.8 158.9 L 695.9 158.8 L 699.9 158.7 L 704.0 158.5" fill="none" stroke="#c98500" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the counts -->
  <path d="M 80.0 420.8 L 120.5 412.5 L 161.0 384.5 L 201.6 350.5 L 242.1 296.4 L 274.5 280.0 L 315.0 246.2 L 331.2 235.9 L 363.6 201.6" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80.0" cy="420.8" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>15 October: 447,477 tokens, counted</title></circle>
  <circle cx="120.5" cy="412.5" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>20 October: 1,615,732 tokens, counted</title></circle>
  <circle cx="161.0" cy="384.5" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>25 October: 5,548,576 tokens, counted</title></circle>
  <circle cx="201.6" cy="350.5" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>30 October: 10,334,821 tokens, counted</title></circle>
  <circle cx="242.1" cy="296.4" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>4 November: 17,948,976 tokens, counted</title></circle>
  <circle cx="274.5" cy="280.0" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>8 November: 20,251,953 tokens, counted</title></circle>
  <circle cx="315.0" cy="246.2" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>13 November: 25,004,718 tokens, counted</title></circle>
  <circle cx="331.2" cy="235.9" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>15 November: 26,451,259 tokens, counted</title></circle>
  <circle cx="363.6" cy="201.6" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"><title>19 November: 31,273,283 tokens, counted</title></circle>
  <!-- what each way on says -->
  <text x="469.0" y="115.4" fill="#ffffff" font-size="13">At this week's pace:</text>
  <text x="469.0" y="131.4" fill="#ffffff" font-size="13">past the limit by 25 November</text>
  <text x="477.1" y="203.6" fill="#ffffff" font-size="13">With the rule: what is left</text>
  <text x="477.1" y="219.6" fill="#ffffff" font-size="13">halves every 12.6 days,</text>
  <text x="477.1" y="235.6" fill="#ffffff" font-size="13">and the limit is never passed</text>
  <!-- the legend -->
  <path d="M 724 150 L 748 150" stroke="#3987e5" stroke-width="2"/><circle cx="736" cy="150" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <text x="756" y="146" fill="#ffffff" font-size="13">Counted, to</text>
  <text x="756" y="162" fill="#ffffff" font-size="13">19 November</text>
  <path d="M 724 196 L 748 196" stroke="#c98500" stroke-width="2.5"/>
  <text x="756" y="192" fill="#ffffff" font-size="13">The rule: a day adds</text>
  <text x="756" y="208" fill="#ffffff" font-size="13">a share of what is left</text>
  <path d="M 724 242 L 748 242" stroke="#d9a9b1" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="756" y="238" fill="#ffffff" font-size="13">This week's pace,</text>
  <text x="756" y="254" fill="#ffffff" font-size="13">carried on</text>
  <text x="724" y="300" fill="#d9a9b1" font-size="12">Last count:</text>
  <text x="724" y="318" fill="#d9a9b1" font-size="12">31,273,283.</text>
  <text x="724" y="336" fill="#d9a9b1" font-size="12">Left to the limit:</text>
  <text x="724" y="354" fill="#d9a9b1" font-size="12">6,726,717.</text>
  <text x="50" y="488" fill="#d9a9b1" font-size="12">Counts from the statistics record and from main on 19 November 2026. Right of 19 November nothing is counted: 1 line is a rule, 1 is a pace.</text>
</svg>
