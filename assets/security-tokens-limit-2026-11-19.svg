<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>Security tokens in the tree, 15 October to 31 December 2026: counted to 19 November, then the line the rule draws toward a limit of 46.0M and the line the last 4 days' pace draws</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">The curve and its limits</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">Security tokens in the tree: counted to 19 November 2026, then 2 ways on from the last count</text>
  <!-- the side that is not counted -->
  <rect x="363.6" y="104" width="340.4" height="320" fill="#ffffff" fill-opacity="0.045"/>
  <!-- the grid and the 2 axes -->
  <path d="M 80 424 L 704 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 360 L 704 360" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="364.5" text-anchor="end" fill="#d9a9b1" font-size="13">10M</text>
  <path d="M 80 296 L 704 296" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="300.5" text-anchor="end" fill="#d9a9b1" font-size="13">20M</text>
  <path d="M 80 232 L 704 232" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="236.5" text-anchor="end" fill="#d9a9b1" font-size="13">30M</text>
  <path d="M 80 168 L 704 168" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="172.5" text-anchor="end" fill="#d9a9b1" font-size="13">40M</text>
  <path d="M 80 104 L 704 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">50M</text>
  <path d="M 80 424 L 80 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Oct 15</text>
  <path d="M 217.8 424 L 217.8 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="217.8" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 1</text>
  <path d="M 363.6 424 L 363.6 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="363.6" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Nov 19</text>
  <path d="M 460.9 424 L 460.9 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="460.9" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 1</text>
  <path d="M 574.3 424 L 574.3 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="574.3" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 15</text>
  <path d="M 704 424 L 704 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="704" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">Dec 31</text>
  <path d="M 363.6 104 L 363.6 424" fill="none" stroke="#d9a9b1" stroke-width="1"/>
  <text x="351.6" y="412" text-anchor="end" fill="#ffd7de" font-size="13.5">counted</text>
  <text x="375.6" y="412" fill="#ffd7de" font-size="13.5">not counted</text>
  <!-- the limit: it follows from the rule, and nobody named it first -->
  <path d="M 80 129.5 L 704 129.5" fill="none" stroke="#ffd7de" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="90" y="120.5" font-weight="bold" fill="#ffffff" font-size="14">The limit that follows: 46.0 million</text>
  <!-- the last 4 days' pace, carried on unchanged -->
  <path d="M 363.6 223.8 L 489.5 104" fill="none" stroke="#d9a9b1" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <!-- the rule: each 7 days add less than a line that falls by 0.61 a week -->
  <path d="M 363.6 223.8 L 371.7 217.4 L 379.8 211.4 L 387.9 205.8 L 396.1 200.6 L 404.2 195.8 L 412.3 191.3 L 420.4 187.1 L 428.5 183.1 L 436.6 179.5 L 444.7 176.1 L 452.8 172.9 L 460.9 169.9 L 469 167.2 L 477.1 164.6 L 485.2 162.2 L 493.3 160 L 501.4 157.9 L 509.5 156 L 517.6 154.2 L 525.7 152.5 L 533.8 150.9 L 541.9 149.5 L 550 148.1 L 558.1 146.8 L 566.2 145.6 L 574.3 144.5 L 582.4 143.5 L 590.5 142.6 L 598.6 141.7 L 606.8 140.8 L 614.9 140.1 L 623 139.3 L 631.1 138.7 L 639.2 138 L 647.3 137.5 L 655.4 136.9 L 663.5 136.4 L 671.6 135.9 L 679.7 135.5 L 687.8 135.1 L 695.9 134.7 L 704 134.4" fill="none" stroke="#c98500" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="420.4" cy="187.1" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <circle cx="477.1" cy="164.6" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <circle cx="533.8" cy="150.9" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <circle cx="590.5" cy="142.6" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <circle cx="647.3" cy="137.5" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <circle cx="704" cy="134.4" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <!-- the counts: each day's last landing -->
  <path d="M 80 421.1 L 88.1 420.4 L 96.2 419.1 L 104.3 415.7 L 112.4 413.9 L 120.5 413.6 L 128.6 412.9 L 136.7 410.3 L 144.8 406.4 L 152.9 401.8 L 161 387.7 L 169.1 382.1 L 177.2 374.6 L 185.4 371.4 L 193.5 364.5 L 201.6 350.7 L 209.7 331.2 L 217.8 320.2 L 225.9 312.3 L 234 310.6 L 242.1 309.9 L 250.2 309 L 258.3 306.1 L 266.4 305.6 L 274.5 294 L 282.6 293.5 L 290.7 292.4 L 298.8 288.8 L 306.9 263.7 L 315 259 L 323.1 254.9 L 331.2 252.7 L 339.3 252.4 L 347.4 232.7 L 355.5 227 L 363.6 223.8" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80" cy="421.1" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="120.5" cy="413.6" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="161" cy="387.7" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="201.6" cy="350.7" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="242.1" cy="309.9" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="282.6" cy="293.5" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="323.1" cy="254.9" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="363.6" cy="223.8" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <!-- the key, and the 2 numbers of the last count -->
  <path d="M 724 150 L 748 150" fill="none" stroke="#3987e5" stroke-width="2"/>
  <circle cx="736" cy="150" r="4" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <text x="756" y="146" fill="#ffffff" font-size="13">Counted, to</text>
  <text x="756" y="162" fill="#ffffff" font-size="13">19 November</text>
  <path d="M 724 200 L 748 200" fill="none" stroke="#c98500" stroke-width="3" stroke-linecap="round"/>
  <text x="756" y="196" fill="#ffffff" font-size="13">The rule: each 7</text>
  <text x="756" y="212" fill="#ffffff" font-size="13">days under a line</text>
  <text x="756" y="228" fill="#ffffff" font-size="13">that falls by 0.61</text>
  <text x="756" y="244" fill="#ffffff" font-size="13">a week</text>
  <path d="M 724 282 L 748 282" fill="none" stroke="#ffd7de" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="756" y="278" fill="#ffffff" font-size="13">The limit that</text>
  <text x="756" y="294" fill="#ffffff" font-size="13">follows</text>
  <path d="M 724 332 L 748 332" fill="none" stroke="#d9a9b1" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <text x="756" y="328" fill="#ffffff" font-size="13">The last 4 days'</text>
  <text x="756" y="344" fill="#ffffff" font-size="13">pace: past the limit</text>
  <text x="756" y="360" fill="#ffffff" font-size="13">by 2 December</text>
  <text x="724" y="396" fill="#d9a9b1" font-size="12">Last count: 31,273,488.</text>
  <text x="724" y="414" fill="#d9a9b1" font-size="12">The weeks to come</text>
  <text x="724" y="432" fill="#d9a9b1" font-size="12">add under 14,742,953.</text>
  <text x="50" y="488" fill="#d9a9b1" font-size="12">Each point is a day's last landing on main, by the estimator's rule. Right of 19 November nothing is counted: 1 line is a rule, 1 is a pace.</text>
</svg>
