<svg xmlns="http://www.w3.org/2000/svg" width="570" height="570" viewBox="0 0 570 570">
<title>The finite toy map: A0(c, d) over the complete domain of 2952 formulas, N = 20</title>
<desc>Each cell is one fixed pair (c, d), classified by complete bounded enumeration under U0 U0-1.0. Circle: PASS UP TO N. Square with an X: FAIL, a checked counterexample. Triangle: UNKNOWN, work incomplete. Data sha256 e7229e46925cb5c7d57a1e1367a6afeedb982f0d58ddb24d785f11cf30e714ad.</desc>
