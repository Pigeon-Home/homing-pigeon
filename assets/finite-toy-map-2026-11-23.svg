<text x="90" y="64" fill="#c8c8c8" font-size="12.5" font-family="sans-serif">U0 U0-1.0, 2952 formulas, encoded length at most 20 bits. Shapes carry the state, colour only repeats it.</text>
<text x="90" y="92" fill="#f2f2f2" font-size="13" font-family="sans-serif">c, the program length constant, increasing right</text>
<text x="30" y="175" fill="#f2f2f2" font-size="14" font-family="sans-serif">d = 0</text>
