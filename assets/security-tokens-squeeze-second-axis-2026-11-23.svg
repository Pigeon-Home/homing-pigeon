<svg xmlns="http://www.w3.org/2000/svg" width="900" height="770" viewBox="0 0 900 770" font-family="Helvetica, Arial, sans-serif">
  <title>The squeeze, second axis: a schematic of one frozen scope, witnessed inside actual inside permitted, the uncharacterized part shown as unknown, with three dated registry figures beside it and the conditional recurrence in a box of its own</title>
  <desc>Nested sets L inside B inside U for one frozen scope and one observation. The ring outside the witnessed set is hatched and marked unknown: it is not measured, not sized and not empty by drawing. Three figures stand in separate rows, each with its own date and denominator: 18 of 31 fuzz targets tied to a constraint, 12 of 13 stated properties carrying a named model, and 208,556,359 of 651,086,719 recorded attempts on the tied targets, all from the bindings count of 20 November 2026. A separate box holds an illustrative conditional recurrence from a stipulated start of 3,393,230, the modeled token size gap at the count of 19 November 2026, reaching zero by week 30 under its stipulated rule; its units are synthetic and are not behaviours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#20040b"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#ff8a2a" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="hatch2" width="9" height="9" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#20040b"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="900" height="770" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">The squeeze, second axis</text>
  <text x="50" y="72" fill="#ffd7de" font-size="14">A schematic of 1 frozen scope: witnessed inside actual inside permitted, from the bindings count of 20 November 2026</text>
  <text x="50" y="92" fill="#ffd7de" font-size="13">Each figure beside it carries its own date and its own denominator. Nothing on this chart is a share of the permitted set.</text>

  <!-- the schematic: nested sets, areas carry no quantities -->
  <rect x="60" y="125" width="470" height="260" fill="url(#hatch)" stroke="#ffe14a" stroke-width="2.5"/>
  <text x="74" y="150" font-weight="bold" fill="#ffffff" font-size="15">permitted, U</text>
  <rect x="95" y="165" width="400" height="190" fill="url(#hatch2)" stroke="#ffffff" stroke-width="2"/>
  <text x="109" y="190" font-weight="bold" fill="#ffffff" font-size="15">actual, B</text>
  <rect x="130" y="205" width="330" height="120" fill="#3987e5" fill-opacity="0.22" stroke="#3987e5" stroke-width="2.5"/>
  <text x="144" y="234" font-weight="bold" fill="#ffffff" font-size="15">witnessed, L</text>
  <text x="144" y="256" fill="#ffd7de" font-size="12.5">behaviours with checked witnesses</text>
  <text x="144" y="274" fill="#ffd7de" font-size="12.5">L inside B inside U, for this 1 scope</text>
  <text x="144" y="292" fill="#ffd7de" font-size="12.5">and this 1 observation</text>
  <text x="505" y="152" fill="#ff8a2a" font-size="17" font-weight="bold">?</text>
  <text x="72" y="300" fill="#ff8a2a" font-size="17" font-weight="bold">?</text>
  <text x="472" y="300" fill="#ffffff" font-size="15" font-weight="bold">?</text>
  <text x="505" y="345" fill="#ff8a2a" font-size="17" font-weight="bold">?</text>
  <text x="50" y="408" fill="#d9a9b1" font-size="12.5">Schematic, not a measurement: the areas carry</text>
  <text x="50" y="424" fill="#d9a9b1" font-size="12.5">no quantities. The hatched part is the scope not</text>
  <text x="50" y="440" fill="#d9a9b1" font-size="12.5">yet characterized, drawn as unknown because it</text>
  <text x="50" y="456" fill="#d9a9b1" font-size="12.5">is unknown: not empty, and not a size. That B sits</text>
  <text x="50" y="472" fill="#d9a9b1" font-size="12.5">inside U is itself an obligation, to be argued</text>
  <text x="50" y="488" fill="#d9a9b1" font-size="12.5">for the scope, not assumed from the drawing.</text>

  <!-- the registry figures: 3 rows, 3 denominators -->
  <rect x="565" y="125" width="305" height="84" fill="#ffffff" fill-opacity="0.04" stroke="#6a2130"/>
  <rect x="578" y="138" width="14" height="14" fill="#3987e5"/>
  <text x="602" y="154" font-weight="bold" fill="#ffffff" font-size="20">18 of 31</text>
  <text x="602" y="173" fill="#ffd7de" font-size="12.5">fuzz targets tied to a constraint</text>
  <text x="602" y="188" fill="#d9a9b1" font-size="11.5">bindings count, 20 November 2026</text>
  <text x="602" y="203" fill="#d9a9b1" font-size="11.5">denominator: the 31 fuzz targets</text>
  <rect x="565" y="221" width="305" height="84" fill="#ffffff" fill-opacity="0.04" stroke="#6a2130"/>
  <path d="M 585 234 L 593 250 L 577 250 Z" fill="#ffffff"/>
  <text x="602" y="250" font-weight="bold" fill="#ffffff" font-size="20">12 of 13</text>
  <text x="602" y="269" fill="#ffd7de" font-size="12.5">properties carrying a named model</text>
  <text x="602" y="284" fill="#d9a9b1" font-size="11.5">bindings count, 20 November 2026</text>
  <text x="602" y="299" fill="#d9a9b1" font-size="11.5">denominator: the 13 stated properties</text>
  <rect x="565" y="317" width="305" height="84" fill="#ffffff" fill-opacity="0.04" stroke="#6a2130"/>
  <circle cx="585" cy="338" r="8" fill="#c98500"/>
  <text x="602" y="346" font-weight="bold" fill="#ffffff" font-size="16.5">208,556,359 of 651,086,719</text>
  <text x="602" y="365" fill="#ffd7de" font-size="12.5">recorded attempts on the tied targets</text>
  <text x="602" y="380" fill="#d9a9b1" font-size="11.5">bindings count, 20 November 2026</text>
  <text x="602" y="395" fill="#d9a9b1" font-size="11.5">denominator: the 651,086,719 attempts</text>
  <text x="565" y="425" fill="#ffd7de" font-size="12.5">Three quantities, three denominators.</text>
  <text x="565" y="441" fill="#ffd7de" font-size="12.5">The attempts row is about 32 percent of</text>
  <text x="565" y="457" fill="#ffd7de" font-size="12.5">recorded attempts; attempts can repeat.</text>
  <text x="565" y="473" fill="#ffd7de" font-size="12.5">None of the 3 rows is a share of the</text>
  <text x="565" y="489" fill="#ffd7de" font-size="12.5">permitted set, or a fraction of permitted</text>
  <text x="565" y="505" fill="#ffd7de" font-size="12.5">behaviours with checked witnesses.</text>

  <!-- the recurrence, in a box of its own -->
  <rect x="50" y="515" width="820" height="162" fill="#ffffff" fill-opacity="0.03" stroke="#6a2130"/>
  <text x="65" y="540" font-weight="bold" fill="#ffffff" font-size="15">Illustrative conditional recurrence, in a box of its own</text>
  <path d="M 85.0 632.0 L 85.0 560.0 L 99.2 562.0 L 113.3 564.1 L 127.5 566.1 L 141.7 568.2 L 155.8 570.2 L 170.0 572.2 L 184.2 574.3 L 198.3 576.3 L 212.5 578.3 L 226.7 580.4 L 240.8 582.4 L 255.0 584.5 L 269.2 586.5 L 283.3 588.5 L 297.5 590.6 L 311.7 592.6 L 325.8 594.7 L 340.0 596.7 L 354.2 598.7 L 368.3 600.8 L 382.5 602.9 L 396.7 604.9 L 410.8 607.0 L 425.0 609.1 L 439.2 611.1 L 453.3 613.4 L 467.5 616.3 L 481.7 619.1 L 495.8 622.0 L 510.0 632.0 Z" fill="#c98500" fill-opacity="0.15"/>
  <rect x="81.5" y="560.0" width="7" height="72.0" fill="#ff8a2a"/>
  <rect x="223.2" y="580.4" width="7" height="51.6" fill="#ff8a2a"/>
  <rect x="364.8" y="600.8" width="7" height="31.2" fill="#ff8a2a"/>
  <rect x="492.3" y="622.0" width="7" height="10.0" fill="#ff8a2a"/>
  <polyline points="85.0 560.0 99.2 562.0 113.3 564.1 127.5 566.1 141.7 568.2 155.8 570.2 170.0 572.2 184.2 574.3 198.3 576.3 212.5 578.3 226.7 580.4 240.8 582.4 255.0 584.5 269.2 586.5 283.3 588.5 297.5 590.6 311.7 592.6 325.8 594.7 340.0 596.7 354.2 598.7 368.3 600.8 382.5 602.9 396.7 604.9 410.8 607.0 425.0 609.1 439.2 611.1 453.3 613.4 467.5 616.3 481.7 619.1 495.8 622.0" fill="none" stroke="#c98500" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 495.8 622.0 L 510.0 632.0" fill="none" stroke="#c98500" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="510.0" cy="632.0" r="4" fill="#c98500"/>
  <text x="95" y="556" fill="#d9a9b1" font-size="11.5">3,393,230</text>
  <text x="468" y="618" fill="#d9a9b1" font-size="11.5">1</text>
  <text x="79" y="650" fill="#d9a9b1" font-size="11.5">week 0</text>
  <text x="472" y="650" fill="#d9a9b1" font-size="11.5">week 30: 0</text>
  <text x="540" y="561" fill="#ffd7de" font-size="12.5">Stipulated start: 3,393,230, the modeled token</text>
  <text x="540" y="577" fill="#ffd7de" font-size="12.5">size gap at the count of 19 November 2026.</text>
  <text x="540" y="593" fill="#ffd7de" font-size="12.5">A modeled token quantity, not behaviours.</text>
  <text x="540" y="609" fill="#ffd7de" font-size="12.5">Rule: at least 0.39 of the remainder closes</text>
  <text x="540" y="625" fill="#ffd7de" font-size="12.5">each week; at 1 in week 29, zero by week 30.</text>
  <text x="540" y="641" fill="#ffd7de" font-size="12.5">The units are synthetic, not uncovered</text>
  <text x="540" y="657" fill="#ffd7de" font-size="12.5">behaviours. This box claims no coverage.</text>

  <!-- footer: what a true coverage curve would need, and the legend -->
  <text x="50" y="705" fill="#d9a9b1" font-size="12.5">A true coverage curve would need a fixed finite universe or a specified finite quotient, a complete denominator, distinct</text>
  <text x="50" y="723" fill="#d9a9b1" font-size="12.5">behaviour IDs, and independently validated witness mappings. Until those stand, no coverage curve is drawn here.</text>
  <path d="M 50 747 L 78 747" fill="none" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="751" fill="#ffd7de" font-size="12.5">witnessed, solid blue</text>
  <path d="M 245 747 L 273 747" fill="none" stroke="#ffe14a" stroke-width="3" stroke-linecap="round"/>
  <text x="283" y="751" fill="#ffd7de" font-size="12.5">permitted, solid yellow</text>
  <rect x="450" y="739" width="28" height="14" fill="url(#hatch)" stroke="#ff8a2a" stroke-width="1"/>
  <text x="488" y="751" fill="#ffd7de" font-size="12.5">not yet characterized, hatched</text>
  <path d="M 715 747 L 743 747" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <text x="753" y="751" fill="#ffd7de" font-size="12.5">stipulated rule</text>
</svg>
