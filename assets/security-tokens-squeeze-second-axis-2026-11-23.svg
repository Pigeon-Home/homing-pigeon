<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>The squeeze, second axis: coverage of one frozen scope, witnessed inside real inside permitted, the witnessed share rising under the closing rule toward the permitted boundary</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">The squeeze, second axis</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">Coverage of 1 frozen scope: witnessed inside real inside permitted, from the bindings count of 20 November 2026</text>
  <!-- the uncharacterized remainder, shaded -->
  <path d="M 80 104 L 704 104 L 704 105 L 603.2 105.2 L 478.4 109.8 L 374.4 122.2 L 332.8 133.8 L 291.2 153 L 249.6 184.9 L 208 236.7 L 80 321.6 Z" fill="#ffffff" fill-opacity="0.05"/>
  <!-- grid: proportion of the permitted set -->
  <path d="M 80 424 L 704 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <path d="M 80 344 L 704 344" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="348.5" text-anchor="end" fill="#d9a9b1" font-size="13">0.25</text>
  <path d="M 80 264 L 704 264" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="268.5" text-anchor="end" fill="#d9a9b1" font-size="13">0.5</text>
  <path d="M 80 184 L 704 184" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="188.5" text-anchor="end" fill="#d9a9b1" font-size="13">0.75</text>
  <path d="M 80 104 L 704 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">1.0</text>
  <text x="30" y="264" text-anchor="middle" fill="#d9a9b1" font-size="13" transform="rotate(-90 30 264)">share of the permitted set</text>
  <!-- weeks -->
  <path d="M 80 424 L 80 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">week 0</text>
  <path d="M 270.4 424 L 270.4 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="270.4" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">week 9</text>
  <path d="M 460.8 424 L 460.8 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="460.8" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">week 18</text>
  <path d="M 704 424 L 704 430" fill="none" stroke="#6a2130" stroke-width="1"/>
  <text x="704" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">week 30</text>
  <text x="392" y="470" text-anchor="middle" fill="#d9a9b1" font-size="13">weeks from the count of 19 November 2026</text>
  <!-- permitted: the fixed top boundary -->
  <path d="M 80 104 L 704 104" fill="none" stroke="#ffe14a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="90" y="96" font-weight="bold" fill="#ffffff" font-size="14">permitted: the top boundary, fixed at 1.0</text>
  <!-- per property: 12 of 13 carry a model, dotted -->
  <path d="M 80 128.6 L 704 128.6" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.8"/>
  <text x="90" y="146" fill="#ffd7de" font-size="12.5">12 of 13 properties carry a model; 1 carries observed execution alone</text>
  <!-- witnessed under the rule: dashed -->
  <path d="M 80 321.6 L 100.8 236.7 L 121.6 184.9 L 142.4 153 L 163.2 133.8 L 184 122.2 L 228 109.8 L 290.4 105.2 L 415.2 104.6 L 704 104.2" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- witnessed: the 1 measured point -->
  <circle cx="80" cy="321.6" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <text x="90" y="340" font-weight="bold" fill="#ffffff" font-size="13.5">witnessed, measured at week 0: 0.32 of the inputs</text>
  <text x="90" y="358" fill="#ffd7de" font-size="12.5">208,556,359 of 651,086,719 inputs ride on bound targets</text>
  <!-- the gap bars, as the closing chart draws them -->
  <path d="M 80 321.6 L 80 104" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <path d="M 332.8 133.8 L 332.8 104" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <path d="M 603.2 105.2 L 603.2 104" fill="none" stroke="#ff8a2a" stroke-width="6"/>
  <text x="718" y="122" font-weight="bold" fill="#ffffff" font-size="17">18 of 31</text>
  <text x="718" y="139" fill="#ffd7de" font-size="13">fuzz targets bound</text>
  <text x="718" y="178" font-weight="bold" fill="#ffffff" font-size="17">3,393,230</text>
  <text x="718" y="195" fill="#ffd7de" font-size="13">the modeled gap at the</text>
  <text x="718" y="211" fill="#ffd7de" font-size="13">count of 19 November</text>
  <text x="718" y="250" font-weight="bold" fill="#ffffff" font-size="17">0 in week 30</text>
  <text x="718" y="267" fill="#ffd7de" font-size="13">the gap under the rule,</text>
  <text x="718" y="283" fill="#ffd7de" font-size="13">at least 0.39 closing a week</text>
  <text x="718" y="322" font-weight="bold" fill="#ffffff" font-size="17">1 scope</text>
  <text x="718" y="339" fill="#ffd7de" font-size="13">if the bands meet, this</text>
  <text x="718" y="355" fill="#ffd7de" font-size="13">frozen scope is characterized</text>
  <text x="718" y="371" fill="#ffd7de" font-size="13">exactly. It would mean</text>
  <text x="718" y="387" fill="#ffd7de" font-size="13">nothing about any other</text>
  <text x="718" y="403" fill="#ffd7de" font-size="13">scope, and nothing about</text>
  <text x="718" y="419" fill="#ffd7de" font-size="13">P versus NP.</text>
  <!-- legend -->
  <path d="M 50 489.5 L 78 489.5" fill="none" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="494" fill="#ffd7de" font-size="13.5">measured</text>
  <path d="M 190 489.5 L 218 489.5" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="228" y="494" fill="#ffd7de" font-size="13.5">the stipulated rule</text>
  <path d="M 380 489.5 L 408 489.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
  <text x="418" y="494" fill="#ffd7de" font-size="13.5">per property count</text>
  <path d="M 580 489.5 L 608 489.5" fill="none" stroke="#ffe14a" stroke-width="3" stroke-linecap="round"/>
  <text x="618" y="494" fill="#ffd7de" font-size="13.5">permitted</text>
  <path d="M 716 489.5 L 744 489.5" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linecap="round"/>
  <text x="754" y="494" fill="#ffd7de" font-size="13.5">the gap</text>
</svg>
