  <circle cx="363.6" cy="249.9" r="6.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <!-- the rule, stated on the chart so the word needs no other page -->
  <text x="90" y="134" fill="#ffd7de" font-size="13">the rule: each 7 days add less</text>
  <text x="90" y="150" fill="#ffd7de" font-size="13">than a line that falls by 0.61 a week</text>
  <text x="718" y="123" font-weight="bold" fill="#ffffff" font-size="17">28.4M</text>
  <text x="718" y="140" fill="#ffd7de" font-size="13">the run log, if it keeps</text>
  <text x="718" y="156" fill="#ffd7de" font-size="13">the rule from 19 Nov</text>
  <text x="718" y="238.2" font-weight="bold" fill="#ffffff" font-size="17">17.6M</text>
  <text x="718" y="255.2" fill="#ffd7de" font-size="13">everything else: it has</text>
  <text x="718" y="271.2" fill="#ffd7de" font-size="13">kept the rule 19 days</text>
  <text x="718" y="345.2" fill="#d9a9b1" font-size="13">On 19 November</text>
  <text x="718" y="362.2" fill="#d9a9b1" font-size="13">the run log: 16.3M,</text>
  <text x="718" y="378.2" fill="#d9a9b1" font-size="13">its limit stands on an if.</text>
  <text x="718" y="394.2" fill="#d9a9b1" font-size="13">Everything else: 15.0M.</text>
  <path d="M 50 489.5 L 78 489.5" fill="none" stroke="#c98500" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="494" fill="#ffd7de" font-size="13.5">the fuzz run log (one file)</text>
  <path d="M 305.7 489.5 L 333.7 489.5" fill="none" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/>
  <text x="343.7" y="494" fill="#ffd7de" font-size="13.5">everything else in the tree</text>
  <path d="M 561.4 489.5 L 589.4 489.5" fill="none" stroke="#ffd7de" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="599.4" y="494" fill="#ffd7de" font-size="13.5">the limit the rule gives</text>
</svg>
