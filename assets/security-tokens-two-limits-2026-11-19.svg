  <circle cx="647.3" cy="131.9" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <circle cx="704" cy="127.6" r="3.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <path d="M 363.6 264.5 L 371.7 262.6 L 379.8 260.8 L 387.9 259.1 L 396.1 257.5 L 404.2 256.1 L 412.3 254.7 L 420.4 253.5 L 428.5 252.3 L 436.6 251.2 L 444.7 250.2 L 452.8 249.2 L 460.9 248.3 L 469 247.5 L 477.1 246.7 L 485.2 246 L 493.3 245.3 L 501.4 244.7 L 509.5 244.1 L 517.6 243.6 L 525.7 243.1 L 533.8 242.6 L 541.9 242.2 L 550 241.8 L 558.1 241.4 L 566.2 241 L 574.3 240.7 L 582.4 240.4 L 590.5 240.1 L 598.6 239.8 L 606.8 239.6 L 614.9 239.4 L 623 239.1 L 631.1 238.9 L 639.2 238.8 L 647.3 238.6 L 655.4 238.4 L 663.5 238.3 L 671.6 238.1 L 679.7 238 L 687.8 237.9 L 695.9 237.8 L 704 237.7" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="420.4" cy="253.5" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="477.1" cy="246.7" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="533.8" cy="242.6" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="590.5" cy="240.1" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="647.3" cy="238.6" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="704" cy="237.7" r="3.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
