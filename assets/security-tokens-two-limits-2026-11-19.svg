  <path d="M 80 419.2 L 88.1 418 L 96.2 415.9 L 104.3 410.1 L 112.4 407.2 L 120.5 406.7 L 128.6 405.4 L 136.7 401.1 L 144.8 394.7 L 152.9 387 L 161 363.4 L 169.1 354.2 L 177.2 345.8 L 185.4 343.8 L 193.5 339.3 L 201.6 336.7 L 209.7 317.8 L 217.8 309.1 L 225.9 298.6 L 234 297.6 L 242.1 298.2 L 250.2 296.8 L 258.3 291.9 L 266.4 291.2 L 274.5 288.6 L 282.6 287.8 L 290.7 285.9 L 298.8 280 L 306.9 269.4 L 315 275.8 L 323.1 272.7 L 331.2 269.1 L 339.3 268.6 L 347.4 268 L 355.5 265.5 L 363.6 264.5 L 371.7 260.5 L 379.8 260.5" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 169.1 424 L 177.2 420 L 185.4 416.6 L 193.5 409.5 L 201.6 389.1 L 209.7 375.4 L 217.8 365.8 L 225.9 363.3 L 234 361.5 L 242.1 359.6 L 250.2 359.6 L 258.3 359.6 L 266.4 359.6 L 274.5 342.7 L 282.6 342.7 L 290.7 342.7 L 298.8 342.7 L 306.9 311.4 L 315 297.2 L 323.1 293.4 L 331.2 293.4 L 339.3 293.4 L 347.4 261.2 L 355.5 254.3 L 363.6 249.9 L 371.7 245.4 L 379.8 245.4" fill="none" stroke="#21050b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 169.1 424 L 177.2 420 L 185.4 416.6 L 193.5 409.5 L 201.6 389.1 L 209.7 375.4 L 217.8 365.8 L 225.9 363.3 L 234 361.5 L 242.1 359.6 L 250.2 359.6 L 258.3 359.6 L 266.4 359.6 L 274.5 342.7 L 282.6 342.7 L 290.7 342.7 L 298.8 342.7 L 306.9 311.4 L 315 297.2 L 323.1 293.4 L 331.2 293.4 L 339.3 293.4 L 347.4 261.2 L 355.5 254.3 L 363.6 249.9 L 371.7 245.4 L 379.8 245.4" fill="none" stroke="#c98500" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="379.8" cy="260.5" r="6.5" fill="#3987e5" stroke="#21050b" stroke-width="2"/>
  <circle cx="379.8" cy="245.4" r="6.5" fill="#c98500" stroke="#21050b" stroke-width="2"/>
  <!-- the rule, stated on the chart so the word needs no other page -->
  <text x="90" y="134" fill="#ffd7de" font-size="13">the rule: each 7 days add less</text>
  <text x="90" y="150" fill="#ffd7de" font-size="13">than a line that falls by 0.61 a week</text>
  <text x="718" y="135.5" font-weight="bold" fill="#ffffff" font-size="17">27.2M</text>
  <text x="718" y="152.5" fill="#ffd7de" font-size="13">the run log, if it keeps</text>
  <text x="718" y="168.5" fill="#ffd7de" font-size="13">the rule from 21 Nov</text>
  <text x="718" y="237.9" font-weight="bold" fill="#ffffff" font-size="17">17.6M</text>
  <text x="718" y="254.9" fill="#ffd7de" font-size="13">everything else: it has</text>
  <text x="718" y="270.9" fill="#ffd7de" font-size="13">kept the rule 21 days</text>
  <text x="718" y="345.2" fill="#d9a9b1" font-size="13">On 21 November</text>
  <text x="718" y="362.2" fill="#d9a9b1" font-size="13">the run log: 16.7M,</text>
  <text x="718" y="378.2" fill="#d9a9b1" font-size="13">its limit stands on an if.</text>
  <text x="718" y="394.2" fill="#d9a9b1" font-size="13">Everything else: 15.3M.</text>
  <path d="M 50 489.5 L 78 489.5" fill="none" stroke="#c98500" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="494" fill="#ffd7de" font-size="13.5">the fuzz run log (one file)</text>
  <path d="M 305.7 489.5 L 333.7 489.5" fill="none" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/>
  <text x="343.7" y="494" fill="#ffd7de" font-size="13.5">everything else in the tree</text>
  <path d="M 561.4 489.5 L 589.4 489.5" fill="none" stroke="#ffd7de" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="599.4" y="494" fill="#ffd7de" font-size="13.5">the limit the rule gives</text>
</svg>
