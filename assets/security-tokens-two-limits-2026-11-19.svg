<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>The 2 parts of the security-token count, 15 October to 31 December 2026: everything else under its line toward 17.6M, and the fuzz run log toward 28.4M if it keeps the same rule</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
