  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">2 lines, 2 limits</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">The 2 parts of the count to 19 November 2026, and the limit a rule gives each</text>
  <!-- the side that is not counted -->
  <rect x="363.6" y="104" width="340.4" height="320" fill="#ffffff" fill-opacity="0.045"/>
  <!-- the grid and the 2 axes -->
