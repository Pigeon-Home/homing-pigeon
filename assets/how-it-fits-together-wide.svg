<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="760" viewBox="0 0 1140 760" font-family="Helvetica, Arial, sans-serif">
  <title>Homing Pigeon — how it fits together</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57101e"/>
      <stop offset="1" stop-color="#3a0a15"/>
    </linearGradient>
  </defs>
  <rect width="1140" height="760" fill="url(#bg)"/>

  <!-- You -->
  <rect x="40" y="60" width="220" height="170" rx="16" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="150" y="138" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">You</text>
  <text x="150" y="170" text-anchor="middle" fill="#ffd7de" font-size="16">(and the SI you bring)</text>
  <path d="M 260 145 L 295 145" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="318,145 294,132 294,158" fill="#ff4d6d"/>
  <text x="289" y="119" text-anchor="middle" fill="#ffd7de" font-size="15">a job</text>

  <!-- Transports -->
  <rect x="320" y="60" width="280" height="170" rx="16" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="460" y="132" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">Transports</text>
  <text x="460" y="164" text-anchor="middle" fill="#ffd7de" font-size="15">(email · DTLS · file — the job travels</text>
  <text x="460" y="186" text-anchor="middle" fill="#ffd7de" font-size="15">signed and encrypted)</text>
  <path d="M 600 145 L 635 145" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="658,145 634,132 634,158" fill="#ff4d6d"/>

  <!-- The Door -->
  <rect x="660" y="40" width="340" height="230" rx="16" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="830" y="88" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">The Door</text>
  <text x="830" y="114" text-anchor="middle" fill="#ffd7de" font-size="14">(the runner's front gate — only signed jobs pass)</text>
  <rect x="690" y="130" width="280" height="48" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="830" y="161" text-anchor="middle" fill="#ffffff" font-size="19">Signature Check</text>
  <path d="M 830 178 L 830 184" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="830,198 821,183 839,183" fill="#ff4d6d"/>
  <rect x="690" y="200" width="280" height="48" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="830" y="231" text-anchor="middle" fill="#ffffff" font-size="19">Job Queue</text>
  <!-- the door down to the runner -->
  <path d="M 830 270 L 830 293 L 478 293 L 478 305" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="478,328 465,304 491,304" fill="#ff4d6d"/>

  <!-- The Runner -->
  <rect x="190" y="330" width="576" height="220" rx="16" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="478" y="372" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">The Runner</text>
  <rect x="215" y="390" width="168" height="76" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="299" y="422" text-anchor="middle" fill="#ffffff" font-size="16">Shared-Secret</text>
  <text x="299" y="444" text-anchor="middle" fill="#ffffff" font-size="16">Check</text>
  <rect x="394" y="390" width="168" height="76" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="478" y="418" text-anchor="middle" fill="#ffffff" font-size="16">The Cage</text>
  <text x="478" y="440" text-anchor="middle" fill="#ffd7de" font-size="12">(security modes, on by default)</text>
  <rect x="573" y="390" width="168" height="76" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="657" y="414" text-anchor="middle" fill="#ffffff" font-size="16">The Oracle</text>
  <text x="657" y="436" text-anchor="middle" fill="#ffd7de" font-size="12">(reads the job, lends</text>
  <text x="657" y="452" text-anchor="middle" fill="#ffd7de" font-size="12">a hand)</text>
  <rect x="215" y="478" width="526" height="56" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="478" y="501" text-anchor="middle" fill="#ffffff" font-size="17">Size Guard</text>
  <text x="478" y="522" text-anchor="middle" fill="#ffd7de" font-size="12">(caps on the job and the result)</text>

  <!-- The SI's Mind, and the two-way line to it -->
  <rect x="880" y="360" width="220" height="130" rx="14" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="990" y="414" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">The SI's Mind</text>
  <text x="990" y="442" text-anchor="middle" fill="#ffd7de" font-size="14">(outside the box)</text>
  <path d="M 789 425 L 857 425" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="768,425 790,413 790,437" fill="#ff4d6d"/>
  <polygon points="878,425 856,413 856,437" fill="#ff4d6d"/>

  <!-- the runner down to the work loop -->
  <path d="M 713 550 L 713 575" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="713,598 700,574 726,574" fill="#ff4d6d"/>

  <!-- The Work Loop -->
  <rect x="660" y="600" width="420" height="120" rx="16" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="870" y="646" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">The Work Loop</text>
  <text x="870" y="678" text-anchor="middle" fill="#ffd7de" font-size="15">run the job → capture the output → sign the</text>
  <text x="870" y="698" text-anchor="middle" fill="#ffd7de" font-size="15">result</text>
  <path d="M 660 660 L 635 660" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="612,660 636,647 636,673" fill="#ff4d6d"/>

  <!-- The Way Back -->
  <rect x="190" y="600" width="420" height="120" rx="16" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="400" y="640" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">The Way Back</text>
  <rect x="215" y="656" width="150" height="44" rx="9" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="290" y="684" text-anchor="middle" fill="#ffffff" font-size="15">Reply to Your SI</text>
  <path d="M 443 678 L 382 678" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="367,678 383,669 383,687" fill="#ff4d6d"/>
  <rect x="443" y="656" width="150" height="44" rx="9" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="518" y="684" text-anchor="middle" fill="#ffffff" font-size="15">Signed Result</text>

  <!-- the way back up to you -->
  <path d="M 190 660 L 100 660 L 100 255" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="100,232 87,256 113,256" fill="#ff4d6d"/>
</svg>
