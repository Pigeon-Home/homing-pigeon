<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <title>The (c, d) plane: a map of candidate machines A(c, d), one point per fixed pair of constants, coloured by checked counterexamples, with the checked frontier sweeping it</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c98500"/></marker>
    <marker id="arrowWhite" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="50" y="46" fill="#ffffff" font-size="24" font-weight="bold">The (c, d) plane</text>
  <text x="50" y="72" fill="#ffd7de" font-size="15">A map of candidate machines: 1 point per fixed pair (c, d), coloured by its known fate</text>
  <!-- grid -->
  <path d="M 80 424 L 704 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <path d="M 80 344 L 704 344" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 80 264 L 704 264" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 80 184 L 704 184" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 80 104 L 704 104" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 80 104 L 80 424" fill="none" stroke="#6a2130" stroke-width="1"/>
  <path d="M 236 104 L 236 424" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 392 104 L 392 424" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 548 104 L 548 424" fill="none" stroke="#45121d" stroke-width="1"/>
  <path d="M 704 104 L 704 424" fill="none" stroke="#45121d" stroke-width="1"/>
  <text x="68" y="428.5" text-anchor="end" fill="#d9a9b1" font-size="13">0</text>
  <text x="68" y="268.5" text-anchor="end" fill="#d9a9b1" font-size="13">5</text>
  <text x="68" y="108.5" text-anchor="end" fill="#d9a9b1" font-size="13">10</text>
  <text x="30" y="264" text-anchor="middle" fill="#d9a9b1" font-size="13" transform="rotate(-90 30 264)">d: the time exponent, (n + 2)^d steps</text>
  <text x="80" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">0</text>
  <text x="392" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">5</text>
  <text x="704" y="448" text-anchor="middle" fill="#d9a9b1" font-size="13">10</text>
  <text x="392" y="470" text-anchor="middle" fill="#d9a9b1" font-size="13">c: the program length constant, programs of at most c log2(n + 2) bits</text>
  <!-- the pairs, uncoloured: no checked counterexample stands for any of them -->
  <g fill="none" stroke="#d9a9b1" stroke-width="1.5" opacity="0.65">
    <circle cx="142" cy="376" r="5"/><circle cx="267" cy="376" r="5"/><circle cx="392" cy="376" r="5"/><circle cx="517" cy="376" r="5"/><circle cx="642" cy="376" r="5"/>
    <circle cx="142" cy="296" r="5"/><circle cx="267" cy="296" r="5"/><circle cx="392" cy="296" r="5"/><circle cx="517" cy="296" r="5"/><circle cx="642" cy="296" r="5"/>
    <circle cx="142" cy="216" r="5"/><circle cx="267" cy="216" r="5"/><circle cx="392" cy="216" r="5"/><circle cx="517" cy="216" r="5"/><circle cx="642" cy="216" r="5"/>
    <circle cx="142" cy="136" r="5"/><circle cx="267" cy="136" r="5"/><circle cx="392" cy="136" r="5"/><circle cx="517" cy="136" r="5"/><circle cx="642" cy="136" r="5"/>
  </g>
  <text x="90" y="96" fill="#ffd7de" font-size="12.5">every point stands open: no pair carries a checked counterexample for the general machine today</text>
  <!-- the checked frontier, sweeping -->
  <path d="M 80 400 L 330 400 L 455 275 L 455 150" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
  <text x="96" y="392" font-weight="bold" fill="#ffffff" font-size="13">the checked frontier</text>
  <text x="470" y="140" fill="#ffd7de" font-size="12.5">below and left of it, pairs are tested</text>
  <text x="470" y="156" fill="#ffd7de" font-size="12.5">only up to the largest size checked so far</text>
  <!-- hard-coding moves a dead pair right -->
  <path d="M 560 330 L 640 330" fill="none" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrowWhite)"/>
  <text x="520" y="318" fill="#ffd7de" font-size="12.5">hard-coding finitely many exceptions</text>
  <text x="520" y="352" fill="#ffd7de" font-size="12.5">moves a dead pair 1 step right</text>
  <text x="718" y="122" font-weight="bold" fill="#ffffff" font-size="17">1 point</text>
  <text x="718" y="139" fill="#ffd7de" font-size="13">never coloured, at every</text>
  <text x="718" y="155" fill="#ffd7de" font-size="13">size: the P = NP side</text>
  <text x="718" y="194" font-weight="bold" fill="#ffffff" font-size="17">every point</text>
  <text x="718" y="211" fill="#ffd7de" font-size="13">coloured in the end, with</text>
  <text x="718" y="227" fill="#ffd7de" font-size="13">counterexamples of</text>
  <text x="718" y="243" fill="#ffd7de" font-size="13">arbitrarily large size:</text>
  <text x="718" y="259" fill="#ffd7de" font-size="13">the P != NP side</text>
  <text x="718" y="298" font-weight="bold" fill="#ffffff" font-size="17">many halted</text>
  <text x="718" y="315" fill="#ffd7de" font-size="13">finders is not all finders</text>
  <text x="718" y="331" fill="#ffd7de" font-size="13">halted: no motion of the</text>
  <text x="718" y="347" fill="#ffd7de" font-size="13">frontier reaches the</text>
  <text x="718" y="363" fill="#ffd7de" font-size="13">universal quantifier</text>
  <text x="718" y="402" font-weight="bold" fill="#ffffff" font-size="17">a definition map</text>
  <text x="718" y="419" fill="#ffd7de" font-size="13">not evidence: the plane</text>
  <text x="718" y="435" fill="#ffd7de" font-size="13">starts nearly empty,</text>
  <text x="718" y="451" fill="#ffd7de" font-size="13">because that is the truth</text>
  <!-- legend -->
  <circle cx="64" cy="489.5" r="5" fill="none" stroke="#d9a9b1" stroke-width="1.5"/>
  <text x="78" y="494" fill="#ffd7de" font-size="13.5">a pair, fate open</text>
  <path d="M 240 489.5 L 268 489.5" fill="none" stroke="#c98500" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="278" y="494" fill="#ffd7de" font-size="13.5">the checked frontier</text>
  <circle cx="478" cy="489.5" r="5" fill="#f5b942"/>
  <text x="492" y="494" fill="#ffd7de" font-size="13.5">a pair with a checked counterexample: dead, finitely and forever (none stand today)</text>
</svg>
