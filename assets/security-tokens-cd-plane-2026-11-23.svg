<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Helvetica, Arial, sans-serif">
  <title>The (c, d) plane: a map of candidate machines A(c, d), 1 point per fixed pair of constants, every point standing open today, with 1 schematic hypothetical point whose fall would shade the whole south west box, the cofinal diagonal, and the evidence standing off the plane</title>
  <desc>A definition map, not evidence. Monotonicity is the picture: a verified satisfiable formula defeating A(c, d) also defeats every pair to its lower left, and a pair passing a fixed finite corpus means every pair to its upper right passes that same corpus. No pair has been checked against the general machine; the worked example and corpus counts stand in an evidence panel off the plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="660" fill="url(#bg)"/>
  <text x="50" y="44" fill="#ffffff" font-size="24" font-weight="bold">The (c, d) plane</text>
  <text x="50" y="70" fill="#ffd7de" font-size="15">A map of candidate machines: 1 point per fixed pair (c, d), every point open today</text>

  <rect x="90" y="110" width="530" height="310" fill="none" stroke="#6a2130" stroke-width="1.5"/>
  <path d="M 90 193 L 620 193" stroke="#45121d" stroke-width="1"/>
  <path d="M 90 277 L 620 277" stroke="#45121d" stroke-width="1"/>
  <path d="M 90 357 L 620 357" stroke="#45121d" stroke-width="1"/>
  <path d="M 196 110 L 196 420" stroke="#45121d" stroke-width="1"/>
  <path d="M 302 110 L 302 420" stroke="#45121d" stroke-width="1"/>
  <path d="M 408 110 L 408 420" stroke="#45121d" stroke-width="1"/>
  <path d="M 514 110 L 514 420" stroke="#45121d" stroke-width="1"/>

  <rect x="90" y="235" width="212" height="185" fill="#f5b942" opacity="0.14"/>
  <rect x="90" y="235" width="212" height="185" fill="none" stroke="#f5b942" stroke-width="1" stroke-dasharray="4 3"/>

  <path d="M 90 420 L 462 110" fill="none" stroke="#2fd4c4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="330" y="200" fill="#2fd4c4" font-size="12.5" transform="rotate(-39 330 200)">the diagonal pairs (k, k): cofinal</text>

  <g fill="none" stroke="#ffffff" stroke-width="1.4">
    <circle cx="143" cy="151" r="5"/><circle cx="249" cy="151" r="5"/><circle cx="355" cy="151" r="5"/><circle cx="461" cy="151" r="5"/><circle cx="567" cy="151" r="5"/>
    <circle cx="143" cy="235" r="5"/><circle cx="249" cy="235" r="5"/><circle cx="461" cy="235" r="5"/><circle cx="567" cy="235" r="5"/>
    <circle cx="143" cy="319" r="5"/><circle cx="249" cy="319" r="5"/><circle cx="355" cy="319" r="5"/><circle cx="461" cy="319" r="5"/><circle cx="567" cy="319" r="5"/>
    <circle cx="143" cy="388" r="5"/><circle cx="249" cy="388" r="5"/><circle cx="355" cy="388" r="5"/><circle cx="461" cy="388" r="5"/><circle cx="567" cy="388" r="5"/>
  </g>

  <circle cx="302" cy="235" r="10" fill="none" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="302" cy="235" r="5.5" fill="#f5b942"/>
  <text x="322" y="222" fill="#f5b942" font-size="13" font-weight="bold">1 schematic point, hypothetical</text>
  <text x="322" y="240" fill="#f0c9c9" font-size="12">if it fell, the shaded box falls with it:</text>
  <text x="322" y="256" fill="#f0c9c9" font-size="12">a defeat at (c, d) defeats every pair lower left</text>

  <path d="M 90 388 L 408 388 L 408 319 L 620 319" fill="none" stroke="#c9a3a3" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="96" y="380" fill="#c9a3a3" font-size="12">a size frontier, dashed: hypothetical, illustrative only</text>

  <text x="330" y="448" fill="#ffffff" font-size="14">c, the program length constant</text>
  <text x="30" y="270" fill="#ffffff" font-size="14" transform="rotate(-90 30 270)">d, the time exponent</text>
  <text x="96" y="104" fill="#f0c9c9" font-size="12">upper right: a pair passing a fixed finite corpus</text>
  <text x="96" y="130" fill="#f0c9c9" font-size="12">carries every pair above and right with it, on that corpus</text>

  <rect x="648" y="110" width="222" height="310" fill="#1d040b" stroke="#6a2130" stroke-width="1"/>
  <text x="664" y="138" fill="#ffffff" font-size="14" font-weight="bold">Reading the plane</text>
  <text x="664" y="164" fill="#f0e6e6" font-size="12">Open circle: a pair standing</text>
  <text x="664" y="182" fill="#f0e6e6" font-size="12">open; none checked against</text>
  <text x="664" y="200" fill="#f0e6e6" font-size="12">the general machine.</text>
  <text x="664" y="228" fill="#f0e6e6" font-size="12">Shaded box: the monotonicity.</text>
  <text x="664" y="246" fill="#f0e6e6" font-size="12">Defeats propagate lower left;</text>
  <text x="664" y="264" fill="#f0e6e6" font-size="12">corpus passes propagate</text>
  <text x="664" y="282" fill="#f0e6e6" font-size="12">upper right.</text>
  <text x="664" y="310" fill="#f0e6e6" font-size="12">Teal diagonal: the pairs (k, k)</text>
  <text x="664" y="328" fill="#f0e6e6" font-size="12">are cofinal, so a separating</text>
  <text x="664" y="346" fill="#f0e6e6" font-size="12">proof can target the diagonal.</text>
  <text x="664" y="374" fill="#f0e6e6" font-size="12">A third quantity stands off</text>
  <text x="664" y="392" fill="#f0e6e6" font-size="12">these axes: the formula size</text>
  <text x="664" y="410" fill="#f0e6e6" font-size="12">limit a check has reached.</text>

  <rect x="50" y="478" width="820" height="104" fill="#1d040b" stroke="#6a2130" stroke-width="1"/>
  <text x="66" y="504" fill="#ffffff" font-size="14" font-weight="bold">Evidence, off the plane</text>
  <text x="66" y="528" fill="#f0e6e6" font-size="12.5">Worked example check: 800 fixed seed tree instances, 53,272 assignments scored against brute force.</text>
  <text x="66" y="548" fill="#f0e6e6" font-size="12.5">Corpus counts: 651,086,719 inputs over 35,270 grow runs; bindings count: 31 targets, 18 bound.</text>
  <text x="66" y="568" fill="#ffd7de" font-size="12.5">None of these checks ran A(c, d): they are counts, not points on this plane, and they colour no pair.</text>

  <text x="50" y="612" fill="#f0c9c9" font-size="12.5">Known exceptions can in principle be patched into another fixed procedure, possibly at larger constants on both axes;</text>
  <text x="50" y="632" fill="#f0c9c9" font-size="12.5">patching them does not establish that no unknown exceptions exist. Many halted finders is not all finders halted.</text>
</svg>
