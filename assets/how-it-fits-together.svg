<svg xmlns="http://www.w3.org/2000/svg" width="899" height="1670" viewBox="0 0 899 1670" font-family="Helvetica, Arial, sans-serif">
  <title>Homing Pigeon v1 — how it fits together</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57101e"/>
      <stop offset="1" stop-color="#3a0a15"/>
    </linearGradient>
  </defs>
  <rect width="899" height="1670" fill="url(#bg)"/>
  <text x="450" y="58" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">Homing Pigeon <tspan fill="#ff4d6d">v1</tspan></text>

  <!-- You -->
  <rect x="63" y="83" width="774" height="144" rx="24" fill="none" stroke="#3ddc97" stroke-width="3"/>
  <rect x="70" y="90" width="760" height="130" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="148" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">You</text>
  <text x="450" y="188" text-anchor="middle" fill="#ffd7de" font-size="22">(and the SI you bring)</text>
  <path d="M 450 220 L 450 245" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,268 436,244 464,244" fill="#ff4d6d"/>

  <!-- Transports -->
  <rect x="70" y="270" width="760" height="140" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="324" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">Transports</text>
  <text x="450" y="362" text-anchor="middle" fill="#ffd7de" font-size="22">(email · DTLS · file — the job travels</text>
  <text x="450" y="390" text-anchor="middle" fill="#ffd7de" font-size="22">signed and encrypted)</text>
  <path d="M 450 410 L 450 435" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,458 436,434 464,434" fill="#ff4d6d"/>

  <!-- The Door -->
  <rect x="70" y="460" width="760" height="300" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="516" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">The Door</text>
  <text x="450" y="552" text-anchor="middle" fill="#ffd7de" font-size="21">(the runner's front gate — only signed jobs pass)</text>
  <rect x="120" y="578" width="660" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="450" y="619" text-anchor="middle" fill="#ffffff" font-size="25">Signature Check</text>
  <path d="M 450 642 L 450 655" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="450,670 440,654 460,654" fill="#ff4d6d"/>
  <rect x="120" y="672" width="660" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="450" y="713" text-anchor="middle" fill="#ffffff" font-size="25">Job Queue</text>
  <path d="M 450 760 L 450 825" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,848 436,824 464,824" fill="#ff4d6d"/>

  <!-- The Runner, and the SI's Mind beside it -->
  <rect x="70" y="850" width="500" height="330" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="320" y="902" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">The Runner</text>
  <rect x="88" y="917" width="152" height="118" rx="16" fill="none" stroke="#3ddc97" stroke-width="3"/>
  <rect x="95" y="924" width="138" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="164" y="966" text-anchor="middle" fill="#ffffff" font-size="18">Shared-Secret</text>
  <text x="164" y="990" text-anchor="middle" fill="#ffffff" font-size="18">Check</text>
  <rect x="251" y="924" width="138" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="320" y="966" text-anchor="middle" fill="#ffffff" font-size="18">The Cage</text>
  <text x="320" y="990" text-anchor="middle" fill="#ffd7de" font-size="14">(security modes,</text>
  <text x="320" y="1010" text-anchor="middle" fill="#ffd7de" font-size="14">on by default)</text>
  <rect x="407" y="924" width="138" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="476" y="960" text-anchor="middle" fill="#ffffff" font-size="18">The Oracle</text>
  <text x="476" y="984" text-anchor="middle" fill="#ffd7de" font-size="14">(reads the job,</text>
  <text x="476" y="1002" text-anchor="middle" fill="#ffd7de" font-size="14">lends a hand)</text>
  <rect x="95" y="1046" width="450" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="320" y="1088" text-anchor="middle" fill="#ffffff" font-size="20">Size Guard</text>
  <text x="320" y="1116" text-anchor="middle" fill="#ffd7de" font-size="15">(caps on the job and the result)</text>
  <rect x="640" y="924" width="190" height="150" rx="14" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="735" y="980" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">The SI's</text>
  <text x="735" y="1012" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">Mind</text>
  <text x="735" y="1042" text-anchor="middle" fill="#ffd7de" font-size="16">(outside the box)</text>
  <!-- version 2: the two-way line is the Runner-to-SI Exchange -->
  <path d="M 589 976 L 621 976" fill="none" stroke="#4da3ff" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="572,976 590,966 590,986" fill="#4da3ff"/>
  <polygon points="638,976 620,966 620,986" fill="#4da3ff"/>
  <path d="M 605 964 L 605 914" fill="none" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="584" y="862" fill="#bfe0ff" font-size="17" font-weight="bold">Runner-to-SI Exchange (v2)</text>
  <text x="584" y="884" fill="#bfe0ff" font-size="15">the runner asks, the SI answers</text>
  <text x="584" y="904" fill="#8fc4f5" font-size="14">signed, over the same transports</text>
  <path d="M 320 1180 L 320 1205" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="320,1228 306,1204 334,1204" fill="#ff4d6d"/>

  <!-- The Work Loop -->
  <rect x="70" y="1230" width="760" height="170" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="1290" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">The Work Loop</text>
  <text x="450" y="1336" text-anchor="middle" fill="#ffd7de" font-size="22">run the job → capture the output → sign the result</text>
  <!-- the order of the three steps, left to right -->
  <path d="M 180 1366 L 705 1366" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="720,1366 704,1357 704,1375" fill="#ff4d6d"/>
  <path d="M 450 1400 L 450 1425" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,1448 436,1424 464,1424" fill="#ff4d6d"/>

  <!-- The Way Back -->
  <rect x="70" y="1450" width="760" height="180" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="1508" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">The Way Back</text>
  <rect x="120" y="1536" width="290" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="265" y="1577" text-anchor="middle" fill="#ffffff" font-size="23">Signed Result</text>
  <path d="M 410 1568 L 471 1568" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="488,1568 470,1558 470,1578" fill="#ff4d6d"/>
  <rect x="490" y="1536" width="290" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="635" y="1577" text-anchor="middle" fill="#ffffff" font-size="23">Reply to Your SI</text>

  <!-- version 3: the session between the two holders of the shared secret -->
  <path d="M 110 255 L 52 255 L 52 976 L 66 976" fill="none" stroke="#3ddc97" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="110,229 97,253 123,253" fill="#3ddc97"/>
  <polygon points="87,976 65,963 65,989" fill="#3ddc97"/>
  <path d="M 52 804 L 76 804" fill="none" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="84" y="789" fill="#c8f7e1" font-size="17" font-weight="bold">DTLS via email (v3)</text>
  <text x="84" y="810" fill="#c8f7e1" font-size="15">a session keyed by the shared secret</text>
  <text x="84" y="829" fill="#93e6c2" font-size="14">every job still passes The Door</text>

  <!-- one SI: the SI you bring is the mind the runner asks -->
  <path d="M 800 220 L 800 246 L 866 246 L 866 1102 L 735 1102 L 735 1074" fill="none" stroke="#4da3ff" stroke-width="3" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <circle cx="800" cy="220" r="6" fill="#4da3ff"/>
  <circle cx="735" cy="1074" r="6" fill="#4da3ff"/>
  <text x="788" y="252" text-anchor="end" fill="#bfe0ff" font-size="16" font-weight="bold">the same SI</text>
  <text x="723" y="1107" text-anchor="end" fill="#bfe0ff" font-size="16" font-weight="bold">the same SI</text>

  <!-- the way back up to you -->
  <path d="M 70 1540 L 34 1540 L 34 155 L 49 155" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="68,155 48,144 48,166" fill="#ff4d6d"/>
</svg>
