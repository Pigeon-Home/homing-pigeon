<svg xmlns="http://www.w3.org/2000/svg" width="863" height="1630" viewBox="0 0 863 1630" font-family="Helvetica, Arial, sans-serif">
  <title>Homing Pigeon — how it fits together</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b060d"/>
      <stop offset="1" stop-color="#17030a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57101e"/>
      <stop offset="1" stop-color="#3a0a15"/>
    </linearGradient>
  </defs>
  <rect width="863" height="1630" fill="url(#bg)"/>
  <text x="450" y="58" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">Homing Pigeon — How It Fits Together</text>

  <!-- You -->
  <rect x="70" y="90" width="760" height="130" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="148" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">You</text>
  <text x="450" y="188" text-anchor="middle" fill="#ffd7de" font-size="22">(and the SI you bring)</text>
  <path d="M 450 220 L 450 245" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,268 436,244 464,244" fill="#ff4d6d"/>

  <!-- Transports -->
  <rect x="70" y="270" width="760" height="140" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="324" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">Transports</text>
  <text x="450" y="362" text-anchor="middle" fill="#ffd7de" font-size="22">(email · DTLS · file — the job travels</text>
  <text x="450" y="390" text-anchor="middle" fill="#ffd7de" font-size="22">signed and encrypted)</text>
  <path d="M 450 410 L 450 435" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,458 436,434 464,434" fill="#ff4d6d"/>

  <!-- The Door -->
  <rect x="70" y="460" width="760" height="300" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="516" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold">The Door</text>
  <text x="450" y="552" text-anchor="middle" fill="#ffd7de" font-size="21">(the runner's front gate — only signed jobs pass)</text>
  <rect x="120" y="578" width="660" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="450" y="619" text-anchor="middle" fill="#ffffff" font-size="25">Signature Check</text>
  <path d="M 450 642 L 450 655" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="450,670 440,654 460,654" fill="#ff4d6d"/>
  <rect x="120" y="672" width="660" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="450" y="713" text-anchor="middle" fill="#ffffff" font-size="25">Job Queue</text>
  <path d="M 450 760 L 450 785" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,808 436,784 464,784" fill="#ff4d6d"/>

  <!-- The Runner, and the SI's Mind beside it -->
  <rect x="70" y="810" width="500" height="330" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="320" y="862" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">The Runner</text>
  <rect x="95" y="884" width="138" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="164" y="926" text-anchor="middle" fill="#ffffff" font-size="18">Shared-Secret</text>
  <text x="164" y="950" text-anchor="middle" fill="#ffffff" font-size="18">Check</text>
  <rect x="251" y="884" width="138" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="320" y="926" text-anchor="middle" fill="#ffffff" font-size="18">The Cage</text>
  <text x="320" y="950" text-anchor="middle" fill="#ffd7de" font-size="14">(security modes,</text>
  <text x="320" y="970" text-anchor="middle" fill="#ffd7de" font-size="14">on by default)</text>
  <rect x="407" y="884" width="138" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="476" y="920" text-anchor="middle" fill="#ffffff" font-size="18">The Oracle</text>
  <text x="476" y="944" text-anchor="middle" fill="#ffd7de" font-size="14">(reads the job,</text>
  <text x="476" y="962" text-anchor="middle" fill="#ffd7de" font-size="14">lends a hand)</text>
  <rect x="95" y="1006" width="450" height="104" rx="10" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="320" y="1048" text-anchor="middle" fill="#ffffff" font-size="20">Size Guard</text>
  <text x="320" y="1076" text-anchor="middle" fill="#ffd7de" font-size="15">(caps on the job and the result)</text>
  <rect x="640" y="884" width="190" height="150" rx="14" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="735" y="940" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">The SI's</text>
  <text x="735" y="972" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">Mind</text>
  <text x="735" y="1002" text-anchor="middle" fill="#ffd7de" font-size="16">(outside the box)</text>
  <path d="M 589 936 L 621 936" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="572,936 590,926 590,946" fill="#ff4d6d"/>
  <polygon points="638,936 620,926 620,946" fill="#ff4d6d"/>
  <path d="M 320 1140 L 320 1165" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="320,1188 306,1164 334,1164" fill="#ff4d6d"/>

  <!-- The Work Loop -->
  <rect x="70" y="1190" width="760" height="170" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="1250" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">The Work Loop</text>
  <text x="450" y="1296" text-anchor="middle" fill="#ffd7de" font-size="22">run the job → capture the output → sign the result</text>
  <!-- the order of the three steps, left to right -->
  <path d="M 180 1326 L 705 1326" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="720,1326 704,1317 704,1335" fill="#ff4d6d"/>
  <path d="M 450 1360 L 450 1385" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,1408 436,1384 464,1384" fill="#ff4d6d"/>

  <!-- The Way Back -->
  <rect x="70" y="1410" width="760" height="180" rx="18" fill="url(#box)" stroke="#ff4d6d" stroke-width="3"/>
  <text x="450" y="1468" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">The Way Back</text>
  <rect x="120" y="1496" width="290" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="265" y="1537" text-anchor="middle" fill="#ffffff" font-size="23">Signed Result</text>
  <path d="M 410 1528 L 471 1528" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="488,1528 470,1518 470,1538" fill="#ff4d6d"/>
  <rect x="490" y="1496" width="290" height="64" rx="12" fill="#460c18" stroke="#ff8098" stroke-width="2"/>
  <text x="635" y="1537" text-anchor="middle" fill="#ffffff" font-size="23">Reply to Your SI</text>

  <!-- the way back up to you -->
  <path d="M 70 1500 L 34 1500 L 34 155 L 49 155" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="68,155 48,144 48,166" fill="#ff4d6d"/>
</svg>
